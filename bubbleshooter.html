<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Bubble Shooter</title>
<style>
  :root{
    --bg:#111;
    --ink:#eee;
    --muted:#bbb;
    --dim:#777;
    --dimmer:#444;
    --panel:#1a1a1a;
    --accent:#ccc;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial}
  body{overflow-x:hidden}
  .wrap{max-width:1000px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .title{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px}
  .title a{color:var(--muted);text-decoration:none;font-size:22px;line-height:1;padding:0 4px}
  .title a:hover{color:#fff}
  .logo-dot{width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#e0fdff,#22d3ee 40%,#7c3aed 85%,#2e1065);
    box-shadow:0 0 12px rgba(34,211,238,.55);animation:dotfloat 1.6s infinite ease-in-out alternate}
  @keyframes dotfloat{from{transform:translateY(2px) scale(.94,1.06)}to{transform:translateY(-3px) scale(1.06,.94)}}
  .hud{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
  .pill{
    background:var(--panel);border:1px solid var(--dimmer);
    padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:4px;
    box-shadow:var(--shadow);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap
  }
  .pill b{color:#fff}
  .pill.bump{animation:bump .25s ease-out}
  @keyframes bump{50%{transform:scale(1.12);border-color:#aaa}}
  .pill.hot{animation:warn .5s infinite alternate}
  @keyframes warn{to{background:#3a3a3a;border-color:#ddd;color:#fff}}
  .btn{
    border:1px solid var(--dimmer);background:linear-gradient(#1e1e1e,#161616);
    color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .1s ease,background .2s ease,border-color .2s ease;font-size:14px
  }
  .btn:hover{border-color:#888;background:linear-gradient(#262626,#1a1a1a)}
  .btn:active{transform:scale(.97)}
  .btn.big{padding:12px 26px;font-size:16px;background:linear-gradient(#f4f4f4,#bdbdbd);color:#111;border-color:#ddd}
  .btn.big:hover{background:linear-gradient(#fff,#d0d0d0)}
  .frame{
    background:radial-gradient(1200px 600px at 50% -100px,#202020 20%,#111 60%,#0d0d0d 100%);
    border:1px solid #2b2b2b;border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)
  }
  canvas{display:block;margin:0 auto;border-radius:12px;background:#121212;cursor:crosshair;touch-action:none}
  footer{color:var(--dim);font-size:12px;text-align:center;line-height:2}
  code.k{background:#1a1a1a;border:1px solid #2a2a2a;padding:2px 6px;border-radius:6px;color:var(--ink);font-size:12px}

  /* ---------- Overlay & popups ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;
    display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:16px
  }
  .overlay.show{display:flex}
  .modal{
    position:relative;width:min(92vw,600px);max-height:94vh;overflow:auto;
    background:linear-gradient(#171717,#0e0e0e);
    border:1px solid #2e2e2e;border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    text-align:center;animation:pop .45s cubic-bezier(.2,.9,.2,1) both
  }
  .modal::after{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);
    background-size:250% 100%;animation:sheen 3.5s ease-in-out infinite
  }
  @keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
  @keyframes pop{
    0%{transform:scale(.8) translateY(30px);opacity:0}
    70%{transform:scale(1.03);opacity:1}
    100%{transform:scale(1)}
  }
  .modal h2{margin:4px 0 8px;font-size:40px;font-weight:900;letter-spacing:4px;line-height:1.1}
  .modal .kicker{color:var(--dim);font-size:12px;letter-spacing:3px;text-transform:uppercase}
  .meta{color:var(--muted);font-size:14px;margin:6px 0 14px;line-height:1.5}
  .hint{color:var(--dim);font-size:12px;margin-top:10px}
  .letters span{display:inline-block}
  .letters .sp{width:.4em}
  .letters.drop span{animation:drop .8s cubic-bezier(.25,1.45,.5,1) both;animation-delay:calc(var(--i) * 70ms)}
  @keyframes drop{
    0%{transform:translateY(-160px) rotate(-25deg);opacity:0}
    55%{transform:translateY(12px) rotate(6deg);opacity:1}
    75%{transform:translateY(-6px) rotate(-2deg)}
    100%{transform:none}
  }
  .letters.popin span{animation:popin .55s cubic-bezier(.2,1.7,.4,1) both;animation-delay:calc(var(--i) * 55ms)}
  @keyframes popin{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
  .letters.float span{animation:popin .55s cubic-bezier(.2,1.7,.4,1) both, bob 2.2s ease-in-out infinite alternate;
    animation-delay:calc(var(--i) * 55ms), calc(.6s + var(--i) * 120ms)}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
  .shine h2{color:#fff;animation:glow 1.8s ease-in-out infinite alternate}
  @keyframes glow{from{text-shadow:0 0 6px rgba(255,255,255,.2)}to{text-shadow:0 0 22px rgba(255,255,255,.75)}}
  .modal.over{animation:pop .45s cubic-bezier(.2,.9,.2,1) both, shake .5s .8s both}
  @keyframes shake{
    15%{translate:-10px 4px}30%{translate:9px -3px}45%{translate:-6px 2px}60%{translate:4px -1px}80%{translate:-2px 0}100%{translate:0 0}
  }
  .crack-wrap{position:relative;display:inline-block}
  .crack{position:absolute;left:-4%;top:38%;width:108%;height:40px;overflow:visible;pointer-events:none}
  .crack path{fill:none;stroke:#e8e8e8;stroke-width:2.5;stroke-linejoin:bevel;stroke-dasharray:420;stroke-dashoffset:420;
    filter:drop-shadow(0 0 4px rgba(255,255,255,.6));animation:draw .35s .78s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 16px}
  .stat{background:#121212;border:1px solid #262626;border-radius:14px;padding:10px;opacity:0;animation:rise .4s ease-out forwards;animation-delay:calc(.35s + var(--i) * 90ms)}
  .stat.wide{grid-column:1 / -1}
  .stat span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1.5px}
  .stat b{display:block;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat.wide b{font-size:32px}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .badge{display:inline-block;margin:0 0 12px;padding:4px 12px;border-radius:999px;font-weight:900;font-size:12px;letter-spacing:2px;
    background:linear-gradient(90deg,#6a6a6a,#fff,#6a6a6a);background-size:200% 100%;color:#111;animation:shimmer 1.2s linear infinite}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-100% 0}}

  /* Start screen */
  .logo{display:flex;justify-content:center;gap:8px;margin:18px 0 8px;height:96px;align-items:center}
  .logo span{
    width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
    font-weight:900;font-size:28px;color:var(--fg);
    background:radial-gradient(circle at 35% 30%,var(--hi),var(--base) 45%,var(--lo));
    box-shadow:0 0 22px var(--base),inset 0 -6px 10px var(--lo),inset 0 0 0 1.5px rgba(255,255,255,.35);
    position:relative;animation:wobble 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * -340ms)
  }
  .logo span::after{content:"";position:absolute;left:18%;top:14%;width:30%;height:18%;border-radius:50%;
    background:rgba(255,255,255,.6);transform:rotate(-30deg)}
  @keyframes wobble{
    0%,100%{transform:translateY(0) scale(1)}
    25%{transform:translateY(-14px) scale(.95,1.05)}
    50%{transform:translateY(0) scale(1.06,.94)}
    75%{transform:translateY(10px) scale(.98,1.02)}
  }
  .ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin:10px 0}
  .ctrl{background:#121212;border:1px solid #262626;border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:2}
  .ctrl h4{margin:0 0 2px;color:var(--ink);font-size:14px}
  .sect{color:var(--dim);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin:12px 0 0}
  .powers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 14px}
  .chip{display:flex;align-items:center;gap:6px;border:1px solid var(--dimmer);background:var(--panel);
    border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
  .chip .glyph{min-width:20px;height:20px;padding:0 3px;border-radius:50%;border:1.5px solid #ddd;display:grid;place-items:center;
    font-size:11px;color:#fff;background:#0f0f0f;font-weight:800}

  /* Wave clear */
  .stars{display:flex;justify-content:center;gap:14px;margin:6px 0 0;height:64px;align-items:center}
  .star{font-size:50px;line-height:1;color:#2c2c2c;text-shadow:0 1px 0 #000}
  .star.on{color:#fff;animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(.55s + var(--i) * 260ms);
    text-shadow:0 0 20px rgba(255,255,255,.8)}
  .star.mid{font-size:62px}
  @keyframes stamp{0%{transform:scale(3.2) rotate(-40deg);opacity:0}60%{transform:scale(.88) rotate(4deg);opacity:1}100%{transform:none;opacity:1}}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
  #fx.back{z-index:19}
  .flash{position:absolute;inset:0;background:#fff;animation:flash 1.1s ease-out forwards}
  @keyframes flash{from{opacity:.85}to{opacity:0}}
  .bub{position:absolute;bottom:-90px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;
    border:1.5px solid var(--c);box-shadow:0 0 14px var(--c),inset 0 0 12px var(--c);
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.18) 26%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.22));
    animation:bubrise var(--d) cubic-bezier(.35,.1,.55,1) var(--delay) forwards;opacity:0}
  @keyframes bubrise{
    0%{transform:translate(0,0);opacity:1}
    25%{transform:translate(var(--sx),calc(var(--h) * .25))}
    50%{transform:translate(calc(var(--sx) * -1),calc(var(--h) * .5))}
    88%{transform:translate(var(--sx),var(--h)) scale(1);opacity:1}
    100%{transform:translate(var(--sx),var(--h)) scale(1.9);opacity:0;border-width:0}
  }
  .ring{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
    border:3px solid rgba(255,255,255,.9);animation:ringout 1.1s cubic-bezier(.1,.7,.3,1) var(--delay) both}
  @keyframes ringout{from{transform:scale(.2);opacity:1}to{transform:scale(28);opacity:0}}
  .sink{position:absolute;top:-90px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#7a7a7a,#3a3a3a 50%,#161616);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);opacity:.75;
    animation:sink var(--d) cubic-bezier(.5,0,.75,.6) var(--delay) forwards}
  @keyframes sink{
    0%{transform:translateY(0) rotate(0)}
    100%{transform:translateY(calc(100vh + 200px)) rotate(var(--r))}
  }
  @media (max-width:560px){
    .ctrl-grid{grid-template-columns:1fr}
    .logo span{width:38px;height:38px;font-size:19px}
    .logo{gap:5px;height:76px}
    .modal h2{font-size:30px;letter-spacing:2px}
    .modal{padding:18px}
    .star{font-size:40px}.star.mid{font-size:50px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <a href="index.html" title="Back to games" aria-label="Back to games">‹</a>
        <span class="logo-dot"></span>
        <div>Bubble Shooter</div>
      </div>
      <div class="hud">
        <div class="pill" id="scorePill">Score&nbsp;<b id="score">0</b></div>
        <div class="pill">Wave&nbsp;<b id="wave">1</b></div>
        <div class="pill" id="comboPill">Combo&nbsp;<b id="combo">×1</b></div>
        <div class="pill">Best&nbsp;<b id="best">0</b></div>
        <div class="pill" title="Active perks">✦&nbsp;<b id="perks">–</b></div>
        <button class="btn" id="muteBtn">♪ On</button>
        <button class="btn" id="pauseBtn">Pause</button>
      </div>
    </header>
    <div class="frame">
      <canvas id="game" aria-label="Bubble shooter game"></canvas>
    </div>
    <footer>
      Aim with the mouse or <code class="k">←</code><code class="k">→</code>
      &nbsp;•&nbsp; Fire: click / <code class="k">Space</code>
      &nbsp;•&nbsp; Swap: right-click / <code class="k">X</code>
      &nbsp;•&nbsp; Powers <code class="k">1</code>–<code class="k">4</code>
      &nbsp;•&nbsp; Pause <code class="k">P</code>
      &nbsp;•&nbsp; Touch: drag to aim, release to fire
    </footer>
  </div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="modal" id="modal"></div>
  </div>
  <div id="fx"></div>

<script>
(() => {
  'use strict';

  // ---------- Tuning ----------
  const W = 520, H = 760, R = 20, D = R * 2, COLS = 12, ROWH = R * Math.sqrt(3);
  const FX = 20, FW = COLS * D, TOP = 16, DEATH_Y = 620, TRAY_Y = 644;
  const DEATH_ROW = Math.floor((DEATH_Y - TOP - D) / ROWH);
  const SX = W / 2, SY = 694, NX = SX - 64, NY = SY + 26;
  const SHOT_SPEED = 1250, LASER_SPEED = 1050, STEP = 1 / 120;
  const MIN_ANG = 0.16, AIM_SPEED = 1.6, HIT_DIST = D * 0.8;
  const CHARGE_MAX = 80, POWER_MAX = 3, GUIDE_LEN = 240;
  const PRESS_EXTRA = 2, SIGHT_SHOTS = 12, DOUBLE_SHOTS = 10, CALM_SHOTS = 4;
  const INTRO_LEN = 1.9, CLEAR_LEN = 1.7, DEATH_LEN = 1.9;
  const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const DEBUG = /[?&]debug=1\b/.test(location.search);
  const TAU = Math.PI * 2;

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = n => Math.floor(Math.random() * n);
  const pick = arr => arr[randInt(arr.length)];
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = randInt(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  function weighted(table) {
    let tot = 0;
    for (const k in table) tot += table[k];
    let r = Math.random() * tot;
    for (const k in table) { r -= table[k]; if (r <= 0) return k; }
    return Object.keys(table)[0];
  }

  // ---------- Bubbles, powers & perks ----------
  // Six jewel-tone colours; each also carries a faint embossed glyph so colour-blind players can tell them apart.
  // The first four (used on early waves) are the most distinct hues.
  const SHADES = [
    { name: 'Aqua',     hi: '#d9fdff', base: '#22d3ee', lo: '#0e7490', deep: '#062f3c', glow: '#67e8f9', shape: 'dot' },
    { name: 'Fuchsia',  hi: '#ffd6f3', base: '#ec4899', lo: '#a3195b', deep: '#3d0820', glow: '#f9a8d4', shape: 'tri' },
    { name: 'Lime',     hi: '#ecffd0', base: '#84cc16', lo: '#3f7a0b', deep: '#172b05', glow: '#bef264', shape: 'square' },
    { name: 'Violet',   hi: '#eedcff', base: '#a855f7', lo: '#6321b8', deep: '#22093f', glow: '#d8b4fe', shape: 'diamond' },
    { name: 'Sunburst', hi: '#fff6c8', base: '#fbbf24', lo: '#c2700a', deep: '#3f1d02', glow: '#fde68a', shape: 'star' },
    { name: 'Sapphire', hi: '#d6e6ff', base: '#3b82f6', lo: '#1d43b8', deep: '#0b1640', glow: '#93c5fd', shape: 'cross' }
  ];
  const hexA = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
  const shadeOf = k => k >= 0 ? SHADES[k] : null;
  const POWERS = {
    bomb:      { g: '✸', name: 'Bomb', desc: 'blasts everything near impact', w: 30 },
    rainbow:   { g: '◈', name: 'Rainbow', desc: 'matches any colour it touches', w: 30 },
    laser:     { g: '↟', name: 'Laser', desc: 'pierces straight through', w: 20 },
    lightning: { g: 'ϟ', name: 'Colour Strike', desc: 'wipes every bubble of the colour it hits', w: 20 }
  };
  const POWER_KEYS = Object.keys(POWERS);
  const PERKS = {
    sight:  { g: '◉', name: 'Long Sight', desc: `full aim guide for ${SIGHT_SHOTS} shots` },
    double: { g: '×2', name: 'Double Score', desc: `double points for ${DOUBLE_SHOTS} shots` },
    calm:   { g: '≋', name: 'Calm Tide', desc: `+${CALM_SHOTS} shots before the next row` }
  };
  const GIFT_W = { bomb: 18, rainbow: 18, laser: 12, lightning: 12, sight: 14, double: 14, calm: 12 };
  const giftGlyph = k => (POWERS[k] || PERKS[k]).g;
  const giftName = k => (POWERS[k] || PERKS[k]).name;

  // ---------- Waves ----------
  function waveCfg(w) {
    return {
      colors: w <= 2 ? 4 : w <= 5 ? 5 : 6,
      rows: Math.min(10, 5 + Math.ceil(w / 2)),
      queue: Math.min(12, 2 + w),
      spr: w >= 12 ? 4 : Math.max(5, 9 - Math.ceil(w / 2)),
      pSame: Math.max(0.3, 0.62 - w * 0.03),
      stones: w >= 3 ? Math.min(10, w - 1) : 0,
      ice: w >= 4 ? Math.min(12, 2 + Math.floor((w - 4) * 1.5)) : 0,
      gifts: 2 + (w % 3 === 0 ? 1 : 0),
      rowStone: w >= 6 ? Math.min(0.08, 0.02 + (w - 6) * 0.01) : 0,
      rowIce: w >= 5 ? Math.min(0.08, 0.03 + (w - 5) * 0.01) : 0,
      rowGift: 0.14
    };
  }
  const TIPS = [
    'Chain pops back to back to grow your combo multiplier',
    'Glowing bubbles hold powers: pop them or drop them',
    'Cut a hanging bunch loose: dropped bubbles score double',
    'Big pops and big drops refund a shot',
    'Bank shots off the walls earn bonus points',
    'Clear the board early: every row left unsent is a bonus'
  ];
  function waveTip(w) {
    if (w === 1) return 'Match 3 or more · cut the threads to drop whole bunches';
    if (w === 2) return 'Bank shots off the walls earn bonus points';
    if (w === 3) return 'New: STONES can\'t be matched, so drop them';
    if (w === 4) return 'New: ICE thaws when a neighbour pops';
    if (w === 6) return 'Six colours from here on. Keep your aim sharp';
    return TIPS[w % TIPS.length];
  }

  // Formation masks: (row, col, u = 0..1 across the field, rows, extras) → filled?
  const hive = (u, r, n, cx) => ((u - cx) * 2.6) ** 2 + ((r - n * 0.5) / (n * 0.55)) ** 2 < 1;
  const FORMATIONS = [
    { name: 'Curtain Call', tier: 0, color: 'cluster', mask: (r, c, u, n) => r < n - (Math.abs(u - 0.5) < 0.2 ? 2 : 0) },
    { name: 'Patchwork', tier: 0, color: 'patches', mask: () => true },
    { name: 'Chandelier', tier: 1, color: 'cluster', mask: (r, c, u, n) => r < 2 || Math.abs(u - 0.5) < (1 - r / n) * 0.6 + 0.08 },
    { name: 'Pillars', tier: 1, color: 'columns', mask: (r, c, u) => r < 2 || Math.floor(u * 5.999) % 2 === 0 },
    { name: 'High Tide', tier: 1, color: 'cluster', mask: (r, c, u, n, X) => r < n * 0.6 + Math.sin(u * TAU * 1.5 + X.ph) * n * 0.4 },
    { name: 'Honeycomb', tier: 2, color: 'patches', mask: (r, c) => !(r >= 2 && r % 3 === 2 && c % 3 === 1) },
    { name: 'Twin Hives', tier: 2, color: 'cluster', mask: (r, c, u, n) => r < 2 || hive(u, r, n, 0.24) || hive(u, r, n, 0.76) },
    { name: 'Staircase', tier: 2, color: 'bands', mask: (r, c, u, n, X) => r <= 1 + (X.flip ? u : 1 - u) * (n - 0.5) },
    { name: 'Crossbones', tier: 3, color: 'cluster', mask: (r, c, u, n) => r < 2 || Math.abs(u - (0.1 + r / n * 0.8)) < 0.13 || Math.abs(u - (0.9 - r / n * 0.8)) < 0.13 },
    { name: 'Fortress', tier: 3, color: 'patches', mask: (r, c, u, n) => r < 2 || u < 0.16 || u > 0.84 || r >= n - 2 },
    { name: 'Tentacles', tier: 3, color: 'columns', mask: (r, c, u, n, X) => r < 2 || (c % 3 !== 0 && r < X.lens[Math.floor(c / 3)]) }
  ];
  function chooseFormation(w) {
