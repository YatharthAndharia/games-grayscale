<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Grayscale Paddle Pong</title>
<style>
  :root{
    --bg:#111;
    --ink:#eee;
    --muted:#bbb;
    --dim:#777;
    --dimmer:#444;
    --panel:#1a1a1a;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial}
  body{overflow-x:hidden}
  .wrap{max-width:1000px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .title{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px}
  .title a{color:var(--muted);text-decoration:none;font-size:22px;line-height:1;padding:0 4px}
  .title a:hover{color:#fff}
  .logo-puck{width:18px;height:18px;border-radius:50%;background:#0d0d0d;border:3px solid #ddd;
    box-shadow:0 0 10px rgba(255,255,255,.25);animation:slide 1.4s infinite cubic-bezier(.5,0,.5,1) alternate}
  @keyframes slide{from{transform:translateX(-3px)}to{transform:translateX(4px)}}
  .hud{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
  .pill{
    background:var(--panel);border:1px solid var(--dimmer);
    padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:4px;
    box-shadow:var(--shadow);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap
  }
  .pill b{color:#fff}
  .pill .nm{color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis}
  .pill.bump{animation:bump .3s ease-out}
  @keyframes bump{50%{transform:scale(1.14);border-color:#bbb}}
  .pill.hot{animation:hot .5s infinite alternate}
  @keyframes hot{to{background:#3a3a3a;border-color:#ddd;color:#fff}}
  .pill.input{color:var(--muted);font-size:12px}
  .btn{
    border:1px solid var(--dimmer);background:linear-gradient(#1e1e1e,#161616);
    color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .1s ease,background .2s ease,border-color .2s ease;font-size:14px
  }
  .btn:hover{border-color:#888;background:linear-gradient(#262626,#1a1a1a)}
  .btn:active{transform:scale(.97)}
  .btn.big{padding:12px 26px;font-size:16px;background:linear-gradient(#f4f4f4,#bdbdbd);color:#111;border-color:#ddd}
  .btn.big:hover{background:linear-gradient(#fff,#d0d0d0)}
  .btn.sel{border-color:#ddd;background:linear-gradient(#3a3a3a,#262626);color:#fff}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .frame{
    background:radial-gradient(1200px 600px at 50% -100px,#202020 20%,#111 60%,#0d0d0d 100%);
    border:1px solid #2b2b2b;border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)
  }
  canvas{display:block;margin:0 auto;border-radius:14px;background:#121212;touch-action:none}
  footer{color:var(--dim);font-size:12px;text-align:center;line-height:2}
  code.k{background:#1a1a1a;border:1px solid #2a2a2a;padding:2px 6px;border-radius:6px;color:var(--ink);font-size:12px}

  /* ---------- Overlay & popups ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;
    display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);padding:16px
  }
  .overlay.show{display:flex}
  .modal{
    position:relative;width:min(94vw,640px);max-height:94vh;overflow:auto;
    background:linear-gradient(#171717,#0e0e0e);
    border:1px solid #2e2e2e;border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    text-align:center;animation:pop .45s cubic-bezier(.2,.9,.2,1) both
  }
  .modal::after{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);
    background-size:250% 100%;animation:sheen 3.5s ease-in-out infinite
  }
  @keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
  @keyframes pop{
    0%{transform:scale(.8) translateY(30px);opacity:0}
    70%{transform:scale(1.03);opacity:1}
    100%{transform:scale(1)}
  }
  .modal h2{margin:4px 0 8px;font-size:40px;font-weight:900;letter-spacing:4px;line-height:1.1}
  .modal .kicker{color:var(--dim);font-size:12px;letter-spacing:3px;text-transform:uppercase}
  .meta{color:var(--muted);font-size:14px;margin:6px 0 14px;line-height:1.5}
  .hint{color:var(--dim);font-size:12px;margin-top:10px}
  .letters span{display:inline-block}
  .letters .sp{width:.4em}
  .letters.drop span{animation:drop .8s cubic-bezier(.25,1.45,.5,1) both;animation-delay:calc(var(--i) * 70ms)}
  @keyframes drop{
    0%{transform:translateY(-160px) rotate(-25deg);opacity:0}
    55%{transform:translateY(12px) rotate(6deg);opacity:1}
    75%{transform:translateY(-6px) rotate(-2deg)}
    100%{transform:none}
  }
  .letters.popin span{animation:popin .55s cubic-bezier(.2,1.7,.4,1) both;animation-delay:calc(var(--i) * 55ms)}
  @keyframes popin{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
  .letters.slam span{animation:slam .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i) * 45ms)}
  @keyframes slam{0%{transform:translateX(-80px) skewX(-25deg);opacity:0}100%{transform:none;opacity:1}}
  .shine h2{color:#fff;animation:glow 1.8s ease-in-out infinite alternate}
  @keyframes glow{from{text-shadow:0 0 6px rgba(255,255,255,.2)}to{text-shadow:0 0 22px rgba(255,255,255,.75)}}
  .modal.lost{animation:pop .45s cubic-bezier(.2,.9,.2,1) both, shake .5s .8s both}
  @keyframes shake{
    15%{translate:-10px 4px}30%{translate:9px -3px}45%{translate:-6px 2px}60%{translate:4px -1px}80%{translate:-2px 0}100%{translate:0 0}
  }
  .crack-wrap{position:relative;display:inline-block}
  .crack{position:absolute;left:-4%;top:38%;width:108%;height:40px;overflow:visible;pointer-events:none}
  .crack path{fill:none;stroke:#e8e8e8;stroke-width:2.5;stroke-linejoin:bevel;stroke-dasharray:420;stroke-dashoffset:420;
    filter:drop-shadow(0 0 4px rgba(255,255,255,.6));animation:draw .35s .78s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 16px}
  .stat{background:#121212;border:1px solid #262626;border-radius:14px;padding:10px;opacity:0;animation:rise .4s ease-out forwards;animation-delay:calc(.35s + var(--i) * 90ms)}
  .stat.wide{grid-column:1 / -1}
  .stat span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1.5px}
  .stat b{display:block;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat.wide b{font-size:34px;letter-spacing:2px}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .badge{display:inline-block;margin:0 0 10px;padding:4px 12px;border-radius:999px;font-weight:900;font-size:12px;letter-spacing:2px;
    background:linear-gradient(90deg,#6a6a6a,#fff,#6a6a6a);background-size:200% 100%;color:#111;animation:shimmer 1.2s linear infinite}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-100% 0}}

  /* Title screen */
  .rink{position:relative;width:min(300px,80%);height:96px;margin:10px auto 4px;border-radius:16px;
    background:radial-gradient(circle at 50% 50%,#2b2b2b,#151515);border:5px solid #3a3a3a;overflow:hidden;
    box-shadow:inset 0 0 18px rgba(0,0,0,.8)}
  .rink::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.15)}
  .rink::after{content:"";position:absolute;left:50%;top:50%;width:40px;height:40px;translate:-50% -50%;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
  .rink .slot{position:absolute;top:30%;height:40%;width:5px;background:#000}
  .rink .slot.l{left:-3px}.rink .slot.r{right:-3px}
  .rink .m{position:absolute;width:34px;height:34px;border-radius:50%;top:31px;
    box-shadow:0 3px 6px rgba(0,0,0,.6);animation:guard 1.6s ease-in-out infinite}
  .rink .m.a{left:14px;background:radial-gradient(circle at 35% 30%,#fff,#bdbdbd 45%,#6a6a6a)}
  .rink .m.b{right:14px;background:radial-gradient(circle at 35% 30%,#777,#333 50%,#111);border:2px solid #ccc;animation-delay:-.8s}
  @keyframes guard{0%,100%{transform:translateY(-22px)}50%{transform:translateY(22px)}}
  .rink .pk{position:absolute;width:16px;height:16px;border-radius:50%;background:#0d0d0d;border:3px solid #eee;top:40px;left:48px;
    box-shadow:0 0 10px rgba(255,255,255,.4);animation:cross 1.6s linear infinite}
  @keyframes cross{
    0%{transform:translate(0,-22px)}25%{transform:translate(90px,24px)}50%{transform:translate(184px,22px)}
    75%{transform:translate(94px,-24px)}100%{transform:translate(0,-22px)}
  }
  .wordmark{font-size:38px;font-weight:900;letter-spacing:6px;margin:6px 0 0}
  .wordmark small{display:block;font-size:12px;letter-spacing:4px;color:var(--dim);font-weight:700;margin-top:2px}
  .ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .rival{position:relative;background:#121212;border:1px solid #262626;border-radius:14px;padding:8px 8px 7px;cursor:pointer;text-align:left;
    color:var(--ink);font:inherit;transition:border-color .15s ease,transform .1s ease}
  .rival:hover{border-color:#777}
  .rival:active{transform:scale(.97)}
  .rival .no{position:absolute;right:8px;top:6px;color:var(--dimmer);font-weight:900;font-size:18px}
  .rival .nm{display:block;font-weight:800;font-size:14px;padding-right:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rival .tb{display:block;color:var(--dim);font-size:11px}
  .rival .st{display:block;font-size:13px;letter-spacing:2px;color:#fff;margin-top:2px}
  .rival .st i{font-style:normal;color:#3a3a3a}
  .rival.next{border-color:#cfcfcf;box-shadow:0 0 16px rgba(255,255,255,.12)}
  .rival.boss .nm::before{content:"⚠ "}
  .rival:disabled{cursor:not-allowed;opacity:.35}
  .rival:disabled:hover{border-color:#262626}
  .modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 2px}
  .ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin:10px 0}
  .ctrl{background:#121212;border:1px solid #262626;border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:2}
  .ctrl h4{margin:0 0 2px;color:var(--ink);font-size:14px}
  .powers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 14px}
  .chip{display:flex;align-items:center;gap:6px;border:1px solid var(--dimmer);background:var(--panel);
    border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
  .chip .glyph{width:20px;height:20px;border-radius:6px;border:1.5px solid #ddd;display:grid;place-items:center;
    font-size:11px;color:#fff;background:#0f0f0f;font-weight:800}
  .tables{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}

  /* Rival intro */
  .vs{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 4px}
  .disc{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:24px;
    box-shadow:0 8px 20px rgba(0,0,0,.6);animation:popin .6s cubic-bezier(.2,1.7,.4,1) both}
  .disc.you{background:radial-gradient(circle at 35% 30%,#fff,#bdbdbd 45%,#6a6a6a);color:#222}
  .disc.foe{background:radial-gradient(circle at 35% 30%,#777,#333 50%,#111);border:3px solid #ddd;color:#fff;animation-delay:.15s}
  .disc.foe.boss{width:84px;height:84px;animation:popin .6s .15s cubic-bezier(.2,1.7,.4,1) both,pulse 1.2s 1s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 30px rgba(255,255,255,.5)}}
  .vs .x{font-weight:900;font-size:22px;color:var(--dim)}
  .meters{display:grid;gap:6px;margin:12px auto 14px;max-width:360px;text-align:left}
  .meter{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
  .meter i{display:block;height:8px;border-radius:99px;background:#1f1f1f;border:1px solid #2c2c2c;overflow:hidden}
  .meter i::after{content:"";display:block;height:100%;width:var(--v);background:linear-gradient(90deg,#777,#fff);
    border-radius:inherit;animation:fill .8s .3s cubic-bezier(.2,.9,.2,1) both}
  @keyframes fill{from{width:0}}
  .rule{display:inline-block;background:#121212;border:1px solid #2a2a2a;border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
  .rule b{color:#fff}

  /* Results */
  .stars{display:flex;justify-content:center;gap:10px;margin:6px 0 4px;font-size:46px;line-height:1}
  .stars span{color:#2c2c2c;text-shadow:none}
  .stars span.on{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.7);animation:star .6s cubic-bezier(.2,1.8,.4,1) both;animation-delay:calc(.5s + var(--i) * 220ms)}
  @keyframes star{0%{transform:scale(0) rotate(-90deg);color:#2c2c2c}100%{transform:none}}
  .crown-wrap{position:relative;height:110px;display:grid;place-items:center;margin-top:4px}
  .rays{position:absolute;left:50%;top:50%;width:300px;height:300px;translate:-50% -50%;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,255,255,.13) 0 9deg,transparent 9deg 18deg);
    -webkit-mask:radial-gradient(circle,#000 15%,transparent 65%);mask:radial-gradient(circle,#000 15%,transparent 65%);
    animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .crown{position:relative;font-size:76px;line-height:1;color:#fff;text-shadow:0 0 24px rgba(255,255,255,.8);
    animation:crownIn 1s .25s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes crownIn{0%{transform:translateY(-120px) scale(.3) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
  .flash{position:absolute;inset:0;background:#fff;animation:flash 1.1s ease-out forwards}
  @keyframes flash{from{opacity:1}to{opacity:0}}
  .shard{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);
    background:linear-gradient(135deg,#fff,#8a8a8a);opacity:0;
    animation:fly 1.6s cubic-bezier(.1,.7,.3,1) forwards}
  @keyframes fly{
    0%{transform:translate(-50%,-50%) rotate(0);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r));opacity:0}
  }
  @media (max-width:560px){
    .ctrl-grid{grid-template-columns:1fr}
    .ladder,.tables{grid-template-columns:repeat(2,1fr)}
    .stats{grid-template-columns:1fr 1fr}
    .modal h2{font-size:30px;letter-spacing:2px}
    .wordmark{font-size:28px}
    .modal{padding:16px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <a href="index.html" title="Back to games" aria-label="Back to games">‹</a>
        <span class="logo-puck"></span>
        <div>Paddle Pong</div>
      </div>
      <div class="hud">
        <div class="pill">Match&nbsp;<b id="match">–</b></div>
        <div class="pill" id="scorePill"><span class="nm" id="n0">You</span>&nbsp;<b id="s0">0</b>&nbsp;:&nbsp;<b id="s1">0</b>&nbsp;<span class="nm" id="n1">Rival</span></div>
        <div class="pill" id="rallyPill">Rally&nbsp;<b id="rally">0</b></div>
        <div class="pill" title="Active powers">✦&nbsp;<b id="power">–</b></div>
        <div class="pill input" id="inputChip" title="Last used input">◉ Mouse</div>
        <button class="btn" id="muteBtn">♪ On</button>
        <button class="btn" id="pauseBtn">Pause</button>
      </div>
    </header>
    <div class="frame">
      <canvas id="game" aria-label="Paddle Pong air hockey table"></canvas>
    </div>
    <footer>
      Mouse / touch: slide your mallet up and down
      &nbsp;•&nbsp; Keys <code class="k">W</code><code class="k">S</code> / <code class="k">↑</code><code class="k">↓</code>
      &nbsp;•&nbsp; Push <code class="k">Space</code> / click / tap
      &nbsp;•&nbsp; Pause <code class="k">P</code>
      &nbsp;•&nbsp; 2 Players: right side <code class="k">↑</code><code class="k">↓</code> + <code class="k">Enter</code> push
    </footer>
  </div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="modal" id="modal"></div>
  </div>
  <div id="fx"></div>

<script>
(() => {
  'use strict';

  // ---------- Tuning ----------
  const W = 960, H = 560, RAIL = 18, CX = W / 2, CY = H / 2;
  const GOAL_H = 176, G_TOP = CY - GOAL_H / 2, G_BOT = CY + GOAL_H / 2;
  const PUCK_R = 15, MALLET_R = 30, POST_R = 4, TOKEN_R = 17;
  const STEP = 1 / 120;
  const POINTER_MAX = 1500, KEY_SPEED = 640, KEY_ACCEL = 5200;
  const DASH_SPEED = 1300, DASH_TIME = 0.14, DASH_CD = 0.65;
  // Push: a quick lunge off the mallet's line that drives the puck forward
  const PUSH_DIST = 80, PUSH_OUT = 0.08, PUSH_HOLD = 0.04, PUSH_BACK = 0.2, PUSH_CD = 0.5, TAP_TIME = 0.22;
  const PUCK_MAX = 1350, PUCK_MIN_LIVE = 25, WALL_E = 0.88, HIT_E = 0.8, FRICTION = 0.2;
  const SMASH_SPEED = 950, KMH = 0.08, FACEOFF_X = 170;
  const MALLET_X = RAIL + 56, SERVE_X = 60, BASE_PACE = 420, RALLY_PACE = 24, MIN_ANGLE_VX = 0.38;
  const POWER_FIRST = 7, POWER_EVERY = [9, 14], TOKEN_LIFE = 12;
  const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const DEBUG = /[?&]debug=1\b/.test(location.search);
  const TAU = Math.PI * 2;

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, k) => a + (b - a) * k;
  const rand = (a, b) => a + Math.random() * (b - a);
  const $ = id => document.getElementById(id);

  // ---------- Tables ----------
  const TABLES = {
    classic: { name: 'Classic', desc: 'A clean rink. Pure skill decides it.' },
    pegs:    { name: 'Peg Line', desc: 'Three steel pegs split the center line.' },
    turbo:   { name: 'Turbo Lanes', desc: 'Boost lanes along both rails fire the puck faster.' },
    ice:     { name: 'Black Ice', desc: 'Almost no friction. The puck never slows down.', friction: 0.04, max: 1450 },
    twin:    { name: 'Twin Puck', desc: 'Two pucks in play at once.', pucks: 2 },
    gate:    { name: 'Sliding Gate', desc: 'A gate sweeps up and down the center line.' },
    orbit:   { name: 'Orbit', desc: 'Two bumpers circle the center and kick the puck.' }
  };

  // ---------- Rivals ----------
  // speed/accel px/s, react s (how stale its read of the puck is), err px (blocking error),
  // aggr 0..1 (how hard it angles returns off the mallet edge), reads (predicts wall bounces)
  const RIVALS = [
    { name: 'Pip', title: 'The Rookie', table: 'classic', to: 5, powers: false,
      tip: 'Slow to react and never reads bank shots. Bounce one off the rail.',
      ai: { speed: 360, accel: 2000, react: 0.25, err: 62, aggr: 0.2, push: 0.12, reads: false } },
    { name: 'Brick', title: 'The Wall', table: 'pegs', to: 5,
      tip: 'A steady blocker that rarely angles. Hit off the edge of your mallet to get past it.',
      ai: { speed: 450, accel: 2600, react: 0.2, err: 46, aggr: 0.15, push: 0.2, reads: true } },
    { name: 'Vex', title: 'The Striker', table: 'turbo', to: 5,
      tip: 'Angles everything sharply but overreaches. Stay central and wait for the miss.',
      ai: { speed: 490, accel: 2800, react: 0.19, err: 48, aggr: 0.85, push: 0.7, reads: true } },
    { name: 'Echo', title: 'Bank Artist', table: 'ice', to: 5,
      tip: 'On frictionless ice every shot stays fast. Watch the rails, not the puck.',
      ai: { speed: 500, accel: 2900, react: 0.17, err: 46, aggr: 0.6, push: 0.4, reads: true } },
    { name: 'Duo', title: 'Double Trouble', table: 'twin', to: 5,
      tip: 'Two pucks, one mallet. Clear the closest threat first.',
      ai: { speed: 550, accel: 3200, react: 0.145, err: 38, aggr: 0.5, push: 0.4, reads: true } },
    { name: 'Mirage', title: 'The Phantom', table: 'gate', to: 5,
      tip: 'Time your shots through the sliding gate.',
      ai: { speed: 570, accel: 3300, react: 0.135, err: 36, aggr: 0.6, push: 0.5, reads: true } },
    { name: 'Tempest', title: 'The Storm', table: 'orbit', to: 5,
      tip: 'Fast and fearless. The orbiting bumpers punish lazy shots.',
      ai: { speed: 590, accel: 3400, react: 0.13, err: 34, aggr: 0.7, push: 0.6, reads: true } },
    { name: 'The Machine', title: 'Final Boss', table: 'classic', to: 6, boss: true, r: 34,
      tip: 'Huge mallet, near-perfect reads. It overclocks when it falls behind.',
      ai: { speed: 620, accel: 3600, react: 0.12, err: 29, aggr: 0.65, push: 0.55, reads: true } }
  ];
  const PRO = { speed: 1.1, accel: 1.15, react: 0.72, err: 0.62 };

  // ---------- Power-ups ----------
  const POWERS = {
    grow:   { g: '+', name: 'Big Mallet', w: 16 },
    shrink: { g: '−', name: 'Shrink Ray', w: 12 },
    wall:   { g: '▮', name: 'Goal Wall', w: 12 },
    split:  { g: '⁂', name: 'Multi Puck', w: 10 },
    freeze: { g: '❄', name: 'Freeze', w: 12 },
    fire:   { g: '✷', name: 'Fire Puck', w: 14 }
  };
  function pickPower() {
    let tot = 0;
    for (const k in POWERS) tot += POWERS[k].w;
    let r = Math.random() * tot;
    for (const k in POWERS) { r -= POWERS[k].w; if (r <= 0) return k; }
    return 'grow';
  }

  // ---------- Sound (WebAudio synth) ----------
  const sfx = (() => {
    let ac = null, master = null, nbuf = null, muted = false;
    try { muted = localStorage.getItem('pong.muted') === '1'; } catch (e) {}
    function ensure() {
      if (!ac) {
        try {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          master = ac.createGain(); master.gain.value = 0.6; master.connect(ac.destination);
        } catch (e) { return; }
      }
      if (ac.state === 'suspended') ac.resume();
    }
    const quiet = () => muted || !ac || state.mode === 'demo' || state.sim;
    function tone(f, d, type = 'square', v = 0.08, f2 = null, delay = 0) {
      if (quiet()) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + d + 0.05);
    }
    function noise(d, v = 0.15, freq = 1200, type = 'bandpass', delay = 0) {
      if (quiet()) return;
      if (!nbuf) {
        nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const ch = nbuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      }
      const t = ac.currentTime + delay;
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = nbuf; f.type = type; f.frequency.value = freq;
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t); s.stop(t + d + 0.05);
    }
    const arp = (notes, d, type, v, gap) => notes.forEach((f, i) => tone(f, d, type, v, null, i * gap));
    return {
      ensure,
      get muted() { return muted; },
      toggle() { muted = !muted; try { localStorage.setItem('pong.muted', muted ? '1' : '0'); } catch (e) {} return muted; },
      hit(k) { tone(160 + 380 * k, 0.07, 'triangle', 0.08 + 0.1 * k, 90); noise(0.05 + 0.04 * k, 0.08 + 0.16 * k, 2200 + 1500 * k); },
      smash() { noise(0.18, 0.22, 600, 'lowpass'); tone(110, 0.2, 'sine', 0.18, 50); },
      wall(k) { tone(780 + 300 * k, 0.03, 'square', 0.02 + 0.03 * k); noise(0.03, 0.04 + 0.06 * k, 4200, 'highpass'); },
      post() { tone(1500, 0.18, 'sine', 0.07, 1100); tone(2250, 0.12, 'sine', 0.03); },
      peg() { tone(980, 0.09, 'sine', 0.07, 620); },
      bumper() { tone(240, 0.14, 'square', 0.07, 520); },
      boost() { tone(300, 0.18, 'sawtooth', 0.04, 1300); },
      dash() { noise(0.1, 0.07, 900); },
      push() { noise(0.09, 0.1, 1600, 'highpass'); tone(180, 0.08, 'triangle', 0.05, 420); },
      goal() { [220, 277, 330].forEach(f => tone(f, 0.7, 'sawtooth', 0.06)); noise(0.6, 0.16, 1800); arp([523, 659, 784, 1046], 0.14, 'square', 0.05, 0.07); },
      concede() { tone(140, 0.55, 'square', 0.07, 70); tone(146, 0.55, 'square', 0.05, 72); },
      tick() { tone(520, 0.08, 'square', 0.05); },
      go() { tone(1040, 0.25, 'square', 0.07); tone(780, 0.25, 'square', 0.04); },
      power() { arp([660, 990, 1320], 0.1, 'square', 0.06, 0.07); },
      bad() { arp([520, 390, 290], 0.1, 'square', 0.05, 0.07); },
      fire() { noise(0.35, 0.2, 500, 'lowpass'); tone(200, 0.3, 'sawtooth', 0.1, 1600); },
      shatter() { noise(0.3, 0.16, 4200, 'highpass'); tone(2400, 0.1, 'sine', 0.04, 1500); },
      matchPoint() { arp([880, 880], 0.08, 'square', 0.04, 0.14); },
      win() { arp([392, 523, 659, 784, 1046], 0.26, 'triangle', 0.1, 0.11); },
      champion() { arp([392, 523, 659, 784, 1046, 1318, 1568], 0.32, 'triangle', 0.1, 0.12); },
      lose() { arp([392, 330, 262, 196], 0.35, 'sawtooth', 0.07, 0.22); }
    };
  })();

  // ---------- Canvas ----------
  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  const view = { scale: 1 };

  function resize() {
    const frame = document.querySelector('.frame');
    const availW = frame.clientWidth - 20;
    const availH = window.innerHeight - document.querySelector('header').offsetHeight
      - document.querySelector('footer').offsetHeight - 70;
    let cssW = Math.min(W, availW, Math.max(220, availH) * W / H);
    cssW = Math.max(260, Math.floor(cssW));
    const cssH = Math.round(cssW * H / W);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    view.scale = canvas.width / W;
  }

  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  // Scanlines + vignette, drawn once
  const fxLayer = document.createElement('canvas');
  fxLayer.width = W * 2; fxLayer.height = H * 2;
  (() => {
    const g = fxLayer.getContext('2d');
    g.scale(2, 2);
    g.fillStyle = 'rgba(0,0,0,.07)';
    for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
    const v = g.createRadialGradient(CX, CY, H * 0.4, CX, CY, H * 1.05);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,.55)');
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  })();

  // The rink itself is static per table, so paint it once
  function buildTable(key) {
    const c = document.createElement('canvas');
    c.width = W * 2; c.height = H * 2;
    const g = c.getContext('2d');
    g.scale(2, 2);
    const ice = key === 'ice';

    const fr = g.createLinearGradient(0, 0, 0, H);
    fr.addColorStop(0, '#707070'); fr.addColorStop(0.05, '#3c3c3c'); fr.addColorStop(0.5, '#242424');
    fr.addColorStop(0.95, '#383838'); fr.addColorStop(1, '#141414');
    g.fillStyle = fr; rr(g, 0, 0, W, H, 26); g.fill();

    g.save();
    rr(g, RAIL, RAIL, W - RAIL * 2, H - RAIL * 2, 16);
    const sf = g.createRadialGradient(CX, CY, 40, CX, CY, W * 0.62);
    sf.addColorStop(0, ice ? '#3e3e3e' : '#2a2a2a'); sf.addColorStop(1, ice ? '#1d1d1d' : '#131313');
    g.fillStyle = sf; g.fill();
    g.clip();

    if (ice) {
      g.fillStyle = 'rgba(255,255,255,.035)';
      for (let i = 0; i < 9; i++) {
        const x = i * 130 - 80;
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 50, 0); g.lineTo(x + 50 + 160, H); g.lineTo(x + 160, H); g.fill();
      }
    }
    // Air holes
    for (let y = RAIL + 10, row = 0; y < H - RAIL; y += 20, row++) {
      for (let x = RAIL + 10 + (row % 2) * 10; x < W - RAIL; x += 20) {
        g.fillStyle = 'rgba(255,255,255,.05)';
        g.beginPath(); g.arc(x, y + 0.8, 1.3, 0, TAU); g.fill();
        g.fillStyle = 'rgba(0,0,0,.55)';
        g.beginPath(); g.arc(x, y, 1.2, 0, TAU); g.fill();
      }
    }
    // Markings
    g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(CX, RAIL); g.lineTo(CX, H - RAIL); g.stroke();
    g.beginPath(); g.arc(CX, CY, 72, 0, TAU); g.stroke();
    g.beginPath(); g.arc(RAIL, CY, 118, -Math.PI / 2, Math.PI / 2); g.stroke();
    g.beginPath(); g.arc(W - RAIL, CY, 118, Math.PI / 2, Math.PI * 1.5); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.04)';
    g.beginPath(); g.arc(RAIL, CY, 118, -Math.PI / 2, Math.PI / 2); g.fill();
    g.beginPath(); g.arc(W - RAIL, CY, 118, Math.PI / 2, Math.PI * 1.5); g.fill();
    g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,.08)';
    for (const x of [CX - 250, CX + 250]) { g.beginPath(); g.moveTo(x, RAIL); g.lineTo(x, H - RAIL); g.stroke(); }
    g.setLineDash([6, 7]); g.strokeStyle = 'rgba(255,255,255,.14)';
    for (const x of [CX - FACEOFF_X, CX + FACEOFF_X]) { g.beginPath(); g.arc(x, CY, 30, 0, TAU); g.stroke(); }
    g.setLineDash([]);
    g.fillStyle = 'rgba(255,255,255,.22)';
    for (const x of [CX - FACEOFF_X, CX, CX + FACEOFF_X]) { g.beginPath(); g.arc(x, CY, 4, 0, TAU); g.fill(); }
    g.font = `900 13px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = 'rgba(255,255,255,.07)';
    g.fillText(TABLES[key].name.toUpperCase(), CX, CY + 98);
    // Surface vignette
    const vg = g.createRadialGradient(CX, CY, H * 0.3, CX, CY, W * 0.6);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.4)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
    g.restore();

    // Rail bevel
    g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,.7)';
    rr(g, RAIL + 1, RAIL + 1, W - RAIL * 2 - 2, H - RAIL * 2 - 2, 15); g.stroke();
    g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,.14)';
    rr(g, RAIL - 2, RAIL - 2, W - RAIL * 2 + 4, H - RAIL * 2 + 4, 18); g.stroke();
    // Goal slots
    for (const left of [true, false]) {
      const x = left ? 0 : W - RAIL - 2;
      const gr = g.createLinearGradient(left ? 0 : W, 0, left ? RAIL : W - RAIL, 0);
      gr.addColorStop(0, '#000'); gr.addColorStop(1, '#0b0b0b');
      g.fillStyle = gr; g.fillRect(x, G_TOP, RAIL + 2, GOAL_H);
      const px = left ? RAIL : W - RAIL;
      for (const y of [G_TOP, G_BOT]) {
        const pg = g.createRadialGradient(px - 1, y - 1, 0, px, y, 6);
        pg.addColorStop(0, '#fff'); pg.addColorStop(1, '#777');
        g.fillStyle = pg; g.beginPath(); g.arc(px, y, POST_R + 1.5, 0, TAU); g.fill();
      }
    }
    // Screws
    g.fillStyle = 'rgba(255,255,255,.18)';
    for (const [x, y] of [[9, 9], [W - 9, 9], [9, H - 9], [W - 9, H - 9], [CX, 9], [CX, H - 9]]) {
      g.beginPath(); g.arc(x, y, 2.5, 0, TAU); g.fill();
    }
    return c;
  }

  // ---------- Progress ----------
  function loadProgress() {
    const blank = { amateur: { unlocked: 0, stars: [] }, pro: { unlocked: 0, stars: [] }, proOpen: false, circuit: 'amateur' };
    try { return Object.assign(blank, JSON.parse(localStorage.getItem('pong.progress')) || {}); } catch (e) { return blank; }
  }
  const saveProgress = () => { try { localStorage.setItem('pong.progress', JSON.stringify(progress)); } catch (e) {} };
  const progress = loadProgress();
  const circuit = () => progress[progress.circuit];

  // ---------- State ----------
  const state = {
    mode: 'demo', phase: 'intro', paused: false, sim: false,
    rivalIdx: 0, rival: null, tableKey: 'classic', table: TABLES.classic, tableImg: null, target: 5,
    score: [0, 0], mallets: [], pucks: [], obs: [], lanes: [], tokens: [], ais: [null, null],
    parts: [], rings: [], texts: [], banner: null,
    t: 0, realT: 0, phaseT: 0, countdown: false, lastCount: 0, faceSide: 0, winner: -1,
    rally: 0, bestRally: 0, tokenT: POWER_FIRST, idleT: 0, hintT: 0,
    stats: null, shake: 0, flash: 0, slowT: 0, goalFlash: [0, 0], boostSfxT: 0,
    vsTable: 'classic', lastResult: null
  };

  const newPad = () => ({ up: false, down: false, dashReq: false, pushReq: false, mode: 'pointer', py: null });
  const pads = [newPad(), newPad()];
  pads[1].mode = 'keys';

  function makeMallet(side, ctrl, r = MALLET_R) {
    return {
      side, ctrl, x: side === 0 ? MALLET_X : W - MALLET_X, y: CY, vx: 0, vy: 0, ivy: 0,
      r, baseR: r, growT: 0, shrinkT: 0, slowT: 0, wallT: 0, dashT: 0, dashCd: 0, dashY: 0, pushPh: -1, pushCd: 0, lunge: 0, hitT: 0, hitCd: 0
    };
  }
  const makePuck = (x, y) => ({ x, y, vx: 0, vy: 0, r: PUCK_R, last: -1, prev: -1, fire: -1, trail: [], ang: 0, spin: 0, walls: 0, touchT: 0, dead: false });
  const makeAI = c => ({ c, think: 0, seen: [], age: 0, noise: 0, offset: 0, willPush: false, mode: 'home' });
  const newStats = () => ({ hits: 0, smashes: 0, saves: 0, top: 0 });

  function aiConfig(rival, pro) {
    const c = { ...rival.ai };
    if (pro) for (const k in PRO) c[k] *= PRO[k];
    return c;
  }

  function setupTable(key) {
    state.tableKey = key;
    state.table = TABLES[key];
    state.tableImg = buildTable(key);
    state.obs = [];
    state.lanes = [];
    if (key === 'pegs') for (const y of [CY - 150, CY, CY + 150]) state.obs.push({ kind: 'peg', ax: CX, ay: y, bx: CX, by: y, r: 15, vx: 0, vy: 0, e: 0.95, hitT: 0 });
    if (key === 'gate') state.obs.push({ kind: 'gate', ax: CX, ay: CY - 64, bx: CX, by: CY + 64, r: 9, vx: 0, vy: 0, e: 0.9, hitT: 0 });
    if (key === 'orbit') for (let i = 0; i < 2; i++) state.obs.push({ kind: 'bumper', ph: i * Math.PI, ax: CX, ay: CY, bx: CX, by: CY, r: 20, vx: 0, vy: 0, e: 1.12, hitT: 0 });
    if (key === 'turbo') state.lanes = [{ x: CX - 120, y: RAIL + 14, w: 240, h: 62 }, { x: CX - 120, y: H - RAIL - 76, w: 240, h: 62 }];
  }

  // Sets up a fresh match. ctrls: ['human'|'ai', 'human'|'ai'], cfgs: AI configs per side
  function setupMatch(tableKey, ctrls, cfgs, target, r1 = MALLET_R) {
    const s = state;
    setupTable(tableKey);
    s.mallets = [makeMallet(0, ctrls[0]), makeMallet(1, ctrls[1], r1)];
    s.ais = cfgs.map(c => c ? makeAI(c) : null);
    s.score = [0, 0]; s.target = target; s.winner = -1;
    s.pucks = []; s.tokens = []; s.parts = []; s.rings = []; s.texts = []; s.banner = null;
    s.t = 0; s.rally = 0; s.bestRally = 0; s.tokenT = POWER_FIRST; s.idleT = 0; s.slowT = 0;
    s.stats = [newStats(), newStats()];
    s.goalFlash = [0, 0];
    s.paused = false;
    for (const p of pads) { p.up = p.down = p.dashReq = p.pushReq = false; }
    if (pads[0].py === null) pads[0].py = CY;
  }

  function startTour(i) {
    const s = state, rv = RIVALS[i];
    s.mode = 'tour'; s.rivalIdx = i; s.rival = rv;
    setupMatch(rv.table, ['human', 'ai'], [null, aiConfig(rv, progress.circuit === 'pro')], rv.to, rv.r || MALLET_R);
    s.phase = 'intro';
    showOverlay('intro');
  }

  function startVersus() {
    const s = state;
    s.mode = 'versus'; s.rival = null;
    setupMatch(s.vsTable, ['human', 'human'], [null, null], 7);
    hideOverlay();
    faceoff(Math.random() < 0.5 ? 0 : 1, true);
  }

  function startDemo() {
    const s = state;
    s.mode = 'demo';
    const keys = Object.keys(TABLES);
    const key = keys[Math.floor(Math.random() * keys.length)];
    setupMatch(key, ['ai', 'ai'], [aiConfig(RIVALS[3], false), aiConfig(RIVALS[4], false)], 5);
    faceoff(Math.random() < 0.5 ? 0 : 1, false);
  }

  function beginMatch() {
    hideOverlay();
    state.hintT = state.mode === 'tour' && state.rivalIdx === 0 ? 9 : 0;
    faceoff(Math.random() < 0.5 ? 0 : 1, true);
  }

  // Mallets only slide vertically, so the puck is served from center toward
  // the side that conceded (or a random side at kickoff)
  function faceoff(side, first) {
    const s = state;
    s.faceSide = side;
    const n = s.table.pucks || 1;
    s.pucks = [];
    if (n === 1) s.pucks.push(makePuck(side === 0 ? CX + SERVE_X : CX - SERVE_X, CY));
    else { s.pucks.push(makePuck(CX + SERVE_X, CY - 110)); s.pucks.push(makePuck(CX - SERVE_X, CY + 110)); }
    s.pucks.forEach((p, i) => { p.serve = n === 1 ? (side === 0 ? -1 : 1) : (i === 0 ? -1 : 1); });
    s.phase = 'faceoff';
    s.countdown = first;
    s.phaseT = first ? 2.1 : 0.9;
    s.lastCount = 4;
    s.rally = 0; s.idleT = 0;
    for (const p of s.pucks) ring(p.x, p.y, 10, 120, 0.5, 2, 0.5);
  }

  function release() {
    const s = state;
    s.phase = 'play';
    for (const p of s.pucks) {
      const a = rand(-0.45, 0.45);
      p.vx = Math.cos(a) * BASE_PACE * p.serve; p.vy = Math.sin(a) * BASE_PACE;
      p.touchT = s.t;
    }
    if (s.countdown) { setBanner('GO!', '', 0.7); sfx.go(); }
  }

  // ---------- Effects helpers ----------
  function sparks(x, y, n, sp = 260, dir = null, spread = TAU) {
    for (let i = 0; i < n; i++) {
      const a = dir === null ? Math.random() * TAU : dir + (Math.random() - 0.5) * spread;
      const v = sp * (0.4 + Math.random() * 0.8);
      state.parts.push({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.2 + Math.random() * 0.3, max: 0.5, c: 200 + Math.random() * 55 | 0 });
    }
    if (state.parts.length > 800) state.parts.splice(0, state.parts.length - 800);
  }
  function shards(x, y, n, sp = 300) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, v = sp * (0.3 + Math.random() * 0.9);
      state.parts.push({ k: 'shard', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.6, max: 1.1,
        size: 2 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, c: Math.random() < 0.5 ? '#eee' : '#8a8a8a' });
    }
  }
  function confetti(n) {
    for (let i = 0; i < n; i++) {
      state.parts.push({ k: 'conf', x: RAIL + Math.random() * (W - RAIL * 2), y: -10 - Math.random() * 140,
        vx: (Math.random() - 0.5) * 80, vy: 60 + Math.random() * 120, life: 3, max: 3,
        size: 3 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10, c: ['#fff', '#cfcfcf', '#8a8a8a', '#5a5a5a'][i % 4] });
    }
  }
  const ring = (x, y, r, vr, life, w = 3, a = 0.6) => state.rings.push({ x, y, r, vr, life, max: life, w, a });
  const floatText = (x, y, text, size = 16) => state.texts.push({ x, y, text, size, life: 1.1, max: 1.1 });
  const setBanner = (text, sub, dur) => { state.banner = { text, sub, t: 0, dur }; };
  const isHuman = side => state.mallets[side] && state.mallets[side].ctrl === 'human';

  // ---------- Physics helpers ----------
  function closest(o, x, y) {
    const dx = o.bx - o.ax, dy = o.by - o.ay, l2 = dx * dx + dy * dy;
    const t = l2 ? clamp(((x - o.ax) * dx + (y - o.ay) * dy) / l2, 0, 1) : 0;
    return [o.ax + dx * t, o.ay + dy * t];
  }
  // Circle p vs moving circle obstacle. Returns null when apart, else the impact speed (0 if already separating)
  function bounce(p, ox, oy, or, ovx, ovy, e) {
    const dx = p.x - ox, dy = p.y - oy, rr2 = p.r + or;
    const d2 = dx * dx + dy * dy;
    if (d2 >= rr2 * rr2) return null;
    const d = Math.sqrt(d2) || 0.001, nx = dx / d, ny = dy / d;
    p.x = ox + nx * rr2; p.y = oy + ny * rr2;
    const vn = (p.vx - ovx) * nx + (p.vy - ovy) * ny;
    if (vn >= 0) return 0;
    p.vx -= (1 + e) * vn * nx; p.vy -= (1 + e) * vn * ny;
    // Glancing blows spin the puck
    p.spin += ((p.vx - ovx) * -ny + (p.vy - ovy) * nx) * 0.01;
    return -vn;
  }
  function pushOut(m, ox, oy, or) {
    const dx = m.x - ox, dy = m.y - oy, rr2 = m.r + or, d2 = dx * dx + dy * dy;
    if (d2 >= rr2 * rr2) return;
    const d = Math.sqrt(d2) || 0.001;
    m.x = ox + dx / d * rr2; m.y = oy + dy / d * rr2;
  }
  function clampMallet(m) {
    m.x = m.side === 0 ? MALLET_X + m.lunge : W - MALLET_X - m.lunge;
    m.y = clamp(m.y, RAIL + m.r, H - RAIL - m.r);
  }
  // Fold a straight-line y back into the table, as if bouncing off the side rails
  const FOLD_LO = RAIL + PUCK_R, FOLD_SPAN = H - RAIL - PUCK_R - FOLD_LO;
  function foldY(y) {
    let t = (y - FOLD_LO) % (2 * FOLD_SPAN);
    if (t < 0) t += 2 * FOLD_SPAN;
    return FOLD_LO + (t <= FOLD_SPAN ? t : 2 * FOLD_SPAN - t);
  }
  const bounces = y => { const t = (y - FOLD_LO) / FOLD_SPAN; return t < 0 ? Math.ceil(-t) : Math.floor(t); };

  // ---------- Mallet control ----------
  function moveMallet(m, dt) {
    const ox = m.x, oy = m.y;
    m.dashCd = Math.max(0, m.dashCd - dt);
    m.dashT = Math.max(0, m.dashT - dt);
    const slow = m.slowT > 0 ? 0.5 : 1;
    if (m.dashT > 0 && Math.random() < 0.4) ring(m.x, m.y, m.r, 120, 0.2, 2, 0.4);
    if (m.ctrl === 'ai') aiControl(m, state.ais[m.side], dt, slow);
    else {
      const pad = pads[m.side];
      if (pad.pushReq) { pad.pushReq = false; startPush(m); }
      humanControl(m, pad, dt, slow);
    }
    updatePush(m, dt, slow);
    const tr = m.baseR * (m.growT > 0 ? 1.4 : 1) * (m.shrinkT > 0 ? 0.68 : 1);
    m.r += (tr - m.r) * Math.min(1, dt * 10);
    clampMallet(m);
    for (const o of state.obs) { const [qx, qy] = closest(o, m.x, m.y); pushOut(m, qx, qy, o.r); }
    clampMallet(m);
    m.vx = (m.x - ox) / dt; m.vy = (m.y - oy) / dt;
  }

  function startPush(m) {
    if (m.pushCd > 0 || state.phase !== 'play') return;
    m.pushPh = 0; m.pushCd = PUSH_CD;
    sfx.push();
  }
  function updatePush(m, dt, slow) {
    m.pushCd = Math.max(0, m.pushCd - dt);
    if (m.pushPh < 0) { m.lunge = 0; return; }
    const t = m.pushPh + dt * slow;
    let lunge;
    if (t < PUSH_OUT) lunge = PUSH_DIST * t / PUSH_OUT;
    else if (t < PUSH_OUT + PUSH_HOLD) lunge = PUSH_DIST;
    else if (t < PUSH_OUT + PUSH_HOLD + PUSH_BACK) lunge = PUSH_DIST * (1 - (t - PUSH_OUT - PUSH_HOLD) / PUSH_BACK);
    else lunge = 0;
    // Never drag a puck that slipped behind the mallet back into our own goal
    if (lunge < m.lunge) {
      const dir = m.side === 0 ? 1 : -1, nx = (m.side === 0 ? MALLET_X : W - MALLET_X) + dir * lunge;
      const blocked = state.pucks.some(p => !p.dead && (p.x - nx) * dir < 0 && Math.hypot(p.x - nx, p.y - m.y) < m.r + p.r);
      if (blocked) return;
    }
    m.pushPh = lunge === 0 && t >= PUSH_OUT ? -1 : t;
    m.lunge = lunge;
  }

  function humanControl(m, pad, dt, slow) {
    if (pad.dashReq) {
      pad.dashReq = false;
      if (m.dashCd <= 0) {
        let dy = (pad.down ? 1 : 0) - (pad.up ? 1 : 0);
        if (!dy) {
          // No direction held: dash toward the nearest puck
          const p = nearestPuck(m);
          dy = p && p.y < m.y ? -1 : 1;
        }
        m.dashY = dy; m.dashT = DASH_TIME; m.dashCd = DASH_CD;
        sfx.dash();
      }
    }
    if (m.dashT > 0) {
      m.ivy = m.dashY * DASH_SPEED * slow;
      m.y += m.ivy * dt;
      return;
    }
    if (pad.mode === 'pointer' && pad.py !== null) {
      let dy = clamp(pad.py, RAIL + m.r, H - RAIL - m.r) - m.y;
      const maxD = POINTER_MAX * slow * dt;
      dy = clamp(dy, -maxD, maxD);
      m.y += dy;
      m.ivy = dy / dt;
      return;
    }
    const iy = (pad.down ? 1 : 0) - (pad.up ? 1 : 0);
    m.ivy = approach(m.ivy, iy * KEY_SPEED * slow, (iy ? KEY_ACCEL : KEY_ACCEL * 1.6) * dt);
    m.y += m.ivy * dt;
  }
  const approach = (v, t, a) => v < t ? Math.min(t, v + a) : Math.max(t, v - a);
  function nearestPuck(m) {
    let best = null, bd = Infinity;
    for (const p of state.pucks) {
      const d = Math.hypot(p.x - m.x, p.y - m.y);
      if (!p.dead && d < bd) { bd = d; best = p; }
    }
    return best;
  }

  // ---------- AI ----------
  // Works in "local" coordinates where its own goal is always on the left (x = RAIL)
  function aiControl(m, ai, dt, slow) {
    const s = state, c = ai.c, flip = m.side === 1;
    const L = x => flip ? W - x : x;
    // Rubber band: ease off when well ahead, sharpen when behind
    const lead = s.score[m.side] - s.score[1 - m.side];
    let band = lead >= 2 ? 1 + 0.18 * (lead - 1) : lead <= -2 ? 0.9 : 1;
    let spdMul = 1;
    if (s.rival && s.rival.boss && m.side === 1 && lead < 0) { band *= 0.85; spdMul = 1.1; }

    ai.think -= dt;
    if (ai.think <= 0) {
      ai.think = c.react * band * rand(0.75, 1.25);
      ai.seen = s.pucks.filter(p => !p.dead).map(p => ({ x: L(p.x), y: p.y, vx: flip ? -p.vx : p.vx, vy: p.vy }));
      ai.age = 0;
      ai.noise = (Math.random() + Math.random() - 1) * c.err * band;
      // Meet the puck off-center to angle the return
      ai.offset = (Math.random() * 2 - 1) * c.aggr * m.r * 0.75;
      ai.willPush = Math.random() < c.push;
    }
    ai.age += dt;

    const lx = L(m.x), reach = m.r + PUCK_R;
    let ty = CY;
    ai.mode = 'home';

    // Pick the puck that reaches our line first
    let p = null, best = Infinity;
    for (const q of ai.seen) {
      const e = { x: clamp(q.x + q.vx * ai.age, RAIL, W - RAIL), y: foldY(q.y + q.vy * ai.age), vx: q.vx, vy: q.vy };
      const urg = e.vx < -20 && e.x > lx ? (e.x - lx) / -e.vx : 10 + Math.abs(e.x - lx) / 1000;
      if (urg < best) { best = urg; p = e; }
    }

    if (p) {
      if (p.vx < -20 && p.x > lx) {
        const sp = Math.hypot(p.vx, p.vy);
        const tHit = Math.max(0, (p.x - lx - reach * 0.7) / -p.vx);
        const rawY = p.y + p.vy * tHit;
        const yAt = c.reads ? foldY(rawY) : clamp(rawY, RAIL + PUCK_R, H - RAIL - PUCK_R);
        // Hard shots and bank shots are harder to read
        const misread = (0.5 + sp / 800) * (1 + 1.2 * bounces(rawY));
        ty = yAt + ai.noise * misread + ai.offset;
        ai.mode = 'block';
        // Lunge when the puck is about to arrive in front of the mallet
        const tc = (p.x - lx - reach) / -p.vx;
        if (ai.willPush && tc > 0 && tc < PUSH_OUT * 1.2 && Math.abs(p.y + p.vy * tc - m.y) < reach * 0.8) {
          ai.willPush = false;
          startPush(m);
        }
      } else {
        ty = lerp(CY, p.y, 0.35);
      }
    }

    ty = clamp(ty, RAIL + m.r, H - RAIL - m.r);
    const ey = ty - m.y;
    const want = Math.sign(ey) * Math.min(c.speed * spdMul, Math.abs(ey) * 12) * slow;
    m.ivy = approach(m.ivy, want, c.accel * spdMul * slow * dt);
    m.y += m.ivy * dt;
  }

  // ---------- Simulation ----------
  function updateObstacles(dt) {
    const t = state.t;
    for (const o of state.obs) {
      o.hitT = Math.max(0, o.hitT - dt);
      if (o.kind === 'gate') {
        const y = CY + Math.sin(t * 0.85) * 150;
        o.ay = y - 64; o.by = y + 64; o.vy = Math.cos(t * 0.85) * 0.85 * 150;
      } else if (o.kind === 'bumper') {
        const a = o.ph + t * 0.9;
        o.ax = o.bx = CX + Math.cos(a) * 112; o.ay = o.by = CY + Math.sin(a) * 112;
        o.vx = -Math.sin(a) * 0.9 * 112; o.vy = Math.cos(a) * 0.9 * 112;
      }
    }
  }

  function onMalletHit(p, m, imp, beforeVx) {
    const s = state;
    if (p.fire === m.side) {
      const sp = Math.hypot(p.vx, p.vy) || 1, k = Math.max(sp * 1.45, 1250) / sp;
      p.vx *= k; p.vy *= k; p.fire = -1;
      sparks(p.x, p.y, 26, 420); ring(p.x, p.y, 10, 520, 0.4, 5, 0.8);
      s.shake = Math.max(s.shake, 9);
      sfx.fire();
    }
    if (p.last !== m.side && p.last !== -1) { s.rally++; s.bestRally = Math.max(s.bestRally, s.rally); }
    if (p.last !== m.side) p.prev = p.last;
    p.last = m.side; p.walls = 0; p.touchT = s.t;
    if (m.hitCd > 0 && imp < 300) return;
    m.hitCd = 0.08; m.hitT = 0.18;
    const sp = Math.min(Math.hypot(p.vx, p.vy), s.table.max || PUCK_MAX), st = s.stats[m.side];
    st.hits++;
    st.top = Math.max(st.top, sp);
    // A save is a hit on a fast puck heading at your own goal from close range
    const toward = m.side === 0 ? -beforeVx : beforeVx, dist = m.side === 0 ? p.x - RAIL : W - RAIL - p.x;
    if (toward > 450 && dist < 260) {
      st.saves++;
      if (isHuman(m.side)) floatText(p.x, p.y - 30, 'SAVE!', 16);
    }
    const k = clamp(imp / 1100, 0, 1);
    const nx = (p.x - m.x) / (m.r + p.r), ny = (p.y - m.y) / (m.r + p.r);
    sparks(m.x + nx * m.r, m.y + ny * m.r, 3 + k * 10 | 0, 160 + k * 300, Math.atan2(ny, nx), 1.6);
    // Push shots and only the very hardest blocks count as smashes
    if ((m.lunge > 0 && sp > SMASH_SPEED) || sp > PUCK_MAX * 0.97) {
      st.smashes++;
      ring(p.x, p.y, 12, 380, 0.35, 4, 0.7);
      s.shake = Math.max(s.shake, 5);
      sfx.smash();
      if (isHuman(m.side) && s.mode !== 'demo') floatText(p.x, p.y - 30, 'SMASH!', 18);
    }
    sfx.hit(k);
  }

  function updatePucks(dt) {
    const s = state, fr = s.table.friction ?? FRICTION, max = s.table.max || PUCK_MAX;
    const live = s.phase === 'play';
    for (const p of s.pucks) {
      if (p.dead) continue;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const damp = Math.exp(-fr * dt);
      p.vx *= damp; p.vy *= damp;
      p.ang += p.spin * dt; p.spin *= Math.exp(-1.5 * dt);
      for (const ln of s.lanes) {
        if (p.x > ln.x && p.x < ln.x + ln.w && p.y > ln.y && p.y < ln.y + ln.h && Math.abs(p.vx) > 40) {
          p.vx += Math.sign(p.vx) * 1700 * dt;
          p.boost = 0.25;
          if (s.boostSfxT <= 0) { sfx.boost(); s.boostSfxT = 0.4; }
        }
      }
      p.boost = Math.max(0, (p.boost || 0) - dt);

      for (const m of s.mallets) {
        const bvx = p.vx;
        const imp = bounce(p, m.x, m.y, m.r, m.vx, m.vy, HIT_E);
        if (imp !== null && (imp > 20 || p.last !== m.side)) onMalletHit(p, m, imp, bvx);
      }
      for (const o of s.obs) {
        const [qx, qy] = closest(o, p.x, p.y);
        const imp = bounce(p, qx, qy, o.r, o.vx, o.vy, o.e);
        if (imp > 60) {
          o.hitT = 0.25;
          if (o.kind === 'bumper') {
            // Bumpers always kick back with some pace
            const sp = Math.hypot(p.vx, p.vy);
            if (sp < 650) { p.vx *= 650 / sp; p.vy *= 650 / sp; }
            ring(qx, qy, o.r, 160, 0.3, 3, 0.6); sfx.bumper();
          } else sfx.peg();
          sparks(p.x, p.y, 5, 200);
        }
      }
      wallsAndGoals(p);
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > max) { p.vx *= max / sp; p.vy *= max / sp; }
      if (live) keepPace(p);
      if (live) {
        for (const tk of s.tokens) {
          if (!tk.taken && p.last >= 0 && Math.hypot(p.x - tk.x, p.y - tk.y) < p.r + TOKEN_R) collectToken(tk, p);
        }
      }
      p.trail.push(p.x, p.y);
      if (p.trail.length > 28) p.trail.splice(0, 2);
    }
    // Puck vs puck
    for (let i = 0; i < s.pucks.length; i++) for (let j = i + 1; j < s.pucks.length; j++) {
      const a = s.pucks[i], b = s.pucks[j];
      if (a.dead || b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr2 = a.r + b.r, d2 = dx * dx + dy * dy;
      if (d2 >= rr2 * rr2) continue;
      const d = Math.sqrt(d2) || 0.001, nx = dx / d, ny = dy / d, ov = (rr2 - d) / 2;
      a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
      const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rel < 0) { a.vx += rel * nx; a.vy += rel * ny; b.vx -= rel * nx; b.vy -= rel * ny; sfx.wall(0.6); }
    }
    // A puck pinned against the rail must not sink into a mallet
    for (const p of s.pucks) if (!p.dead) for (const m of s.mallets) { pushOut(m, p.x, p.y, p.r); clampMallet(m); }
    s.pucks = s.pucks.filter(p => !p.dead || s.phase === 'goal');
  }

  // Mallets can't chase the puck, so it never stalls or bounces endlessly up and down,
  // and it picks up pace as a rally goes on
  function keepPace(p) {
    const floor = Math.min(PUCK_MAX * 0.8, BASE_PACE + state.rally * RALLY_PACE);
    let sp = Math.hypot(p.vx, p.vy);
    if (sp < 1) { p.vx = p.x < CX ? 1 : -1; p.vy = 0; sp = 1; }
    if (sp < floor) { p.vx *= floor / sp; p.vy *= floor / sp; sp = floor; }
    const minVx = sp * MIN_ANGLE_VX;
    if (Math.abs(p.vx) < minVx) {
      p.vx = (p.vx ? Math.sign(p.vx) : p.x < CX ? 1 : -1) * minVx;
      p.vy = (Math.sign(p.vy) || 1) * Math.sqrt(sp * sp - minVx * minVx);
    }
  }

  function wallsAndGoals(p) {
    const s = state;
    const beyond = p.x < RAIL || p.x > W - RAIL;
    const top = beyond ? G_TOP : RAIL, bot = beyond ? G_BOT : H - RAIL;
    let wallImp = 0;
    if (p.y - p.r < top) { p.y = top + p.r; if (p.vy < 0) { wallImp = -p.vy; p.vy = -p.vy * WALL_E; p.walls++; } }
    if (p.y + p.r > bot) { p.y = bot - p.r; if (p.vy > 0) { wallImp = p.vy; p.vy = -p.vy * WALL_E; p.walls++; } }
    const inMouth = p.y > G_TOP && p.y < G_BOT;
    if (!inMouth) {
      if (p.x - p.r < RAIL) { p.x = RAIL + p.r; if (p.vx < 0) { wallImp = Math.max(wallImp, -p.vx); p.vx = -p.vx * WALL_E; p.walls++; } }
      if (p.x + p.r > W - RAIL) { p.x = W - RAIL - p.r; if (p.vx > 0) { wallImp = Math.max(wallImp, p.vx); p.vx = -p.vx * WALL_E; p.walls++; } }
    }
    if (wallImp > 80) { sfx.wall(clamp(wallImp / 1200, 0, 1)); if (wallImp > 500) sparks(p.x, p.y, 4, 180); }
    for (const x of [RAIL, W - RAIL]) for (const y of [G_TOP, G_BOT]) {
      const imp = bounce(p, x, y, POST_R, 0, 0, 0.7);
      if (imp > 150) { sfx.post(); sparks(x, y, 8, 260); if (imp > 500 && s.mode !== 'demo') floatText(x + (x < CX ? 40 : -40), y, 'POST!', 14); }
    }
    // Goal walls from the power-up
    for (const m of s.mallets) {
      if (m.wallT <= 0) continue;
      const wx = m.side === 0 ? RAIL + 7 : W - RAIL - 7;
      const o = { ax: wx, ay: G_TOP - 6, bx: wx, by: G_BOT + 6 };
      const [qx, qy] = closest(o, p.x, p.y);
      if (bounce(p, qx, qy, 5, 0, 0, 0.9) !== null) {
        m.wallT = 0;
        shards(qx, qy, 26, 340); sfx.shatter();
        s.shake = Math.max(s.shake, 6);
        if (s.mode !== 'demo') floatText(qx + (m.side === 0 ? 50 : -50), qy - 20, 'BLOCKED!', 16);
      }
    }
    if (p.dead) return;
    if (p.x < RAIL - p.r) scoreGoal(1, p);
    else if (p.x > W - RAIL + p.r) scoreGoal(0, p);
  }

  function collectToken(tk, p) {
    const s = state, side = p.last, me = s.mallets[side], foe = s.mallets[1 - side];
    tk.taken = true;
    const pw = POWERS[tk.k];
    switch (tk.k) {
      case 'grow': me.growT = 9; break;
      case 'shrink': foe.shrinkT = 7; break;
      case 'wall': me.wallT = 15; break;
      case 'freeze': foe.slowT = 3.5; sparks(foe.x, foe.y, 18, 200); break;
      case 'fire': p.fire = side; break;
      case 'split':
        if (s.pucks.length < 3) {
          const q = makePuck(tk.x, tk.y);
          const sp = Math.max(500, Math.hypot(p.vx, p.vy));
          const a = Math.atan2(p.vy, p.vx) + (Math.random() < 0.5 ? 0.6 : -0.6);
          q.vx = Math.cos(a) * sp; q.vy = Math.sin(a) * sp; q.last = side;
          s.pucks.push(q);
        }
        break;
    }
    ring(tk.x, tk.y, TOKEN_R, 260, 0.45, 4, 0.8);
    sparks(tk.x, tk.y, 16, 260);
    if (s.mode !== 'demo') floatText(tk.x, tk.y - 26, pw.name.toUpperCase() + (s.mode === 'tour' && side === 1 ? ' (' + s.rival.name + ')' : ''), 15);
    if (s.mode === 'tour' && side === 1) sfx.bad(); else sfx.power();
    s.tokenT = rand(POWER_EVERY[0], POWER_EVERY[1]);
  }

  function updatePowers(dt) {
    const s = state;
    for (const m of s.mallets) {
      m.growT = Math.max(0, m.growT - dt);
      m.shrinkT = Math.max(0, m.shrinkT - dt);
      m.slowT = Math.max(0, m.slowT - dt);
      m.wallT = Math.max(0, m.wallT - dt);
      m.hitT = Math.max(0, m.hitT - dt);
      m.hitCd = Math.max(0, m.hitCd - dt);
    }
    for (const tk of s.tokens) tk.life -= dt;
    s.tokens = s.tokens.filter(tk => !tk.taken && tk.life > 0);
    const powersOn = !(s.mode === 'tour' && s.rival.powers === false);
    if (!powersOn || s.phase !== 'play' || s.tokens.length) return;
    s.tokenT -= dt;
    if (s.tokenT > 0) return;
    for (let tries = 0; tries < 20; tries++) {
      const x = CX + rand(-150, 150), y = rand(RAIL + 60, H - RAIL - 60);
      const blocked = s.obs.some(o => { const [qx, qy] = closest(o, x, y); return Math.hypot(x - qx, y - qy) < o.r + TOKEN_R + 20; })
        || s.pucks.some(p => Math.hypot(p.x - x, p.y - y) < 60);
      if (blocked) continue;
      s.tokens.push({ x, y, k: pickPower(), life: TOKEN_LIFE, born: s.t, taken: false });
      ring(x, y, 4, 120, 0.5, 2, 0.6);
      break;
    }
    s.tokenT = rand(POWER_EVERY[0], POWER_EVERY[1]);
  }

  function scoreGoal(scorer, p) {
    const s = state;
    if (s.phase !== 'play') { p.dead = true; return; }
    const conceder = 1 - scorer;
    p.dead = true;
    s.score[scorer]++;
    s.goalFlash[conceder] = 1;
    const gx = conceder === 0 ? RAIL : W - RAIL, dir = conceder === 0 ? 0 : Math.PI;
    sparks(gx, p.y, 60, 620, dir, 1.6);
    shards(gx, p.y, 18, 420);
    for (let i = 0; i < 3; i++) ring(gx, p.y, 10 + i * 18, 420 - i * 80, 0.6, 4 - i, 0.7);
    s.shake = 16; s.flash = 0.25;
    const sp = Math.hypot(p.vx, p.vy);
    let text = 'GOAL!';
    const own = p.last === conceder && p.prev !== scorer;
    if (s.diag) { s.diag.goals++; if (own) s.diag.own++; }
    if (own) text = 'OWN GOAL!';
    else if (p.last === conceder) text = 'DEFLECTED IN!';
    else if (p.walls > 0 && p.last === scorer) text = 'BANK SHOT!';
    else if (sp > 1150) text = 'ROCKET!';
    let sub = '';
    if (s.mode === 'tour') sub = scorer === 0 ? 'You score' : s.rival.name + ' scores';
    else if (s.mode === 'versus') sub = (scorer === 0 ? 'Left' : 'Right') + ' scores';
    const won = s.score[scorer] >= s.target;
    if (!won && Math.max(...s.score) === s.target - 1) sub += (sub ? ' · ' : '') + 'MATCH POINT';
    setBanner(text, sub, won ? 2.2 : 1.4);
    if (s.mode === 'tour' && scorer === 1) sfx.concede(); else sfx.goal();
    if (!won && Math.max(...s.score) === s.target - 1) setTimeout(() => sfx.matchPoint(), 700);
    s.phase = 'goal';
    s.faceSide = conceder;
    s.winner = won ? scorer : -1;
    s.phaseT = won ? 1.1 : 1.2;
    if (won) s.slowT = 1.4;
  }

  function stuckCheck(dt) {
    const s = state;
    const slow = s.pucks.every(p => Math.hypot(p.vx, p.vy) < PUCK_MIN_LIVE);
    s.idleT = slow ? s.idleT + dt : 0;
    const old = s.pucks.every(p => s.t - p.touchT > 9);
    if (s.idleT > 6 || (old && s.idleT > 3)) {
      // Nobody can reach it (or nobody wants to): drop a fresh faceoff for the side holding it
      const p = s.pucks[0];
      if (s.mode !== 'demo') setBanner('RESET', 'Puck out of reach', 1);
      if (s.diag) s.diag.resets++;
      faceoff(p && p.x > CX ? 1 : 0, false);
    }
  }

  function simulate(dt) {
    const s = state;
    s.t += dt;
    updateObstacles(dt);
    for (const m of s.mallets) moveMallet(m, dt);
    if (s.phase === 'faceoff') {
      for (const p of s.pucks) for (const m of s.mallets) { pushOut(m, p.x, p.y, p.r); clampMallet(m); }
      s.phaseT -= dt;
      if (s.countdown) {
        const n = Math.ceil(s.phaseT / 0.7);
        if (n !== s.lastCount && n >= 1 && n <= 3) { s.lastCount = n; sfx.tick(); }
      }
      if (s.phaseT <= 0) release();
      updatePowers(dt);
      return;
    }
    updatePucks(dt);
    updatePowers(dt);
    if (s.phase === 'play') stuckCheck(dt);
    if (s.phase === 'goal') {
      s.phaseT -= dt;
      if (s.phaseT <= 0) {
        if (s.winner >= 0) endMatch();
        else faceoff(s.faceSide, false);
      }
    }
  }

  function updateFX(dt) {
    const s = state;
    for (const pt of s.parts) {
      pt.life -= dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      if (pt.k === 'conf') { pt.vy += 60 * dt; pt.rot += pt.vr * dt; pt.vx += Math.sin(pt.y * 0.03) * 20 * dt; }
      else { const d = Math.exp(-3.5 * dt); pt.vx *= d; pt.vy *= d; if (pt.rot !== undefined) pt.rot += pt.vr * dt; }
    }
    s.parts = s.parts.filter(pt => pt.life > 0);
    for (const r of s.rings) { r.life -= dt; r.r += r.vr * dt; }
    s.rings = s.rings.filter(r => r.life > 0);
    for (const t of s.texts) { t.life -= dt; t.y -= 34 * dt; }
    s.texts = s.texts.filter(t => t.life > 0);
    if (s.banner) { s.banner.t += dt; if (s.banner.t > s.banner.dur) s.banner = null; }
    s.shake = Math.max(0, s.shake - dt * 40);
    s.flash = Math.max(0, s.flash - dt * 1.5);
    s.goalFlash[0] = Math.max(0, s.goalFlash[0] - dt * 0.8);
    s.goalFlash[1] = Math.max(0, s.goalFlash[1] - dt * 0.8);
    s.boostSfxT -= dt;
    if (s.phase === 'play') s.hintT = Math.max(0, s.hintT - dt);
    // Fire pucks shed embers
    for (const p of s.pucks) if (p.fire >= 0 && !p.dead && Math.random() < 0.5) {
      s.parts.push({ k: 'spark', x: p.x, y: p.y, vx: rand(-60, 60) - p.vx * 0.1, vy: rand(-60, 60) - p.vy * 0.1, life: 0.3, max: 0.3, c: 255 });
    }
  }

  function step(dt) {
    const s = state;
    s.realT += dt;
    updateFX(dt);
    let sdt = dt;
    if (s.slowT > 0) { s.slowT -= dt; sdt = dt * 0.3; }
    if (s.phase === 'faceoff' || s.phase === 'play' || s.phase === 'goal') simulate(sdt);
  }

  // ---------- Match end & progress ----------
  const starsFor = (their, to) => their <= Math.floor(to / 4) ? 3 : their <= Math.floor(to * 0.6) ? 2 : 1;

  function endMatch() {
    const s = state;
    s.phase = 'over';
    if (s.sim) return;
    if (s.mode === 'demo') { startDemo(); return; }
    if (s.mode === 'versus') { sfx.win(); showOverlay('vsEnd'); return; }
    const c = circuit(), i = s.rivalIdx;
    if (s.winner === 0) {
      const st = starsFor(s.score[1], s.target);
      const prev = c.stars[i] || 0;
      c.stars[i] = Math.max(prev, st);
      s.lastResult = { stars: st, newBest: st > prev };
      const last = i === RIVALS.length - 1;
      if (!last) c.unlocked = Math.max(c.unlocked, i + 1);
      if (last) {
        const firstTitle = !progress.proOpen && progress.circuit === 'amateur';
        progress.proOpen = true;
        s.lastResult.firstTitle = firstTitle;
      }
      saveProgress();
      if (last) { sfx.champion(); showOverlay('champion'); }
      else { sfx.win(); confetti(70); showOverlay('won'); }
    } else {
      sfx.lose();
      showOverlay('lost');
    }
  }

  // ---------- Rendering ----------
  function drawLanes() {
    for (const ln of state.lanes) {
      ctx.save();
      rr(ctx, ln.x, ln.y, ln.w, ln.h, 10);
      ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.fill();
      ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
      ctx.clip();
      const off = (state.t * 90) % 28, cy = ln.y + ln.h / 2;
      ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (let k = 0; k < 6; k++) {
        const d = k * 28 + off;
        for (const sgn of [-1, 1]) {
          const x = CX + sgn * (d + 6);
          ctx.beginPath(); ctx.moveTo(x - sgn * 9, cy - 14); ctx.lineTo(x, cy); ctx.lineTo(x - sgn * 9, cy + 14); ctx.stroke();
        }
      }
      ctx.restore();
    }
  }

  function drawObstacles() {
    const s = state;
    for (const o of s.obs) {
      if (o.kind === 'bumper') {
        ctx.save();
        ctx.setLineDash([3, 9]); ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(CX, CY, 112, 0, TAU); ctx.stroke();
        ctx.restore();
        break;
      }
    }
    for (const o of s.obs) {
      const glow = o.hitT / 0.25;
      ctx.fillStyle = 'rgba(0,0,0,.4)';
      if (o.kind === 'gate') {
        rr(ctx, o.ax - o.r + 4, o.ay - o.r + 6, o.r * 2, o.by - o.ay + o.r * 2, o.r); ctx.fill();
        const g = ctx.createLinearGradient(o.ax - o.r, 0, o.ax + o.r, 0);
        g.addColorStop(0, '#9a9a9a'); g.addColorStop(0.4, '#f2f2f2'); g.addColorStop(1, '#555');
        ctx.fillStyle = g;
        rr(ctx, o.ax - o.r, o.ay - o.r, o.r * 2, o.by - o.ay + o.r * 2, o.r); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,.35)';
        for (let y = o.ay; y <= o.by; y += 16) ctx.fillRect(o.ax - o.r + 2, y, o.r * 2 - 4, 2);
        if (glow > 0) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 20 * glow; ctx.strokeStyle = `rgba(255,255,255,${glow})`; ctx.lineWidth = 2; rr(ctx, o.ax - o.r, o.ay - o.r, o.r * 2, o.by - o.ay + o.r * 2, o.r); ctx.stroke(); ctx.shadowBlur = 0; }
        continue;
      }
      ctx.beginPath(); ctx.arc(o.ax + 3, o.ay + 5, o.r, 0, TAU); ctx.fill();
      const g = ctx.createRadialGradient(o.ax - o.r * 0.35, o.ay - o.r * 0.4, 1, o.ax, o.ay, o.r);
      if (o.kind === 'bumper') { g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#9a9a9a'); g.addColorStop(1, '#2e2e2e'); }
      else { g.addColorStop(0, '#fafafa'); g.addColorStop(0.6, '#8f8f8f'); g.addColorStop(1, '#3a3a3a'); }
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(o.ax, o.ay, o.r * (1 + glow * 0.15), 0, TAU); ctx.fill();
      if (o.kind === 'bumper') {
        ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(o.ax, o.ay, o.r * 0.55, 0, TAU); ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${0.3 + glow * 0.7})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(o.ax, o.ay, o.r + 4 + glow * 6, 0, TAU); ctx.stroke();
      }
    }
  }

  function drawGoalWalls() {
    for (const m of state.mallets) {
      if (m.wallT <= 0) continue;
      const wx = m.side === 0 ? RAIL + 7 : W - RAIL - 7;
      const blink = m.wallT < 3 ? 0.4 + 0.6 * (Math.sin(state.realT * 18) > 0 ? 1 : 0) : 1;
      ctx.save();
      ctx.globalAlpha = blink;
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 16;
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      rr(ctx, wx - 4, G_TOP - 6, 8, GOAL_H + 12, 4); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      for (let y = G_TOP; y < G_BOT; y += 12) ctx.fillRect(wx - 4, y + ((state.realT * 30) % 12), 8, 3);
      ctx.restore();
    }
  }

  function drawTokens() {
    const s = state;
    for (const tk of s.tokens) {
      const age = s.t - tk.born, appear = clamp(age / 0.35, 0, 1);
      const blink = tk.life < 3 && Math.sin(s.realT * 16) < 0 ? 0.35 : 1;
      const r = TOKEN_R * (0.5 + 0.5 * appear) * (1 + Math.sin(s.realT * 5) * 0.05);
      ctx.save();
      ctx.globalAlpha = blink * appear;
      ctx.translate(tk.x, tk.y);
      const halo = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 2.4);
      halo.addColorStop(0, 'rgba(255,255,255,.25)'); halo.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0, 0, r * 2.4, 0, TAU); ctx.fill();
      ctx.rotate(s.realT * 1.4);
      ctx.fillStyle = '#0d0d0d'; ctx.strokeStyle = '#eee'; ctx.lineWidth = 2.5;
      rr(ctx, -r, -r, r * 2, r * 2, 7); ctx.fill(); ctx.stroke();
      ctx.rotate(-s.realT * 1.4);
      ctx.fillStyle = '#fff'; ctx.font = `900 ${r * 1.15}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(POWERS[tk.k].g, 0, 1);
      ctx.restore();
    }
  }

  function drawPuckTrail(p) {
    const tr = p.trail, n = tr.length / 2;
    if (n < 2) return;
    const sp = Math.hypot(p.vx, p.vy), hot = p.fire >= 0;
    const strength = clamp((sp - 250) / 900, 0, 1);
    if (strength <= 0 && !hot) return;
    ctx.save();
    ctx.lineCap = 'round';
    for (let i = 1; i < n; i++) {
      const k = i / n;
      ctx.strokeStyle = `rgba(255,255,255,${(hot ? 0.55 : 0.35 * strength) * k})`;
      ctx.lineWidth = p.r * 2 * k * (hot ? 1 : 0.85);
      ctx.beginPath(); ctx.moveTo(tr[i * 2 - 2], tr[i * 2 - 1]); ctx.lineTo(tr[i * 2], tr[i * 2 + 1]); ctx.stroke();
    }
    ctx.restore();
  }

  function drawPuck(p) {
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.arc(p.x + 3, p.y + 5, p.r, 0, TAU); ctx.fill();
    if (p.fire >= 0 || p.boost > 0) {
      ctx.save();
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 24;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 2, 0, TAU); ctx.fill();
      ctx.restore();
    }
    const g = ctx.createRadialGradient(p.x - 5, p.y - 6, 1, p.x, p.y, p.r);
    g.addColorStop(0, '#4a4a4a'); g.addColorStop(1, '#070707');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = p.fire >= 0 ? '#fff' : '#e6e6e6'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r - 3, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p.x + Math.cos(p.ang) * 3, p.y + Math.sin(p.ang) * 3); ctx.lineTo(p.x + Math.cos(p.ang) * (p.r - 6), p.y + Math.sin(p.ang) * (p.r - 6)); ctx.stroke();
  }

  function drawMallet(m) {
    const s = state, boss = m.side === 1 && s.rival && s.rival.boss && s.mode === 'tour';
    const light = m.side === 0;
    const r = m.r;
    if (m.lunge > 2) {
      // Motion streak from the mallet's home line
      const bx = m.side === 0 ? MALLET_X : W - MALLET_X;
      const g = ctx.createLinearGradient(bx, 0, m.x, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,.22)');
      ctx.fillStyle = g;
      ctx.fillRect(Math.min(bx, m.x), m.y - r * 0.8, Math.abs(m.x - bx), r * 1.6);
    }
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.beginPath(); ctx.arc(m.x + 4, m.y + 7, r, 0, TAU); ctx.fill();
    if (boss) {
      const overclock = s.score[1] < s.score[0];
      const pulse = 0.5 + 0.5 * Math.sin(s.realT * (overclock ? 12 : 4));
      ctx.save();
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 10 + pulse * (overclock ? 26 : 12);
      ctx.strokeStyle = `rgba(255,255,255,${0.35 + pulse * 0.5})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(m.x, m.y, r + 7, 0, TAU); ctx.stroke();
      ctx.restore();
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(s.realT * (overclock ? 3 : 1));
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      for (let i = 0; i < 8; i++) { ctx.rotate(TAU / 8); ctx.fillRect(r + 9, -2, 6, 4); }
      ctx.restore();
    }
    const g = ctx.createRadialGradient(m.x - r * 0.35, m.y - r * 0.4, 2, m.x, m.y, r);
    if (light) { g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#c4c4c4'); g.addColorStop(1, '#5e5e5e'); }
    else { g.addColorStop(0, '#7a7a7a'); g.addColorStop(0.5, '#363636'); g.addColorStop(1, '#0c0c0c'); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, TAU); ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = light ? 'rgba(0,0,0,.35)' : '#d8d8d8';
    ctx.beginPath(); ctx.arc(m.x, m.y, r - 1.5, 0, TAU); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = light ? 'rgba(0,0,0,.25)' : 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(m.x, m.y, r * 0.66, 0, TAU); ctx.stroke();
    const k = ctx.createRadialGradient(m.x - r * 0.15, m.y - r * 0.2, 1, m.x, m.y, r * 0.4);
    if (light) { k.addColorStop(0, '#fff'); k.addColorStop(1, '#8a8a8a'); }
    else { k.addColorStop(0, '#9a9a9a'); k.addColorStop(1, '#1a1a1a'); }
    ctx.fillStyle = k;
    ctx.beginPath(); ctx.arc(m.x, m.y, r * 0.4, 0, TAU); ctx.fill();
    if (m.pushCd > 0 && m.ctrl === 'human') {
      // Push recharge
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(m.x, m.y, r + 5, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - m.pushCd / PUSH_CD)); ctx.stroke();
    }
    if (m.hitT > 0) {
      ctx.strokeStyle = `rgba(255,255,255,${m.hitT / 0.18 * 0.7})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(m.x, m.y, r + 4, 0, TAU); ctx.stroke();
    }
    if (m.growT > 0) {
      ctx.save(); ctx.setLineDash([6, 6]); ctx.lineDashOffset = -s.realT * 30;
      ctx.strokeStyle = m.growT < 2 && Math.sin(s.realT * 16) < 0 ? 'rgba(255,255,255,.2)' : 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(m.x, m.y, r + 8, 0, TAU); ctx.stroke(); ctx.restore();
    }
    if (m.slowT > 0) {
      ctx.save(); ctx.translate(m.x, m.y);
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU + s.realT * 0.5;
        const x1 = Math.cos(a) * (r + 3), y1 = Math.sin(a) * (r + 3), x2 = Math.cos(a) * (r + 13), y2 = Math.sin(a) * (r + 13);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  function drawFX() {
    const s = state;
    for (const pt of s.parts) {
      const a = clamp(pt.life / pt.max, 0, 1);
      if (pt.k === 'spark') {
        ctx.strokeStyle = `rgba(${pt.c},${pt.c},${pt.c},${a})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(pt.x - pt.vx * 0.03, pt.y - pt.vy * 0.03); ctx.stroke();
      } else {
        ctx.save(); ctx.globalAlpha = pt.k === 'conf' ? Math.min(1, a * 3) : a;
        ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
        ctx.fillStyle = pt.c;
        if (pt.k === 'conf') ctx.fillRect(-pt.size / 2, -pt.size / 4, pt.size, pt.size / 2);
        else { ctx.beginPath(); ctx.moveTo(-pt.size, -pt.size * 0.6); ctx.lineTo(pt.size, 0); ctx.lineTo(-pt.size * 0.4, pt.size); ctx.fill(); }
        ctx.restore();
      }
    }
    for (const r of s.rings) {
      ctx.strokeStyle = `rgba(255,255,255,${r.a * r.life / r.max})`; ctx.lineWidth = r.w;
      ctx.beginPath(); ctx.arc(r.x, r.y, Math.max(0, r.r), 0, TAU); ctx.stroke();
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const t of s.texts) {
      ctx.globalAlpha = clamp(t.life / t.max * 1.6, 0, 1);
      ctx.font = `900 ${t.size}px ${FONT}`;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = '#fff'; ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }

  function bigText(text, x, y, size, alpha = 1, scale = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.font = `900 ${size}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,255,255,.5)'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#fff';
    ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  function drawScoreboard() {
    const s = state;
    if (s.mode === 'demo' && s.phase === 'intro') return;
    ctx.save();
    ctx.font = `900 150px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < 2; i++) {
      const hot = s.phase === 'goal' && s.faceSide === 1 - i ? 0.12 * clamp(s.banner ? 1 - s.banner.t / s.banner.dur : 0, 0, 1) : 0;
      ctx.fillStyle = `rgba(255,255,255,${0.05 + hot})`;
      ctx.fillText(String(s.score[i]), i === 0 ? CX / 2 : CX * 1.5, CY + 6);
    }
    ctx.font = `800 12px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.16)';
    const names = labels();
    ctx.fillText(names[0].toUpperCase(), CX / 2, CY + 92);
    ctx.fillText(names[1].toUpperCase(), CX * 1.5, CY + 92);
    ctx.restore();
  }

  function drawOverlayText() {
    const s = state;
    if (s.phase === 'faceoff' && s.countdown) {
      const n = Math.ceil(s.phaseT / 0.7), f = 1 - (s.phaseT % 0.7) / 0.7;
      if (n >= 1 && n <= 3) bigText(String(n), CX, CY - 4, 110, 1 - f * 0.6, 1.5 - Math.min(f * 3, 1) * 0.5);
      if (s.mode === 'tour') {
        ctx.save(); ctx.font = `800 15px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.6)';
        ctx.fillText(`FIRST TO ${s.target}`, CX, CY + 76); ctx.restore();
      }
    } else if (s.phase === 'faceoff') {
      for (const p of s.pucks) {
        const k = (s.realT * 2) % 1;
        ctx.strokeStyle = `rgba(255,255,255,${0.6 * (1 - k)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 4 + k * 26, 0, TAU); ctx.stroke();
      }
    }
    if (s.banner) {
      const b = s.banner, t = b.t;
      const pop = t < 0.18 ? 0.6 + (t / 0.18) * 0.55 : t < 0.3 ? 1.15 - ((t - 0.18) / 0.12) * 0.15 : 1;
      const a = clamp((b.dur - t) / 0.3, 0, 1);
      bigText(b.text, CX, CY - 30, b.text.length > 8 ? 64 : 84, a, pop);
      if (b.sub) {
        ctx.save(); ctx.globalAlpha = a;
        ctx.font = `800 17px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#cfcfcf';
        ctx.fillText(b.sub.toUpperCase(), CX, CY + 30); ctx.restore();
      }
    }
    if (s.hintT > 0 && s.mode === 'tour') {
      const a = clamp(s.hintT, 0, 1);
      ctx.save(); ctx.globalAlpha = a;
      const msg = pads[0].mode === 'pointer' ? (pads[0].touch ? 'Drag to slide your mallet · tap to push the puck for a power shot'
        : 'Move the mouse to slide your mallet · click to push the puck for a power shot')
        : 'W / S or ↑ / ↓ to slide · Space to push the puck for a power shot';
      ctx.font = `700 14px ${FONT}`;
      const w = ctx.measureText(msg).width + 30;
      rr(ctx, CX - w / 2, H - RAIL - 50, w, 32, 16);
      ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#eee'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(msg, CX, H - RAIL - 34);
      ctx.restore();
    }
    if (s.rally >= 4 && (s.phase === 'play' || s.phase === 'goal')) {
      const big = s.rally >= 10;
      ctx.save(); ctx.font = `900 ${big ? 20 : 16}px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(255,255,255,${big ? 0.85 : 0.55})`;
      ctx.fillText(`RALLY ×${s.rally}`, CX, RAIL + 28);
      ctx.restore();
    }
  }

  function render() {
    const s = state;
    ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (s.shake > 0.3) ctx.translate((Math.random() - 0.5) * s.shake, (Math.random() - 0.5) * s.shake);
    if (s.tableImg) ctx.drawImage(s.tableImg, 0, 0, W, H);
    // Goal mouths flare when scored on
    for (let i = 0; i < 2; i++) {
      const f = s.goalFlash[i];
      if (f <= 0) continue;
      const gx = i === 0 ? RAIL : W - RAIL;
      const g = ctx.createRadialGradient(gx, CY, 10, gx, CY, 260);
      g.addColorStop(0, `rgba(255,255,255,${0.45 * f})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(i === 0 ? 0 : W - 270, 0, 270, H);
    }
    drawScoreboard();
    drawLanes();
    // Light pools under the pucks make the air holes shimmer
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const p of s.pucks) {
      if (p.dead) continue;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 90);
      g.addColorStop(0, 'rgba(255,255,255,.07)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(p.x - 90, p.y - 90, 180, 180);
    }
    ctx.restore();
    drawObstacles();
    drawGoalWalls();
    drawTokens();
    for (const p of s.pucks) if (!p.dead) drawPuckTrail(p);
    for (const p of s.pucks) if (!p.dead) drawPuck(p);
    for (const m of s.mallets) drawMallet(m);
    drawFX();
    ctx.restore();
    drawOverlayText();
    if (s.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.6, s.flash)})`; ctx.fillRect(0, 0, W, H); }
    ctx.drawImage(fxLayer, 0, 0, W, H);
    const live = s.mode !== 'demo' && (s.phase === 'play' || s.phase === 'faceoff' || s.phase === 'goal') && !s.paused;
    canvas.style.cursor = live && pads[0].mode === 'pointer' ? 'none' : 'default';
  }

  // ---------- HUD ----------
  const hud = {
    match: $('match'), s0: $('s0'), s1: $('s1'), n0: $('n0'), n1: $('n1'), scorePill: $('scorePill'),
    rally: $('rally'), rallyPill: $('rallyPill'), power: $('power'), input: $('inputChip'),
    mute: $('muteBtn'), pause: $('pauseBtn')
  };
  function setText(el, v) {
    if (el._v === v) return false;
    el._v = v; el.textContent = v;
    return true;
  }
  function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  function labels() {
    const s = state;
    if (s.mode === 'tour') return ['You', s.rival.name];
    if (s.mode === 'versus') return ['Left', 'Right'];
    return [RIVALS[3].name, RIVALS[4].name];
  }
  function updateHUD() {
    const s = state;
    const [a, b] = labels();
    setText(hud.n0, a); setText(hud.n1, b);
    const changed = setText(hud.s0, String(s.score[0])) | setText(hud.s1, String(s.score[1]));
    if (changed && s.score[0] + s.score[1] > 0) bump(hud.scorePill);
    setText(hud.match, s.mode === 'tour' ? `${s.rivalIdx + 1}/${RIVALS.length}${progress.circuit === 'pro' ? ' Pro' : ''}` : s.mode === 'versus' ? '2P' : 'Demo');
    setText(hud.rally, String(s.rally));
    hud.rallyPill.classList.toggle('hot', s.rally >= 10 && s.phase === 'play');
    let parts = [];
    if (s.mode !== 'demo' && s.mallets.length) {
