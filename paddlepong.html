      const m = s.mallets[0], foe = s.mallets[1];
      if (m.growT > 0) parts.push('Big ' + Math.ceil(m.growT) + 's');
      if (m.wallT > 0) parts.push('Wall');
      if (s.pucks.some(p => p.fire === 0)) parts.push('Fire');
      if (foe.shrinkT > 0) parts.push(labels()[1] + ' shrunk');
      if (foe.slowT > 0) parts.push(labels()[1] + ' frozen');
      if (m.slowT > 0) parts.push('Frozen!');
      if (m.shrinkT > 0) parts.push('Shrunk!');
    }
    setText(hud.power, parts.join(' · ') || '–');
    setText(hud.input, pads[0].mode === 'keys' ? '⌨ Keys' : pads[0].touch ? '◉ Touch' : '◉ Mouse');
    setText(hud.mute, sfx.muted ? '♪ Off' : '♪ On');
    setText(hud.pause, s.paused ? 'Resume' : 'Pause');
  }

  // ---------- Overlays ----------
  const overlay = $('overlay'), modal = $('modal'), fx = $('fx');
  const letters = (text, cls) =>
    `<h2 class="letters ${cls}">${[...text].map((c, i) => c === ' ' ? '<span class="sp"> </span>' : `<span style="--i:${i}">${c}</span>`).join('')}</h2>`;
  const stat = (label, value, i, extra = '') => `<div class="stat ${extra}" style="--i:${i}"><span>${label}</span><b>${value}</b></div>`;
  const starRow = (n, total = 3) => [...Array(total)].map((_, i) => i < n ? '★' : '<i>★</i>').join('');
  const kmh = v => Math.round(v * KMH) + ' km/h';
  const meter = (label, v) => `<div class="meter">${label}<i style="--v:${Math.round(clamp(v, 0.05, 1) * 100)}%"></i></div>`;

  function rivalMeters(rv) {
    const c = aiConfig(rv, progress.circuit === 'pro');
    return meter('Speed', (c.speed - 300) / 500) + meter('Reflex', (0.3 - c.react) / 0.25)
      + meter('Accuracy', (75 - c.err) / 65) + meter('Angles', c.aggr);

          <div class="ctrl"><h4>Right player</h4><code class="k">↑</code><code class="k">↓</code> slide · <code class="k">Enter</code> push<br><code class="k">R-Shift</code> dash · or right-half touch</div>
        </div>

  }

  function hideOverlay() {
    overlay.classList.remove('show');
    fx.innerHTML = '';
    state.overlay = null;
  }

  function victoryFX() {
    fx.innerHTML = '<div class="flash"></div>';
    for (let i = 0; i < 28; i++) {
      const d = document.createElement('div');
      d.className = 'shard';
      const a = Math.random() * TAU, dist = 300 + Math.random() * 500;
      d.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(0) + 'px');
      d.style.setProperty('--dy', (Math.sin(a) * dist).toFixed(0) + 'px');
      d.style.setProperty('--r', (Math.random() * 720 - 360).toFixed(0) + 'deg');
      d.style.setProperty('--s', (20 + Math.random() * 60).toFixed(0) + 'px');
      const pt = () => `${(Math.random() * 100).toFixed(0)}% ${(Math.random() * 100).toFixed(0)}%`;
      d.style.clipPath = `polygon(${pt()}, ${pt()}, ${pt()})`;
      d.style.animationDelay = (Math.random() * 0.15).toFixed(2) + 's';
      fx.appendChild(d);
    }
    confetti(140);
  }

  // ---------- Actions ----------
  function toMenu() {
    state.paused = false;
    startDemo();
    showOverlay('menu');
  }
  const playing = () => state.mode !== 'demo' && ['faceoff', 'play', 'goal'].includes(state.phase);
  function toggleMute() { sfx.toggle(); if (state.paused) showOverlay('pause'); }
  function togglePause(force) {
    if (!playing()) return;
    const next = force === undefined ? !state.paused : force;
    if (next === state.paused) return;
    state.paused = next;
    for (const p of pads) { p.up = p.down = p.dashReq = p.pushReq = false; }
    if (next) showOverlay('pause'); else hideOverlay();
  }
  function act(a, el) {
    const s = state;
    switch (a) {
      case 'rival': startTour(+el.dataset.i); break;
      case 'circuit': if (el.dataset.v === 'amateur' || progress.proOpen) { progress.circuit = el.dataset.v; saveProgress(); showOverlay('menu'); } break;
      case 'pro': progress.circuit = 'pro'; saveProgress(); startTour(0); break;
      case 'go': beginMatch(); break;
      case 'next': startTour(Math.min(s.rivalIdx + 1, RIVALS.length - 1)); break;
      case 'rematch': startTour(s.rivalIdx); beginMatch(); break;
      case 'restart': s.paused = false; if (s.mode === 'versus') startVersus(); else { startTour(s.rivalIdx); beginMatch(); } break;
      case 'versus': if (s.mode !== 'demo') startDemo(); showOverlay('versus'); break;
      case 'vsTable': s.vsTable = el.dataset.v; showOverlay('versus'); break;
      case 'vsStart': startVersus(); break;
      case 'resume': togglePause(false); break;
      case 'mute': toggleMute(); break;
      case 'quit': toMenu(); break;
      case 'menu': location.href = 'index.html'; break;
    }
  }
  function handleEnter() {
    const s = state;
    if (s.paused) return act('resume');
    const map = { menu: 'rival', intro: 'go', won: 'next', lost: 'rematch', champion: progress.circuit === 'amateur' ? 'pro' : 'quit', versus: 'vsStart', vsEnd: 'vsStart' };
    const a = map[s.overlay];
    if (!a) return;
    const btn = modal.querySelector(`.btn.big[data-act="${a}"]`) || modal.querySelector(`[data-act="${a}"]`);
    act(a, btn || {});
  }

  // ---------- Input ----------
  const KEYS_A = { KeyW: 'up', KeyS: 'down' };
  const KEYS_B = { ArrowUp: 'up', ArrowDown: 'down' };
  window.addEventListener('keydown', e => {
    sfx.ensure();
    const s = state, vs = s.mode === 'versus';
    const ka = KEYS_A[e.code], kb = KEYS_B[e.code];
    if (ka || kb) {
      e.preventDefault();
      const pad = kb && vs ? pads[1] : pads[0];
      pad[ka || kb] = true;
      pad.mode = 'keys';
      return;
    }
    switch (e.code) {
      case 'Space':
        e.preventDefault();
        if (!e.repeat && playing() && !s.paused) pads[0].pushReq = true;
        break;
      case 'ShiftLeft':
        if (!e.repeat && playing() && !s.paused) pads[0].dashReq = true;
        break;
      case 'ShiftRight': case 'Numpad0':
        if (!e.repeat && vs && playing() && !s.paused) pads[1].dashReq = true;
        break;
      case 'Enter': case 'NumpadEnter':
        e.preventDefault();
        if (vs && playing() && !s.paused) { if (!e.repeat) pads[1].pushReq = true; }
        else handleEnter();
        break;
      case 'KeyP': togglePause(); break;
      case 'Escape':
        e.preventDefault();
        if (playing()) togglePause();
        else if (s.overlay && s.overlay !== 'menu') toMenu();
        break;
      case 'KeyM': toggleMute(); break;
    }
    if (DEBUG && playing()) {
      if (e.code === 'KeyG' && s.pucks[0]) { s.pucks[0].last = 0; scoreGoal(0, s.pucks[0]); }
      if (e.code === 'KeyH' && s.pucks[0]) { s.pucks[0].last = 1; scoreGoal(1, s.pucks[0]); }
      if (e.code === 'KeyT') { s.tokenT = 0; s.tokens = []; }
    }
  });
  window.addEventListener('keyup', e => {
    const ka = KEYS_A[e.code], kb = KEYS_B[e.code];
    if (!ka && !kb) return;
    const pad = kb && state.mode === 'versus' ? pads[1] : pads[0];
    pad[ka || kb] = false;
  });

  function toTable(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return [(clientX - r.left) * W / r.width, (clientY - r.top) * H / r.height];
  }
  canvas.addEventListener('mousemove', e => {
    if (!e.movementX && !e.movementY) return;
    const [, y] = toTable(e.clientX, e.clientY);
    pads[0].py = y; pads[0].mode = 'pointer'; pads[0].touch = false;
  });
  canvas.addEventListener('mousedown', e => {
    sfx.ensure();
    if (e.button === 2) { togglePause(); return; }
    const [, y] = toTable(e.clientX, e.clientY);
    pads[0].py = y; pads[0].mode = 'pointer'; pads[0].touch = false;
    if (e.button === 0) pads[0].pushReq = true;
  });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // Touches steer whichever half they start on (both halves only in 2P)
  // A quick tap pushes
  const touchSide = new Map(), touchStart = new Map();
  function onTouch(e) {
    e.preventDefault();
    sfx.ensure();
    for (const t of e.changedTouches) {
      const [x, y] = toTable(t.clientX, t.clientY);
      if (!touchSide.has(t.identifier)) {
        touchSide.set(t.identifier, state.mode === 'versus' && x > CX ? 1 : 0);
        touchStart.set(t.identifier, performance.now());
      }
      const pad = pads[touchSide.get(t.identifier)];
      pad.py = y; pad.mode = 'pointer'; pad.touch = true;
    }
  }
  canvas.addEventListener('touchstart', onTouch, { passive: false });
  canvas.addEventListener('touchmove', onTouch, { passive: false });
  const endTouch = e => {
    for (const t of e.changedTouches) {
      const side = touchSide.get(t.identifier), t0 = touchStart.get(t.identifier);
      if (e.type === 'touchend' && side !== undefined && (performance.now() - t0) / 1000 < TAP_TIME) pads[side].pushReq = true;
      touchSide.delete(t.identifier); touchStart.delete(t.identifier);
    }
  };
  canvas.addEventListener('touchend', endTouch);
  canvas.addEventListener('touchcancel', endTouch);

  overlay.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    sfx.ensure();
    act(b.dataset.act, b);
  });
  hud.pause.addEventListener('click', () => { hud.pause.blur(); togglePause(); });
  hud.mute.addEventListener('click', () => { hud.mute.blur(); sfx.ensure(); toggleMute(); });
  window.addEventListener('blur', () => {
    for (const p of pads) { p.up = p.down = p.dashReq = p.pushReq = false; }
    togglePause(true);
  });
  window.addEventListener('resize', resize);

  // ---------- Loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (!state.paused) {
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
    }
    render();
    updateHUD();
    requestAnimationFrame(frame);
  }

  // Headless balance check: bot vs rival, e.g. __pong.sim(3, {speed: 600, react: 0.15, ...}, 20)
  function sim(rivalIdx, botCfg, matches = 10, pro = false) {
    const out = [];
    const rv = RIVALS[rivalIdx];
    state.sim = true;
    for (let k = 0; k < matches; k++) {
      state.mode = 'tour'; state.rival = rv; state.rivalIdx = rivalIdx;
      setupMatch(rv.table, ['ai', 'ai'], [botCfg, aiConfig(rv, pro)], rv.to, rv.r || MALLET_R);
      faceoff(k % 2, false);
      let t = 0;
      const d = { modes: [{}, {}], speed: 0, half: 0, n: 0, resets: 0, goals: 0, own: 0 };
      state.diag = d;
      while (state.phase !== 'over' && t < 900) {
        step(STEP); t += STEP;
        if (state.phase !== 'play') continue;
        d.n++;
        state.ais.forEach((ai, j) => { d.modes[j][ai.mode] = (d.modes[j][ai.mode] || 0) + 1; });
        const p = state.pucks[0];
        if (p) { d.speed += Math.hypot(p.vx, p.vy); d.half += p.x > CX ? 1 : 0; }
      }
      state.diag = null;
      const pct = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, Math.round(v / d.n * 100)]));
      out.push({ score: state.score.join(':'), time: Math.round(t), rally: state.bestRally, smashes: state.stats.map(x => x.smashes), top: state.stats.map(x => Math.round(x.top)),
        resets: d.resets, own: d.own + '/' + d.goals, speed: Math.round(d.speed / d.n), rivalHalf: Math.round(d.half / d.n * 100), bot: pct(d.modes[0]), rival: pct(d.modes[1]) });
    }
    state.sim = false;
    toMenu();
    return out;
  }
  if (DEBUG) window.__pong = { state, sim, RIVALS, aiConfig, progress, showOverlay, startTour, beginMatch, scoreGoal, step, act };

  resize();
  toMenu();
  if (DEBUG && /[?&]nomenu=1\b/.test(location.search)) {
    hideOverlay();
    const tb = (location.search.match(/table=(\w+)/) || [])[1];
    if (TABLES[tb]) { setupTable(tb); faceoff(0, false); }
    const warp = +(location.search.match(/warp=(\d+)/) || [])[1] || 0;
    for (let i = 0; i < warp * 120; i++) step(STEP);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
