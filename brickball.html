<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Grayscale Brick Ball</title>
<style>
  :root{
    --bg:#111;
    --ink:#eee;
    --muted:#bbb;
    --dim:#777;
    --dimmer:#444;
    --panel:#1a1a1a;
    --accent:#ccc;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial}
  body{overflow-x:hidden}
  .wrap{max-width:1000px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .title{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px}
  .title a{color:var(--muted);text-decoration:none;font-size:22px;line-height:1;padding:0 4px}
  .title a:hover{color:#fff}
  .logo-mark{position:relative;width:22px;height:16px}
  .logo-mark i{position:absolute;left:0;bottom:0;width:22px;height:7px;border-radius:2px;
    background:linear-gradient(#f2f2f2,#9a9a9a);box-shadow:0 0 8px rgba(255,255,255,.2)}
  .logo-mark b{position:absolute;left:7px;top:-4px;width:8px;height:8px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#bbb 50%,#555);animation:markbounce .8s infinite cubic-bezier(.5,0,.5,1) alternate}
  @keyframes markbounce{from{transform:translateY(0)}to{transform:translateY(-6px)}}
  .hud{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
  .pill{
    background:var(--panel);border:1px solid var(--dimmer);
    padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:4px;
    box-shadow:var(--shadow);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap
  }
  .pill b{color:#fff}
  .pill.bump{animation:bump .25s ease-out}
  @keyframes bump{50%{transform:scale(1.12);border-color:#aaa}}
  .pill.input{color:var(--muted);font-size:12px}
  .btn{
    border:1px solid var(--dimmer);background:linear-gradient(#1e1e1e,#161616);
    color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .1s ease,background .2s ease,border-color .2s ease;font-size:14px
  }
  .btn:hover{border-color:#888;background:linear-gradient(#262626,#1a1a1a)}
  .btn:active{transform:scale(.97)}
  .btn.big{padding:12px 26px;font-size:16px;background:linear-gradient(#f4f4f4,#bdbdbd);color:#111;border-color:#ddd}
  .btn.big:hover{background:linear-gradient(#fff,#d0d0d0)}
  .frame{
    background:radial-gradient(1200px 600px at 50% -100px,#202020 20%,#111 60%,#0d0d0d 100%);
    border:1px solid #2b2b2b;border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)
  }
  canvas{display:block;margin:0 auto;border-radius:12px;background:#121212;cursor:none;touch-action:none}
  footer{color:var(--dim);font-size:12px;text-align:center;line-height:2}
  code.k{background:#1a1a1a;border:1px solid #2a2a2a;padding:2px 6px;border-radius:6px;color:var(--ink);font-size:12px}

  /* ---------- Overlay & popups ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;
    display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:16px
  }
  .overlay.show{display:flex}
  .modal{
    position:relative;width:min(92vw,600px);max-height:94vh;overflow:auto;overflow-x:hidden;
    background:linear-gradient(#171717,#0e0e0e);
    border:1px solid #2e2e2e;border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    text-align:center;animation:pop .45s cubic-bezier(.2,.9,.2,1) both
  }
  .modal::after{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);
    background-size:250% 100%;animation:sheen 3.5s ease-in-out infinite
  }
  @keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
  @keyframes pop{
    0%{transform:scale(.8) translateY(30px);opacity:0}
    70%{transform:scale(1.03);opacity:1}
    100%{transform:scale(1)}
  }
  .modal h2{margin:4px 0 8px;font-size:40px;font-weight:900;letter-spacing:4px;line-height:1.1}
  .modal .kicker{color:var(--dim);font-size:12px;letter-spacing:3px;text-transform:uppercase}
  .meta{color:var(--muted);font-size:14px;margin:6px 0 14px;line-height:1.5}
  .hint{color:var(--dim);font-size:12px;margin-top:10px}
  .letters span{display:inline-block}
  .letters .sp{width:.4em}
  .letters.popin span{animation:popin .55s cubic-bezier(.2,1.7,.4,1) both;animation-delay:calc(var(--i) * 55ms)}
  @keyframes popin{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
  .shine h2{color:#fff;animation:glow 1.8s ease-in-out infinite alternate}
  @keyframes glow{from{text-shadow:0 0 6px rgba(255,255,255,.2)}to{text-shadow:0 0 22px rgba(255,255,255,.75)}}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 16px}
  .stat{background:#121212;border:1px solid #262626;border-radius:14px;padding:10px;opacity:0;animation:rise .4s ease-out forwards;animation-delay:calc(.35s + var(--i) * 90ms)}
  .stat.wide{grid-column:1 / -1}
  .stat span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1.5px}
  .stat b{display:block;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat.wide b{font-size:32px}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .badge{display:inline-block;margin:0 0 12px;padding:4px 12px;border-radius:999px;font-weight:900;font-size:12px;letter-spacing:2px;
    background:linear-gradient(90deg,#6a6a6a,#fff,#6a6a6a);background-size:200% 100%;color:#111;animation:shimmer 1.2s linear infinite}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-100% 0}}

  /* Start screen: brick tiles drop in, the ball letters bounce */
  .logo-bricks{display:flex;justify-content:center;gap:6px;margin:14px 0 2px}
  .tile{width:58px;height:40px;border-radius:7px;display:grid;place-items:center;font-weight:900;font-size:26px;color:#151515;
    background:linear-gradient(#fafafa,#cfcfcf 46%,#9b9b9b 54%,#dcdcdc);border:1px solid #eee;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.7),0 6px 14px rgba(0,0,0,.45);
    animation:tileDrop .7s cubic-bezier(.25,1.5,.5,1) both,tileFloat 3s ease-in-out infinite;
    animation-delay:calc(var(--i) * 90ms),calc(1.2s + var(--i) * 180ms)}
  @keyframes tileDrop{0%{transform:translateY(-150px) rotate(-18deg);opacity:0}100%{transform:none;opacity:1}}
  @keyframes tileFloat{50%{transform:translateY(-4px)}}
  .logo-balls{display:flex;justify-content:center;gap:10px;height:88px;align-items:flex-end;margin-bottom:4px}
  .logo-balls span{
    width:50px;height:50px;border-radius:50%;display:grid;place-items:center;
    font-weight:900;font-size:24px;color:#151515;
    background:radial-gradient(circle at 35% 30%,#fff,#cfcfcf 35%,#6e6e6e 80%,#2c2c2c);
    box-shadow:0 0 22px rgba(255,255,255,.15);
    animation:bounce 1.1s infinite;animation-delay:calc(.5s + var(--i) * 140ms)
  }
  @keyframes bounce{
    0%{transform:translateY(0) scale(1.15,.85);animation-timing-function:ease-out}
    12%{transform:translateY(-8px) scale(.95,1.05);animation-timing-function:ease-out}
    50%{transform:translateY(-34px) scale(1);animation-timing-function:ease-in}
    100%{transform:translateY(0) scale(1.15,.85)}
  }
  .ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin:10px 0}
  .ctrl{background:#121212;border:1px solid #262626;border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:2}
  .ctrl h4{margin:0 0 2px;color:var(--ink);font-size:14px}
  .powers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 16px}
  .chip{display:flex;align-items:center;gap:6px;border:1px solid var(--dimmer);background:var(--panel);
    border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
  .chip .glyph{min-width:26px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;
    font-size:10px;color:#111;background:linear-gradient(#fafafa,#a8a8a8);font-weight:900}
  .chip.bad .glyph{background:linear-gradient(#4a4a4a,#222);color:#ddd;border:1px dashed #888}

  /* Stage clear: a ball sweeps along a mini wall and shatters it */
  .wall{position:relative;display:flex;justify-content:center;gap:3px;margin:8px auto 4px;width:max-content}
  .mb{position:relative;width:28px;height:13px}
  .mb::before,.mb::after{content:"";position:absolute;top:0;width:50%;height:100%;
    background:linear-gradient(#f4f4f4,#a2a2a2);animation:halfL .9s cubic-bezier(.3,.6,.4,1) both;
    animation-delay:calc(.3s + var(--i) * 45ms)}
  .mb::before{left:0;border-radius:3px 0 0 3px}
  .mb::after{right:0;border-radius:0 3px 3px 0;animation-name:halfR}
  @keyframes halfL{0%,25%{transform:none;opacity:1}100%{transform:translate(-22px,48px) rotate(-75deg);opacity:0}}
  @keyframes halfR{0%,25%{transform:none;opacity:1}100%{transform:translate(22px,56px) rotate(85deg);opacity:0}}
  .wall .sweep{position:absolute;top:-1px;left:-18px;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#bbb 55%,#555);box-shadow:0 0 12px rgba(255,255,255,.8);
    animation:sweep .75s .25s cubic-bezier(.4,0,.6,1) both}
  @keyframes sweep{0%{transform:translateX(0);opacity:1}90%{opacity:1}100%{transform:translateX(calc(13 * 31px + 24px));opacity:0}}

  /* Game over: steel tiles slam down, crack, crumble and shed debris */
  .over-wrap{position:relative;display:inline-block;margin-top:6px}
  .ltiles{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
  .ltiles span{width:44px;height:52px;border-radius:7px;display:grid;place-items:center;font-weight:900;font-size:28px;color:#e8e8e8;
    background:linear-gradient(#5e5e5e,#2e2e2e 55%,#222);border:1px solid #777;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 8px 18px rgba(0,0,0,.5);
    animation:slam .7s cubic-bezier(.25,1.45,.5,1) both,crumble 1.4s ease-in both;
    animation-delay:calc(var(--i) * 70ms),calc(1.25s + var(--i) * 60ms)}
  .ltiles .sp{width:14px;background:none;border:none;box-shadow:none}
  @keyframes slam{0%{transform:translateY(-170px) rotate(-22deg);opacity:0}60%{transform:translateY(10px) rotate(4deg);opacity:1}100%{transform:none}}
  @keyframes crumble{0%{transform:none}35%{transform:translateY(2px) rotate(calc(var(--r) * 1deg))}100%{transform:translateY(7px) rotate(calc(var(--r) * 2deg))}}
  .crack{position:absolute;left:-3%;top:40%;width:106%;height:36px;overflow:visible;pointer-events:none}
  .crack path{fill:none;stroke:#f2f2f2;stroke-width:2.5;stroke-linejoin:bevel;stroke-dasharray:420;stroke-dashoffset:420;
    filter:drop-shadow(0 0 4px rgba(255,255,255,.6));animation:draw .35s .95s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .debris{position:absolute;left:0;right:0;top:60%;height:0;pointer-events:none}
  .debris i{position:absolute;left:var(--x);width:var(--s);height:var(--s);background:linear-gradient(135deg,#8a8a8a,#3a3a3a);opacity:0;
    animation:fall 1.3s cubic-bezier(.5,0,.9,.6) both;animation-delay:var(--d)}
  @keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(140px) rotate(var(--rot));opacity:0}}
  .modal.over{animation:pop .45s cubic-bezier(.2,.9,.2,1) both,shake .5s 1s both}
  @keyframes shake{
    15%{translate:-10px 4px}30%{translate:9px -3px}45%{translate:-6px 2px}60%{translate:4px -1px}80%{translate:-2px 0}100%{translate:0 0}
  }

  /* Victory: the ball blasts through a wall in front of spinning rays */
  .burst{position:relative;height:130px;display:grid;place-items:center;margin-top:4px}
  .rays{position:absolute;left:50%;top:50%;width:320px;height:320px;translate:-50% -50%;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,255,255,.13) 0 9deg,transparent 9deg 18deg);
    -webkit-mask:radial-gradient(circle,#000 15%,transparent 65%);mask:radial-gradient(circle,#000 15%,transparent 65%);
    animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bwall{position:absolute;left:50%;top:50%;width:0;height:0}
  .bwall i{position:absolute;width:40px;height:20px;border-radius:4px;margin:-10px 0 0 -20px;
    background:linear-gradient(#f4f4f4,#9c9c9c);box-shadow:0 4px 10px rgba(0,0,0,.4);
    transform:translate(var(--x),var(--y));animation:blast 1.1s .55s cubic-bezier(.15,.7,.3,1) both}
  @keyframes blast{0%{transform:translate(var(--x),var(--y))}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
  .hero-ball{position:relative;width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#d8d8d8 35%,#7a7a7a 80%,#2c2c2c);
    box-shadow:0 0 34px rgba(255,255,255,.75);animation:heroIn .7s .5s cubic-bezier(.2,1.6,.4,1) both,heroPulse 1.6s 1.3s ease-in-out infinite alternate}
  @keyframes heroIn{0%{transform:scale(.1);opacity:0}100%{transform:none;opacity:1}}
  @keyframes heroPulse{to{box-shadow:0 0 60px rgba(255,255,255,.95)}}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
  .flash{position:absolute;inset:0;background:#fff;animation:flash 1.1s ease-out forwards}
  @keyframes flash{from{opacity:1}to{opacity:0}}
  .shard{position:absolute;left:50%;top:50%;width:var(--s);height:calc(var(--s) * .5);border-radius:3px;
    background:linear-gradient(#fff,#8a8a8a);opacity:0;
    animation:fly 1.6s cubic-bezier(.1,.7,.3,1) forwards}
  @keyframes fly{
    0%{transform:translate(-50%,-50%) rotate(0);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r));opacity:0}
  }
  @media (max-width:560px){
    .ctrl-grid{grid-template-columns:1fr}
    .tile{width:44px;height:32px;font-size:20px}
    .logo-balls span{width:40px;height:40px;font-size:19px}
    .ltiles span{width:32px;height:40px;font-size:21px}
    .mb{width:18px}
    @keyframes sweep{0%{transform:translateX(0);opacity:1}90%{opacity:1}100%{transform:translateX(calc(13 * 21px + 24px));opacity:0}}
    .modal h2{font-size:30px;letter-spacing:2px}
    .modal{padding:18px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <a href="index.html" title="Back to games" aria-label="Back to games">‹</a>
        <span class="logo-mark"><i></i><b></b></span>
        <div>Grayscale Brick Ball</div>
      </div>
      <div class="hud">
        <div class="pill" id="scorePill">Score&nbsp;<b id="score">0</b></div>
        <div class="pill">Stage&nbsp;<b id="stage">1</b></div>
        <div class="pill">Lives&nbsp;<b id="lives">♥♥♥</b></div>
        <div class="pill" title="Active powers">✦&nbsp;<b id="power">–</b></div>
        <div class="pill input" id="inputChip" title="Last used input">⌨ Keys</div>
        <button class="btn" id="muteBtn">♪ On</button>
        <button class="btn" id="pauseBtn">Pause</button>
      </div>
    </header>
    <div class="frame">
      <canvas id="game" aria-label="Brick Ball game"></canvas>
    </div>
    <footer>
      Move <code class="k">←</code><code class="k">→</code> / <code class="k">A</code><code class="k">D</code> (hold to speed up)
      &nbsp;•&nbsp; Launch / Laser <code class="k">Space</code>
      &nbsp;•&nbsp; Pause <code class="k">P</code>
      &nbsp;•&nbsp; Mouse: move to steer, click to launch or fire
    </footer>
  </div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="modal" id="modal"></div>
  </div>
  <div id="fx"></div>

<script>
(() => {
  'use strict';

  // ---------- Tuning ----------
  const W = 960, H = 600, WALL = 16, TOP = 16, COLS = 13;
  const CELL_W = (W - WALL * 2) / COLS, CELL_H = 26, GRID_Y = TOP + 46;
  const PADDLE_Y = 552, PADDLE_H = 16;
  const PADDLE_W = { normal: 112, expand: 168, shrink: 74 };
  const BALL_R = 7, STEP = 1 / 120, MAX_BALLS = 8;
  const KEY_SPEED = 430, KEY_SPEED_MAX = 980, KEY_ACCEL_T = 0.45, MOUSE_SPEED = 2600;
  const MAX_BOUNCE = 1.05;            // ~60° from vertical off the paddle tips
  const MIN_ANGLE = 0.33;             // never flatter than ~19° from horizontal
  const MIN_TILT = 0.17;              // never steeper than ~10° from vertical (no endless up-down loops)
  const SPEED_ABS_MAX = 640, RAMP_HITS = 10, RAMP_TIME = 12, RAMP_K = 1.025, RAMP_CAP = 1.38;
  // Perks arrive on a clock, not by luck: one capsule every PERK_EVERY seconds of live play.
  // The longer a stage drags on, the more the mix leans to brick-clearing perks.
  const PERK_FIRST = 3.2, PERK_EVERY = 5.6, PERK_JITTER = 0.96, PERK_BOOST_T = 35, PERK_RESCUE_T = 65;
  const BREAKERS = ['fire', 'multi', 'laser'];
  const MAX_ITEMS = 3, ITEM_FALL = 150;
  const LASER_SPEED = 950, LASER_CD = 0.3;
  const AUTO_LAUNCH = 4, CATCH_HOLD = 2.5, STALL_HITS = 12;
  const LOCK_PLATE = 12;              // lock hatch thickness, centred in its cell
  const STEEL_LASER_HITS = 3;         // steel and locks: a Fireball smashes them, or 3 laser shots
  // Slit in a lock: the ball is 14px across, so the margin shrinks from 13px to 5px a side
  const slitWidth = i => i < 2 ? 40 : i < 4 ? 34 : i < 7 ? 28 : i < STAGE_COUNT ? 24 : 22;
  const LIFE_AT = [10000, 30000, 60000, 100000], LIFE_EVERY = 50000, MAX_LIVES = 7;
  const CONTINUE_LIVES = 3, STAGE_COUNT = 10;
  const MOD_TIME = { expand: 25, laser: 14, catch: 18, shrink: 12 };
  const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const DEBUG = /[?&]debug=1\b/.test(location.search);
  const TAU = Math.PI * 2;

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const rand = (a, b) => a + Math.random() * (b - a);
  const $ = id => document.getElementById(id);

  // ---------- Stages ----------
  // 13 columns. a–e normal bricks (light → dark), s silver (multi-hit),
  // # steel (only a Fireball or 3 laser shots break it), v lock: a steel plate with a slit barely wider than the ball,
  // x TNT (blows up its neighbours), . empty.
  // Every layout hides at least one sealed formation whose only way in is a lock.
  // Once enough of a formation is destroyed, its locks blow open.
  const MAPS = {
    1: [
      { name: 'Treasure Box', rows: [
        '.###########.',
        '.#aaaaaaaaa#.',
        '.#bbbxbbbbb#.',
        '.#ccccccccc#.',
        '.#ddddddddd#.',
        '.#####v#####.',
        '.............',
        'eeeee...eeeee',
        'aa.aa.a.aa.aa'] },
      { name: 'Pyramid Vault', rows: [
        '......a......',
        '.....###.....',
        '....#bbb#....',
        '...#ccxcc#...',
        '..#ddddddd#..',
        '.#.eeeeeee.#.',
        '.###v###v###.',
        'aa.........aa',
        'bbbb.....bbbb'] },
      { name: 'The Cage', rows: [
        'a.b.c.d.c.b.a',
        '.............',
        '..#########..',
        '..#aaaaaaa#..',
        '..#bbxbxbb#..',
        '..#ccccccc#..',
        '..####v####..',
        '.............',
        'dd.dd.d.dd.dd'] }
    ],
    2: [
      { name: 'Twin Vaults', rows: [
        '#####...#####',
        '#bbb#.c.#bbb#',
        '#bxb#.c.#bxb#',
        '#ccc#.c.#ccc#',
        '##v##...##v##',
        '.............',
        'aaaaaaaaaaaaa',
        'ddd.ddddd.ddd'] },
      { name: 'Bunker', rows: [
        '#############',
        '#aaaaaaaaaaa#',
        '#bbbbxbbbbbb#',
        '#ccccccccccc#',
        '#ddddddddddd#',
        '#####v#v#####',
        '.............',
        'eeeeeeeeeeeee',
        '.s.s.s.s.s.s.'] },
      { name: 'Pinball Arena', rows: [
        '.###########.',
        '.#.........#.',
        '.#bbbbbbbbb#.',
        '.#b#b#b#b#b#.',
        '.#ccccccccc#.',
        '.#cxcccccxc#.',
        '.#ddddddddd#.',
        '.#####v#####.',
        '.............',
        'aaaaa...aaaaa',
        '.e.e.e.e.e.e.'] }
    ],
    3: [
      { name: 'Chambers', rows: [
        '#############',
        '#aaaaxaaaaaa#',
        '#bbbbbbbbbbb#',

    s.stageIndex = 0; s.stage = def; s.endless = false;
