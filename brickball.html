    Object.assign(s, { base: 380, cap: 380, speed: 380, boss: null, items: [], lasers: [], bolts: [], explosions: [],
      mod: null, slowT: 0, fireT: 0, barrier: 0, combo: 0 });
    s.paddle = newPaddle();
    s.balls = [stuckBall()];
    s.bg = buildScene(0);
  }

  function newGame() {
    Object.assign(state, {
      score: 0, lives: 3, lifeIdx: 0, nextLifeAt: LIFE_AT[0], bestCombo: 0, totalBroken: 0,
      endless: false, newBest: false, paused: false, particles: [], texts: [], run: buildRun()
    });
    hideOverlay();
    const start = DEBUG ? clamp((+(location.search.match(/stage=(\d+)/) || [])[1] || 1) - 1, 0, 30) : 0;
    loadStage(start);
  }

  function toMenu() {
    state.phase = 'menu';
    state.paused = false;
    setupDemo();
    showOverlay('menu');
  }

  // ---------- Effects helpers ----------
  function floatText(x, y, text, size = 14) {
    // stack labels that would land on top of each other
    for (const t of state.texts) if (Math.abs(t.x - x) < 120 && Math.abs(t.y - y) < size + 4) y = t.y - size - 6;
    state.texts.push({ x, y, text, size, life: 1.1 });
  }
  function spawnShards(x, y, color, n, power = 1) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = (60 + Math.random() * 220) * power;
      state.particles.push({
        k: 'shard', x: x + rand(-CELL_W / 3, CELL_W / 3), y: y + rand(-6, 6),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140, life: 0.5 + Math.random() * 0.6, max: 1.1,
        size: 2 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 16,
        c: Math.random() < 0.6 ? color : '#6a6a6a'
      });
    }
    if (state.particles.length > 900) state.particles.splice(0, state.particles.length - 900);
  }
  function spawnSparks(x, y, n = 6, up = false) {
    for (let i = 0; i < n; i++) {
      const a = (up ? -Math.PI / 2 : Math.random() * TAU) + (Math.random() - 0.5) * (up ? 1.6 : 1);
      const sp = 120 + Math.random() * 220;
      state.particles.push({ k: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.2 + Math.random() * 0.25, max: 0.45 });
    }
  }
  function ring(x, y, r, vr = 300, life = 0.35) {
    state.particles.push({ k: 'ring', x, y, r, vr, life, max: life });
  }
  function smoke(x, y, n) {
    for (let i = 0; i < n; i++)
      state.particles.push({ k: 'smoke', x: x + rand(-20, 20), y: y + rand(-10, 10), vx: rand(-30, 30), vy: rand(-60, -20),
        r: rand(8, 18), life: 0.8 + Math.random() * 0.6, max: 1.4 });
  }
  function confetti(n) {
    for (let i = 0; i < n; i++) {
      state.particles.push({
        k: 'conf', x: WALL + Math.random() * (W - WALL * 2), y: TOP - 10 - Math.random() * 120,
        vx: (Math.random() - 0.5) * 80, vy: 40 + Math.random() * 120, life: 2.6, max: 2.6,
        size: 3 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10,
        c: ['#fff', '#cfcfcf', '#8a8a8a', '#5a5a5a'][i % 4]
      });
    }
  }
  function crackPath(w, h) {
    const pts = [], n = 3 + Math.floor(Math.random() * 3);
    let x = rand(w * 0.2, w * 0.8), y = Math.random() < 0.5 ? 0 : h;
    const dir = y === 0 ? 1 : -1;
    pts.push([x, y]);
    for (let i = 1; i <= n; i++) { x += rand(-w * 0.18, w * 0.18); y += dir * h / n * rand(0.7, 1.2); pts.push([clamp(x, 2, w - 2), clamp(y, 0, h)]); }
    return pts;
  }

  // ---------- Scoring ----------
  const comboMult = () => Math.min(5, 1 + Math.floor(state.combo / 5));
  function addScore(n, x, y, show = true) {
    const s = state;
    if (s.phase !== 'play' && s.phase !== 'clearing') return;
    n = Math.round(n);
    s.score += n;
    if (show && x != null) floatText(x, y, '+' + n, n >= 500 ? 18 : 13);
    while (s.score >= s.nextLifeAt) {
      if (s.lives < MAX_LIVES) { s.lives++; sfx.life(); floatText(W / 2, 330, 'EXTRA LIFE!', 26); }
      s.lifeIdx++;
      s.nextLifeAt = s.lifeIdx < LIFE_AT.length ? LIFE_AT[s.lifeIdx]
        : LIFE_AT[LIFE_AT.length - 1] + LIFE_EVERY * (s.lifeIdx - LIFE_AT.length + 1);
    }
  }
  function updateBest() {
    if (state.score > state.best) { state.best = state.score; state.newBest = true; saveBest(state.best); }
  }

  // ---------- Ball physics ----------
  function launch(b) {
    const s = state, p = s.paddle;
    let ang = clamp(b.off / (p.w / 2), -1, 1) * MAX_BOUNCE * 0.8;
    if (Math.abs(ang) < 0.15) ang = ang < 0 ? -0.15 : 0.15;
    b.vx = Math.sin(ang) * s.speed; b.vy = -Math.cos(ang) * s.speed;
    b.stuck = false; b.caught = false; b.stuckT = 0;
    sfx.launch();
  }
  function releaseBalls() { for (const b of state.balls) if (b.stuck) launch(b); }

  function fixVelocity(b) {
    const s = state;
    const sp = Math.hypot(b.vx, b.vy) || 1;
    b.vx *= s.speed / sp; b.vy *= s.speed / sp;
    const minVy = s.speed * Math.sin(MIN_ANGLE), minVx = s.speed * Math.sin(MIN_TILT) * 0.6;
    if (Math.abs(b.vy) < minVy) {
      b.vy = (b.vy < 0 ? -1 : 1) * minVy;
      b.vx = (b.vx < 0 ? -1 : 1) * Math.sqrt(s.speed * s.speed - minVy * minVy);
    } else if (Math.abs(b.vx) < minVx) {
      b.vx = (b.vx < 0 || (b.vx === 0 && Math.random() < 0.5) ? -1 : 1) * minVx;
      b.vy = (b.vy < 0 ? -1 : 1) * Math.sqrt(s.speed * s.speed - minVx * minVx);
    }
  }
  function normalizeAll() { for (const b of state.balls) if (!b.stuck) fixVelocity(b); }
  function bumpSpeed(k) {
    state.speed = Math.min(state.cap, state.speed * k);
    normalizeAll();
  }
  // Break up endless loops between steel and walls
  function stall(b) {
    if (++b.streak < STALL_HITS) return;
    b.streak = 0;
    const a = Math.atan2(b.vy, b.vx) + (Math.random() < 0.5 ? -1 : 1) * rand(0.12, 0.2);
    b.vx = Math.cos(a) * state.speed; b.vy = Math.sin(a) * state.speed;
  }

  // Circle vs box. Pushes the ball out and returns the contact normal, or null.
  // If the ball's previous centre was straight above/below or beside the box it is a face hit.
  function contact(b, x, y, w, h, px, py) {
    const cx = clamp(b.x, x, x + w), cy = clamp(b.y, y, y + h);
    const dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy;
    if (d2 > BALL_R * BALL_R) return null;
    const inX = px >= x && px <= x + w, inY = py >= y && py <= y + h;
    let nx = 0, ny = 0;
    if (inX && !inY) { ny = py < y ? -1 : 1; b.y = ny < 0 ? y - BALL_R : y + h + BALL_R; }
    else if (inY && !inX) { nx = px < x ? -1 : 1; b.x = nx < 0 ? x - BALL_R : x + w + BALL_R; }
    else if (d2 > 1e-6) { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; b.x = cx + nx * BALL_R; b.y = cy + ny * BALL_R; }
    else { ny = py < y + h / 2 ? -1 : 1; b.y = ny < 0 ? y - BALL_R : y + h + BALL_R; }
    return { nx, ny };
  }
  const overlaps = (b, x, y, w, h) => {
    const dx = b.x - clamp(b.x, x, x + w), dy = b.y - clamp(b.y, y, y + h);
    return dx * dx + dy * dy <= BALL_R * BALL_R;
  };
  function reflect(b, n) {
    const dot = b.vx * n.nx + b.vy * n.ny;
    if (dot >= 0) return false;      // already moving away (second box at a seam)
    b.vx -= 2 * dot * n.nx; b.vy -= 2 * dot * n.ny;
    return true;
  }

  // Real bricks never bounce perfectly: a tiny scuff keeps the ball from retracing its path
  function scuff(b) {
    const a = Math.atan2(b.vy, b.vx) + rand(-0.035, 0.035), sp = Math.hypot(b.vx, b.vy);
    b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
  }
  function collideBricks(b, px, py) {
    const s = state;
    const c0 = Math.floor((b.x - BALL_R - WALL) / CELL_W), c1 = Math.floor((b.x + BALL_R - WALL) / CELL_W);
    const r0 = Math.floor((b.y - BALL_R - GRID_Y) / CELL_H), r1 = Math.floor((b.y + BALL_R - GRID_Y) / CELL_H);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const br = brickAt(c, r);
      if (!br || !br.alive) continue;
      if (s.fireT > 0) {
        // Fireball ploughs straight through everything, steel and locks included
        const hit = br.type === 'slit' ? br.parts.some(pt => overlaps(b, pt.x, pt.y, pt.w, pt.h)) : overlaps(b, br.x, br.y, br.w, br.h);
        if (hit) {
          b.streak = 0; spawnSparks(b.x, b.y, 4);
          if (solid(br)) smashSolid(br, br.type === 'slit' ? 'LOCK MELTED!' : '', 200); else breakBrick(br, 'fire');
        }
        continue;
      }
      if (br.type === 'slit') {
        // only the two hatch plates are solid; the slit between them is open
        for (const pt of br.parts) { const n = contact(b, pt.x, pt.y, pt.w, pt.h, px, py); if (n && reflect(b, n)) { scuff(b); hitBrick(br, 1, b); } }
        continue;
      }
      const n = contact(b, br.x, br.y, br.w, br.h, px, py);
      if (n && reflect(b, n)) { scuff(b); hitBrick(br, 1, b); }
    }
  }

  function collidePaddle(b) {
    const s = state, p = s.paddle;
    if (b.vy <= 0) return;
    const x0 = p.x - p.w / 2;
    if (b.y > PADDLE_Y + PADDLE_H * 0.7) return;           // already past the face
    if (!overlaps(b, x0, PADDLE_Y, p.w, PADDLE_H)) return;
    const u = clamp((b.x - p.x) / (p.w / 2), -1, 1);
    s.combo = 0; b.streak = 0; p.squash = 1;
    sfx.paddle();
    spawnSparks(b.x, PADDLE_Y, 3, true);
    if (s.mod === 'catch') {
      Object.assign(b, { stuck: true, caught: true, off: b.x - p.x, stuckT: 0, vx: 0, vy: 0, y: PADDLE_Y - BALL_R });
      return;
    }
    // Where it lands on the paddle sets the angle; moving the paddle adds a little english
    let ang = u * MAX_BOUNCE + clamp(p.vx / 1200, -1, 1) * 0.2;
    ang = clamp(ang, -(Math.PI / 2 - MIN_ANGLE), Math.PI / 2 - MIN_ANGLE);
    if (Math.abs(ang) < MIN_TILT) ang = (ang < 0 || (ang === 0 && Math.random() < 0.5) ? -1 : 1) * MIN_TILT;
    b.vx = Math.sin(ang) * s.speed; b.vy = -Math.cos(ang) * s.speed;
    b.y = PADDLE_Y - BALL_R - 0.5;
  }

  function collideBoss(b, px, py) {
    const k = state.boss;
    const n = contact(b, k.x - k.w / 2, k.y - k.h / 2, k.w, k.h, px, py);
    if (n && reflect(b, n)) { b.streak = 0; bossHit(state.fireT > 0 ? 2 : 1, b.x, b.y); }
  }

  function updateBall(b, dt) {
    const s = state;
    const n = Math.max(1, Math.ceil(s.speed * dt / 3)), h = dt / n;
    for (let k = 0; k < n; k++) {
      const px = b.x, py = b.y;
      b.x += b.vx * h; b.y += b.vy * h;
      if (b.x < WALL + BALL_R) { b.x = WALL + BALL_R; b.vx = Math.abs(b.vx); stall(b); sfx.wall(); }
      else if (b.x > W - WALL - BALL_R) { b.x = W - WALL - BALL_R; b.vx = -Math.abs(b.vx); stall(b); sfx.wall(); }
      if (b.y < TOP + BALL_R) { b.y = TOP + BALL_R; b.vy = Math.abs(b.vy); stall(b); sfx.wall(); }
      collideBricks(b, px, py);
      if (s.boss && !s.boss.dead) collideBoss(b, px, py);
      collidePaddle(b);
      if (b.stuck) return;
      if (s.barrier && b.vy > 0 && b.y + BALL_R > H - 10) {
        b.y = H - 10 - BALL_R; b.vy = -Math.abs(b.vy);
        s.barrier--; sfx.barrier(); spawnSparks(b.x, H - 10, 10, true); ring(b.x, H - 10, 6, 200, 0.3);
      }
      fixVelocity(b);
      if (b.y - BALL_R > H) { b.lost = true; return; }
    }
    b.trail.push(b.x, b.y);
    if (b.trail.length > 16) b.trail.splice(0, 2);
    if (s.fireT > 0 && Math.random() < 0.5)
      s.particles.push({ k: 'ember', x: b.x, y: b.y, vx: rand(-30, 30), vy: rand(-30, 30), life: 0.35, max: 0.35 });
  }

  // ---------- Bricks ----------
  function hitBrick(br, dmg, ball) {
    const s = state;
    if (solid(br)) {
      br.flash = 1; sfx.steel();
      if (ball) {
        if (br.type === 'slit') dentLock(br);
        spawnSparks(ball.x, ball.y, 4); stall(ball);
        return;
      }
      br.laserHits = (br.laserHits || 0) + 1;
      br.cracks.push(crackPath(br.w, br.h));
      spawnShards(br.x + br.w / 2, br.y + br.h / 2, '#9a9a9a', 5, 0.6);
      if (br.laserHits >= STEEL_LASER_HITS) smashSolid(br, br.type === 'slit' ? 'LOCK BLASTED!' : 'STEEL BLASTED!', 200);
      return;
    }
    if (ball) ball.streak = 0;
    br.hp -= dmg; br.flash = 1; br.wob = 1;
    if (++s.rampHits >= RAMP_HITS) { s.rampHits = 0; if (s.slowT <= 0) bumpSpeed(RAMP_K); }
    if (br.hp > 0) {
      sfx.silver();
      br.cracks.push(crackPath(br.w, br.h));
      spawnShards(br.x + br.w / 2, br.y + br.h / 2, '#dcdcdc', 4, 0.6);
      return;
    }
    breakBrick(br, ball ? 'ball' : 'laser');
  }

  function breakBrick(br, cause) {
    const s = state;
    if (!br.alive || solid(br)) return;
    br.alive = false;
    s.grid[br.r * COLS + br.c] = null;
    s.breakable--;
    s.combo++; s.broken++; s.totalBroken++;
    if (s.combo > s.bestCombo) s.bestCombo = s.combo;
    if (comboMult() > 1) s.comboShow = 1.2;
    const cx = br.x + br.w / 2, cy = br.y + br.h / 2;
    const base = br.type === 'silver' ? 50 * (s.stageIndex + 2) : br.type === 'tnt' ? 120 : [90, 80, 70, 60, 50][br.shade];
    addScore(base * comboMult(), cx, cy - 6, cause !== 'blast');
    const col = br.type === 'normal' ? SHADE[br.shade] : br.type === 'silver' ? '#f2f2f2' : '#9a9a9a';
    spawnShards(cx, cy, col, br.type === 'silver' ? 14 : 10);
    sfx.brick(br.shade, s.combo);
    if (br.type === 'tnt') queueExplosion(br.c, br.r, 0.06);
    if (br.region != null && --s.regionLeft[br.region] === s.regionOpenAt[br.region]) unlockRegion(br.region);
    if (br.life && s.phase === 'play') {
      s.items.push({ x: cx, y: cy, kind: 'life', rot: 0 });
      floatText(cx, cy - 14, 'EXTRA LIFE!', 16);
    }
  }

  const blocks = (br, x, y) => br.type !== 'slit' || br.parts.some(p => x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h);
  function queueExplosion(c, r, t) { state.explosions.push({ c, r, t }); }
  function detonate(c, r) {
    const s = state;
    const cx = WALL + (c + 0.5) * CELL_W, cy = GRID_Y + (r + 0.5) * CELL_H;
    s.shake = Math.max(s.shake, 11); s.flash = Math.max(s.flash, 0.12);
    sfx.boom();
    ring(cx, cy, 10, 520, 0.4); smoke(cx, cy, 6); spawnSparks(cx, cy, 14);
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const br = brickAt(c + dc, r + dr);
      if (br && br.alive && !solid(br)) breakBrick(br, 'blast');
    }
  }

  // The perk clock: a capsule falls out of a random brick on a steady beat
  function dropPerk() {
    const s = state;
    const pool = s.bricks.filter(b => b.alive && !solid(b) && b.region == null);
    const from = pool.length ? pool : s.bricks.filter(b => b.alive && !solid(b));
    const src = from[Math.floor(Math.random() * from.length)];
    const x = src ? src.x + src.w / 2 : rand(WALL + 60, W - WALL - 60), y = src ? src.y + src.h / 2 : TOP + 10;
    if (src) { src.flash = 1; src.wob = 1; spawnSparks(x, y, 6); }
    s.items.push({ x: clamp(x, WALL + 20, W - WALL - 20), y, kind: pickItem(s.playT), rot: Math.random() * 6 });
  }

  // ---------- Power-ups ----------
  function setMod(kind) {
    const s = state;
    if (s.mod === 'catch' && kind !== 'catch') releaseBalls();
    s.mod = kind; s.modT = MOD_TIME[kind];
  }
  function endMod() {
    if (state.mod === 'catch') releaseBalls();
    state.mod = null; state.modT = 0;
  }
  function splitBalls() {
    const s = state;
    releaseBalls();
    for (const b of s.balls.slice()) {
      for (const da of [-0.42, 0.42]) {
        if (s.balls.length >= MAX_BALLS) break;
        const a = Math.atan2(b.vy, b.vx) + da;
        const nb = { x: b.x, y: b.y, vx: Math.cos(a) * s.speed, vy: Math.sin(a) * s.speed, stuck: false, caught: false, off: 0, stuckT: 0, trail: [], streak: 0, lost: false };
        fixVelocity(nb);
        s.balls.push(nb);
      }
    }
  }
  function applyItem(kind) {
    const s = state, it = ITEMS[kind];
    switch (kind) {
      case 'expand': case 'laser': case 'catch': case 'shrink': setMod(kind); break;
      case 'multi': splitBalls(); break;
      case 'slow': s.slowT = 12; s.speed = Math.max(s.base * 0.72, s.speed * 0.7); normalizeAll(); break;
      case 'fire': s.fireT = 9; break;
      case 'barrier': s.barrier = 1; s.barrierT = 30; break;
      case 'life': if (s.lives < MAX_LIVES) s.lives++; else addScore(1000, s.paddle.x, PADDLE_Y - 44); break;
      case 'fast': s.speed = Math.min(s.cap * 1.1, s.speed * 1.22); normalizeAll(); break;
    }
    if (kind === 'life') sfx.life(); else if (it.good) sfx.pickup(); else sfx.bad();
    if (it.good) addScore(250, null, null, false);
    floatText(s.paddle.x, PADDLE_Y - 26, it.name.toUpperCase(), 16);
  }
  function shootLaser() {
    const s = state, p = s.paddle;
    s.laserCD = LASER_CD;
    for (const side of [-1, 1]) s.lasers.push({ x: p.x + side * (p.w / 2 - 10), y: PADDLE_Y - 6 });
    sfx.laser();
  }

  // ---------- Boss: The Core ----------
  function updateBoss(dt) {
    const s = state, k = s.boss;
    if (!k || k.dead) return;
    const rage = 1 - k.hp / k.max;
    k.x += k.dir * (90 + 150 * rage) * dt;
    if (k.x - k.w / 2 < WALL + 8) { k.x = WALL + 8 + k.w / 2; k.dir = 1; }
    if (k.x + k.w / 2 > W - WALL - 8) { k.x = W - WALL - 8 - k.w / 2; k.dir = -1; }
    k.fireT -= dt;
    k.charge = clamp(1 - k.fireT / 0.7, 0, 1);
    if (k.fireT <= 0) {
      const p = s.paddle, sp = 200 + 120 * rage;
      const tx = p.x + p.vx * 0.25, sy = k.y + k.h / 2;
      const base = Math.atan2(PADDLE_Y - sy, tx - k.x);
      const spread = rage > 0.7 ? [-0.28, 0, 0.28] : [0];
      for (const da of spread) s.bolts.push({ x: k.x, y: sy, vx: Math.cos(base + da) * sp, vy: Math.sin(base + da) * sp, t: 0 });
      sfx.bossShot();
      k.fireT = 3 - 1.3 * rage + Math.random() * 0.5;
    }
    // At 2/3 and 1/3 health the Core rebuilds a shield wall
    if (k.summons < 2 && k.hp <= k.max * (k.summons === 0 ? 0.66 : 0.33)) {
      k.summons++;
      for (let c = 0; c < COLS; c++) if (!brickAt(c, 6)) addBrick(c, 6, 'normal', 2, 1, 1);
      sfx.summon(); s.shake = Math.max(s.shake, 8);
      floatText(W / 2, GRID_Y + 330, 'THE CORE REBUILDS ITS SHIELD!', 20);
    }
    k.flash = Math.max(0, k.flash - dt * 5);
  }
  function bossHit(dmg, x, y) {
    const s = state, k = s.boss;
    k.hp -= dmg; k.flash = 1;
    s.shake = Math.max(s.shake, 5); s.hitStop = 0.03;
    sfx.bossHit(); spawnSparks(x, y, 8);
    addScore(300 * comboMult(), x, y - 10);
    if (k.hp <= 0) {
      k.dead = true;
      addScore(10000, k.x, k.y, true);
      startClearing();
    }
  }
  function updateBolts(dt) {
    const s = state, p = s.paddle;
    for (const o of s.bolts) {
      o.x += o.vx * dt; o.y += o.vy * dt; o.t += dt;
      const br = brickAt(Math.floor((o.x - WALL) / CELL_W), Math.floor((o.y - GRID_Y) / CELL_H));
      if (br && br.alive && blocks(br, o.x, o.y)) { o.dead = true; spawnSparks(o.x, o.y, 5); br.flash = 1; continue; }
      if (o.x < WALL || o.x > W - WALL || o.y > H + 10) { o.dead = true; continue; }
      for (const b of s.balls) if (!b.stuck && Math.hypot(b.x - o.x, b.y - o.y) < BALL_R + 7) {
        o.dead = true; spawnSparks(o.x, o.y, 8); addScore(100, o.x, o.y - 8); sfx.steel(); break;
      }
      if (!o.dead && s.barrier && o.y > H - 14) {
        o.dead = true; s.barrier = 0; sfx.barrier(); spawnSparks(o.x, H - 10, 12, true);
        continue;
      }
      if (!o.dead && o.y + 6 >= PADDLE_Y && o.y - 6 <= PADDLE_Y + PADDLE_H && Math.abs(o.x - p.x) <= p.w / 2 + 4) {
        o.dead = true;
        startDying('bolt');
        return;
      }
    }
    s.bolts = s.bolts.filter(o => !o.dead);
  }

  // ---------- Phases ----------
  function startClearing() {
    const s = state;
    s.phase = 'clearing'; s.clearT = 0;
    const i = s.stageIndex;
    s.bonus = {
      clear: 1000 + 250 * i,
      speed: Math.max(0, Math.round((s.parT - s.stageT) * 15)),
      flawless: s.lostThisStage ? 0 : 2000 + 500 * i
    };
    addScore(s.bonus.clear + s.bonus.speed + s.bonus.flawless, null, null, false);
    s.items = []; s.bolts = []; s.lasers = [];
    s.flash = 0.35;
    if (s.boss) { s.shake = 26; s.flash = 0.8; sfx.boom(); }
    sfx.clear();
    confetti(s.boss ? 90 : 40);
  }
  function finishStage() {
    const s = state;
    updateBest();
    if (s.stageIndex === STAGE_COUNT - 1 && !s.endless) { s.phase = 'win'; sfx.win(); showOverlay('win'); }
    else { s.phase = 'clear'; showOverlay('clear'); }
  }
  function startDying(reason) {
    const s = state, p = s.paddle;
    s.phase = 'dying'; s.deathT = 0; s.deathReason = reason; s.lostThisStage = true;
    s.shake = 16;
    spawnShards(p.x, PADDLE_Y + 8, '#e0e0e0', 26, 1.4);
    smoke(p.x, PADDLE_Y, 6);
    sfx.lose();
  }
  function afterDeath() {
    const s = state;
    s.lives--;
    if (s.lives <= 0) { s.phase = 'over'; updateBest(); sfx.over(); showOverlay('over'); }
    else respawn();
  }

  // ---------- Paddle ----------
  function aiTarget() {
    const s = state, p = s.paddle;
    let best = null;
    for (const b of s.balls) if (!b.stuck && b.vy > 0 && (!best || b.y > best.y)) best = b;
    if (!best) return W / 2 + Math.sin(s.realT * 0.7) * 120;
    let x = best.x + best.vx * (PADDLE_Y - best.y) / best.vy;
    const lo = WALL + BALL_R, span = W - 2 * WALL - 2 * BALL_R;
    const m = ((x - lo) % (2 * span) + 2 * span) % (2 * span);
    x = m > span ? lo + 2 * span - m : lo + m;
    return x + Math.sin(s.realT * 1.3) * p.w * 0.3;
  }
  function movePaddle(dt, ai) {
    const s = state, p = s.paddle;
    const prevX = p.x;
    const target = ai ? aiTarget() : (input.mode !== 'kbd' && input.mouseX != null ? input.mouseX : null);
    if (target != null) {
      const maxStep = (ai ? 900 : MOUSE_SPEED) * dt;
      p.x += clamp(target - p.x, -maxStep, maxStep);
    } else {
      // Holding a direction accelerates; a fresh press or reversal starts at base speed
      const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      if (dir !== input.holdDir) { input.holdDir = dir; input.holdT = 0; }
      if (dir) {
        input.holdT += dt;
        const k = clamp(input.holdT / KEY_ACCEL_T, 0, 1);
        p.x += dir * (KEY_SPEED + (KEY_SPEED_MAX - KEY_SPEED) * k * k) * dt;
      }
    }
    const tw = PADDLE_W[s.mod === 'expand' ? 'expand' : s.mod === 'shrink' ? 'shrink' : 'normal'];
    p.w += (tw - p.w) * Math.min(1, dt * 10);
    p.x = clamp(p.x, WALL + p.w / 2, W - WALL - p.w / 2);
    p.vx = (p.x - prevX) / dt;
    p.squash = Math.max(0, p.squash - dt * 5);
  }

  // ---------- Main update ----------
  function updateGame(dt, ai) {
    const s = state, p = s.paddle;
    s.stageT += dt; s.bannerT += dt;
    if (s.mod && (s.modT -= dt) <= 0) endMod();
    if (s.slowT > 0) s.slowT -= dt;
    if (s.fireT > 0) s.fireT -= dt;
    if (s.barrier && (s.barrierT -= dt) <= 0) s.barrier = 0;
    if (s.laserCD > 0) s.laserCD -= dt;
    if (s.comboShow > 0) s.comboShow -= dt;
    if (s.fireBuffer > 0) s.fireBuffer -= dt;
    // Speed creeps up over time (Arkanoid-style), paused while Slow is active
    if (s.slowT <= 0 && s.balls.some(b => !b.stuck)) {
      s.rampT += dt;
      if (s.rampT >= RAMP_TIME) { s.rampT = 0; bumpSpeed(RAMP_K); }
    }
    movePaddle(dt, ai);

    // Perk clock: only ticks while a ball is actually in play
    if (!ai && s.balls.some(b => !b.stuck)) {
      s.playT += dt;
      if ((s.perkT -= dt) <= 0) {
        s.perkT = PERK_EVERY + rand(-PERK_JITTER, PERK_JITTER);
        if (s.items.length < MAX_ITEMS) dropPerk();
      }
    }

    if (!ai) {
      const press = s.fireBuffer > 0;
      if (press && s.balls.some(b => b.stuck)) { releaseBalls(); s.fireBuffer = 0; }
      else if (s.mod === 'laser' && (press || input.fireHeld) && s.laserCD <= 0) { shootLaser(); s.fireBuffer = 0; }
    }

    for (const b of s.balls) {
      if (b.stuck) {
        b.stuckT += dt;
        b.off = clamp(b.off, -p.w / 2 + 4, p.w / 2 - 4);
        b.x = p.x + b.off; b.y = PADDLE_Y - BALL_R;
        const wait = ai ? 0.8 : b.caught ? CATCH_HOLD : AUTO_LAUNCH;
        if (b.stuckT >= wait) launch(b);
        continue;
      }
      updateBall(b, dt);
    }

    for (const l of s.lasers) {
      l.y -= LASER_SPEED * dt;
      const br = brickAt(Math.floor((l.x - WALL) / CELL_W), Math.floor((l.y - GRID_Y) / CELL_H));
      if (br && br.alive && blocks(br, l.x, l.y)) { l.dead = true; spawnSparks(l.x, l.y, 3, false); hitBrick(br, 1, null); continue; }
      const k = s.boss;
      if (k && !k.dead && Math.abs(l.x - k.x) < k.w / 2 && Math.abs(l.y - k.y) < k.h / 2) { l.dead = true; bossHit(0.5, l.x, l.y); continue; }
      for (const o of s.bolts) if (Math.abs(o.x - l.x) < 8 && Math.abs(o.y - l.y) < 12) { o.dead = l.dead = true; spawnSparks(o.x, o.y, 6); addScore(100, o.x, o.y); }
      if (l.y < TOP) l.dead = true;
    }
    s.lasers = s.lasers.filter(l => !l.dead);

    for (const it of s.items) {
      it.y += ITEM_FALL * dt; it.rot += dt * 5;
      if (it.y + 8 >= PADDLE_Y && it.y - 8 <= PADDLE_Y + PADDLE_H && Math.abs(it.x - p.x) <= p.w / 2 + 16) { it.dead = true; applyItem(it.kind); }
      else if (it.y > H + 20) it.dead = true;
    }
    s.items = s.items.filter(it => !it.dead);

    for (const e of s.explosions) if ((e.t -= dt) <= 0) { e.dead = true; detonate(e.c, e.r); }
    s.explosions = s.explosions.filter(e => !e.dead);

    if (s.boss) { updateBoss(dt); updateBolts(dt); if (s.phase !== 'play' && !ai) return; }

    if (s.phase === 'clearing') return;
    s.balls = s.balls.filter(b => !b.lost);
    if (!s.balls.length) {
      if (ai) s.balls = [stuckBall()];
      else { startDying('ball'); return; }
    }
    if (!s.boss && s.breakable <= 0) {
      if (ai) setupDemo(); else startClearing();
    }
  }

  function updateParticles(dt) {
    const s = state;
    for (const pt of s.particles) {
      pt.life -= dt;
      if (pt.k === 'ring') { pt.r += pt.vr * dt; continue; }
      if (pt.k === 'smoke') { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.r += 14 * dt; continue; }
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      if (pt.k === 'shard') { pt.vy += 900 * dt; pt.rot += pt.vr * dt; }
      else if (pt.k === 'conf') { pt.vy += 30 * dt; pt.vx += Math.sin(pt.life * 6) * 6 * dt; pt.rot += pt.vr * dt; }
      else if (pt.k === 'spark') { pt.vx *= 0.92; pt.vy = pt.vy * 0.92 + 400 * dt; }
    }
    s.particles = s.particles.filter(pt => pt.life > 0);
    for (const t of s.texts) { t.life -= dt; t.y -= 40 * dt; }
    s.texts = s.texts.filter(t => t.life > 0);
    for (const br of s.bricks) {
      if (br.flash > 0) br.flash = Math.max(0, br.flash - dt * 6);
      if (br.grow > 0) br.grow = Math.max(0, br.grow - dt * 3);
      if (br.wob > 0) br.wob = Math.max(0, br.wob - dt * 3.5);
    }
    s.introT += dt;
    for (const gl of s.glints) gl.t -= dt;
    s.glints = s.glints.filter(gl => gl.t > 0);
    if ((s.glintT -= dt) <= 0) {
      s.glintT = rand(0.25, 0.8);
      const pick = s.bricks[Math.floor(Math.random() * s.bricks.length)];
      if (pick && pick.alive && (pick.type === 'normal' || pick.type === 'silver')) s.glints.push({ br: pick, t: 0.5 });
    }
    if (!s.dust.length) for (let k = 0; k < 44; k++) s.dust.push({ x: rand(0, W), y: rand(0, H), vy: rand(4, 14), vx: rand(-4, 4), r: rand(0.6, 1.8), a: rand(0.05, 0.2), ph: rand(0, TAU) });
    for (const m of s.dust) {
      m.y -= m.vy * dt; m.x += m.vx * dt;
      if (m.y < -4) { m.y = H + 4; m.x = rand(0, W); }
      if (m.x < -4) m.x = W + 4; else if (m.x > W + 4) m.x = -4;
    }
  }

  function step(dt) {
    const s = state;
    s.realT += dt;
    s.shake *= Math.exp(-9 * dt);
    if (s.shake < 0.2) s.shake = 0;
    s.flash = Math.max(0, s.flash - dt * 1.6);
    updateParticles(dt);
    if (s.hitStop > 0) { s.hitStop -= dt; return; }
    switch (s.phase) {
      case 'menu': updateGame(dt, true); break;
      case 'play': updateGame(dt, false); break;
      case 'clearing': {
        s.clearT += dt;
        // The Core goes out with a chain of blasts, and leftover bricks shatter
        if (s.boss && s.clearT < 1.5 && Math.random() < dt * 9) {
          const k = s.boss;
          const x = k.x + rand(-k.w / 2, k.w / 2), y = k.y + rand(-k.h / 2, k.h / 2);
          ring(x, y, 8, 420, 0.4); smoke(x, y, 3); spawnShards(x, y, '#cfcfcf', 10, 1.3);
          s.shake = Math.max(s.shake, 10); sfx.boom();
        }
        if (s.boss && s.clearT > 0.6) for (const br of s.bricks) if (br.alive && !solid(br) && Math.random() < dt * 3) breakBrick(br, 'blast');
        if (s.clearT >= (s.boss ? 2.4 : 1.5)) finishStage();
        break;
      }
      case 'dying':
        s.deathT += dt;
        if (s.deathT >= 1.4) afterDeath();
        break;
    }
  }

  // ---------- Rendering ----------
  function bigText(text, x, y, size, alpha = 1, scale = 1) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.font = `900 ${size}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, size / 9);
    ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.strokeText(text, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  function drawArena() {
    const t = state.realT;
    drawBackdrop();
    // Metal frame: two side pipes and a top rail, with joints and running chase lights
    const pipe = (x, y, w, h, vertical) => {
      const g = vertical ? ctx.createLinearGradient(x, 0, x + w, 0) : ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, '#2a2a2a'); g.addColorStop(0.45, '#7a7a7a'); g.addColorStop(0.6, '#5a5a5a'); g.addColorStop(1, '#1e1e1e');
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    };
    pipe(0, 0, WALL, H, true); pipe(W - WALL, 0, WALL, H, true); pipe(0, 0, W, TOP, false);
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    for (let y = 70; y < H; y += 110) { ctx.fillRect(0, y, WALL, 4); ctx.fillRect(W - WALL, y, WALL, 4); }
    for (let x = 120; x < W; x += 180) ctx.fillRect(x, 0, 4, TOP);
    for (let k = 0, x = 30; x < W - 20; k++, x += 30) {
      const a = 0.15 + 0.7 * Math.pow(0.5 + 0.5 * Math.sin(t * 4 - k * 0.45), 6);
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
      ctx.beginPath(); ctx.arc(x, TOP / 2, 1.8, 0, TAU); ctx.fill();
    }
    for (let k = 0, y = 40; y < H - 20; k++, y += 34) {
      const a = 0.12 + 0.6 * Math.pow(0.5 + 0.5 * Math.sin(t * 4 + k * 0.5), 6);
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
      ctx.beginPath(); ctx.arc(WALL / 2, y, 1.6, 0, TAU); ctx.arc(W - WALL / 2, y, 1.6, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(WALL, TOP, W - WALL * 2, 1);
  }

  const introK = br => clamp((state.introT - br.delay) / 0.4, 0, 1);
  function drawPlate(x, y, w, h) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#7a7a7a'); g.addColorStop(0.5, '#3a3a3a'); g.addColorStop(1, '#222');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(x, y, w, 1);
    ctx.fillStyle = '#9a9a9a'; ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 1.6, 0, TAU); ctx.fill();
  }
  function drawLock(br) {
    // a thin steel hatch with a narrow slit; the gap edges are lit so the way in reads clearly
    const [L, R] = br.parts, t = state.realT;
    drawPlate(L.x, L.y, L.w, L.h);
    drawPlate(R.x, R.y, R.w, R.h);
    if (br.laserHits) {
      ctx.strokeStyle = 'rgba(230,230,230,.7)'; ctx.lineWidth = 1.2;
      for (const p of br.parts) for (let k = 0; k < br.laserHits; k++) {
        ctx.beginPath(); ctx.moveTo(p.x + p.w * (0.2 + k * 0.3), p.y); ctx.lineTo(p.x + p.w * (0.35 + k * 0.25), p.y + p.h); ctx.stroke();
      }
    }
    const a = 0.5 + 0.4 * Math.sin(t * 5 + br.c);
    ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
    ctx.fillRect(L.x + L.w - 1.5, L.y - 1, 1.5, L.h + 2);
    ctx.fillRect(R.x, R.y - 1, 1.5, R.h + 2);
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    for (const dy of [-6, -10]) poly(ctx, br.x + br.w / 2 - 4, L.y + dy, br.x + br.w / 2 + 4, L.y + dy, br.x + br.w / 2, L.y + dy + 3);
  }
  function drawBrickBody(br) {
    const s = state, t = s.realT;
    if (br.type === 'slit') { drawLock(br); return; }
    ctx.drawImage(brickSprite(br.type, br.shade), br.x, br.y, Math.ceil(CELL_W), CELL_H);
    if (br.type === 'silver') {
      // a shine sweeps across silver bricks every couple of seconds
      const ph = (t * 0.55 + br.c * 0.05 + br.r * 0.08) % 2.4;
      if (ph < 1) {
        ctx.save();
        roundRect(ctx, br.x + 1.5, br.y + 1.5, br.w - 3, br.h - 3, 3); ctx.clip();
        const sx = br.x - 20 + ph * (br.w + 40);
        const g = ctx.createLinearGradient(sx - 12, 0, sx + 12, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        poly(ctx, sx - 12, br.y + br.h, sx + 2, br.y, sx + 16, br.y, sx + 2, br.y + br.h);
        ctx.restore();
      }
    } else if (br.type === 'tnt') {
      // a fuse that sparks on the corner
      const fx = br.x + br.w - 9, fy = br.y + 3;
      ctx.strokeStyle = '#888'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(fx - 6, fy + 4); ctx.quadraticCurveTo(fx - 2, fy - 2, fx, fy); ctx.stroke();
      const f = 0.6 + 0.4 * Math.sin(t * 31 + br.c * 3);
      ctx.fillStyle = `rgba(255,255,255,${f.toFixed(2)})`;
      for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + t * 9; ctx.fillRect(fx + Math.cos(a) * 2.5 * f - 0.6, fy + Math.sin(a) * 2.5 * f - 0.6, 1.3, 1.3); }
      const gl = ctx.createRadialGradient(fx, fy, 0, fx, fy, 6);
      gl.addColorStop(0, 'rgba(255,255,255,.8)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gl; ctx.fillRect(fx - 6, fy - 6, 12, 12);
    }
    if (br.life) {
      // the stage's hidden extra life: an engraved heart that glows
      const cx = br.x + br.w / 2, cy = br.y + br.h / 2 + 1, k = 0.5 + 0.5 * Math.sin(t * 4);
      const gl = ctx.createRadialGradient(cx, cy, 0, cx, cy, 18);
      gl.addColorStop(0, `rgba(255,255,255,${(0.35 + 0.35 * k).toFixed(2)})`); gl.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gl; ctx.fillRect(cx - 18, cy - 18, 36, 36);
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.moveTo(cx, cy + 5);
      ctx.bezierCurveTo(cx - 9, cy - 1, cx - 5, cy - 8, cx, cy - 3);
      ctx.bezierCurveTo(cx + 5, cy - 8, cx + 9, cy - 1, cx, cy + 5);
      ctx.fill();
    }
    if (br.cracks.length) {
      ctx.strokeStyle = 'rgba(20,20,20,.75)'; ctx.lineWidth = 1.3;
      for (const path of br.cracks) {
        ctx.beginPath();
        path.forEach(([px, py], i) => i ? ctx.lineTo(br.x + px, br.y + py) : ctx.moveTo(br.x + px, br.y + py));
        ctx.stroke();
      }
    }
    if (br.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${(br.flash * 0.7).toFixed(2)})`;
      roundRect(ctx, br.x + 1.5, br.y + 1.5, br.w - 3, br.h - 3, 3); ctx.fill();
    }
  }

  function drawBricks() {
    const s = state, t = s.realT;
    // light leaking out of each lock marks the way into a formation
    for (const br of s.slits) {
      if (!br.alive || introK(br) < 1) continue;
      const cx = br.x + br.w / 2, y0 = br.parts[0].y + br.parts[0].h, a = 0.08 + 0.04 * Math.sin(t * 3 + br.c);
      const g = ctx.createLinearGradient(0, y0, 0, y0 + 170);
      g.addColorStop(0, `rgba(255,255,255,${a.toFixed(3)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      poly(ctx, cx - br.gap / 2, y0, cx + br.gap / 2, y0, cx + br.gap * 1.6, y0 + 170, cx - br.gap * 1.6, y0 + 170);
    }
    // soft drop shadows give the wall depth
    ctx.fillStyle = 'rgba(0,0,0,.42)';
    for (const br of s.bricks) {
      if (!br.alive || br.grow > 0 || introK(br) < 1) continue;
      if (br.type === 'slit') { for (const p of br.parts) ctx.fillRect(p.x + 4, p.y + 5, p.w, p.h); continue; }
      roundRect(ctx, br.x + 4, br.y + 6, br.w - 3, br.h - 3, 4); ctx.fill();
    }
    for (const br of s.bricks) {
      if (!br.alive) continue;
      const k = introK(br);
      let oy = 0, sc = 1, alpha = 1;
      if (k < 1) { const e = 1 - k; oy = -e * e * 80; alpha = k; }
      if (br.wob > 0) sc = 1 + Math.sin(br.wob * 18) * 0.08 * br.wob;
      if (br.grow > 0) { sc *= 1 - br.grow; alpha *= 1 - br.grow; }
      if (alpha <= 0) continue;
      if (sc !== 1 || alpha !== 1 || oy) {
        const cx = br.x + br.w / 2, cy = br.y + br.h / 2;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(cx, cy + oy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
        drawBrickBody(br);
        ctx.restore();
      } else drawBrickBody(br);
    }
    // the odd sparkle catching the light
    for (const gl of s.glints) {
      const br = gl.br;
      if (!br.alive) continue;
      const k = Math.sin(Math.PI * gl.t / 0.5), gx = br.x + br.w * 0.8, gy = br.y + 5, r = 7 * k;
      ctx.fillStyle = `rgba(255,255,255,${(0.9 * k).toFixed(2)})`;
      poly(ctx, gx, gy - r, gx + r * 0.18, gy - r * 0.18, gx + r, gy, gx + r * 0.18, gy + r * 0.18, gx, gy + r, gx - r * 0.18, gy + r * 0.18, gx - r, gy, gx - r * 0.18, gy - r * 0.18);
    }
  }

  // The ball is a light source: nearby bricks brighten as it passes
  function drawBallLight() {
    const s = state;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const b of s.balls) {
      const r = s.fireT > 0 ? 150 : 110;
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
      g.addColorStop(0, `rgba(255,255,255,${s.fireT > 0 ? 0.2 : 0.11})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(b.x - r, b.y - r, r * 2, r * 2);
    }
    ctx.restore();
  }

  function drawBoss() {
    const s = state, k = s.boss;
    if (!k || k.dead) return;
    const x0 = k.x - k.w / 2, y0 = k.y - k.h / 2;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    roundRect(ctx, x0 + 6, y0 + 10, k.w, k.h, 14); ctx.fill();
    const g = ctx.createLinearGradient(0, y0, 0, y0 + k.h);
    g.addColorStop(0, '#7a7a7a'); g.addColorStop(0.5, '#3a3a3a'); g.addColorStop(1, '#1c1c1c');
    ctx.fillStyle = g; roundRect(ctx, x0, y0, k.w, k.h, 14); ctx.fill();
    ctx.strokeStyle = '#a8a8a8'; ctx.lineWidth = 1.5; ctx.stroke();
    // armour plates and rivets
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    for (let i = 0; i < 3; i++) ctx.fillRect(x0 + 10, y0 + 10 + i * 20, k.w - 20, 12);
    ctx.fillStyle = '#9a9a9a';
    for (const [rx, ry] of [[x0 + 12, y0 + 12], [x0 + k.w - 12, y0 + 12], [x0 + 12, y0 + k.h - 12], [x0 + k.w - 12, y0 + k.h - 12]]) {
      ctx.beginPath(); ctx.arc(rx, ry, 3, 0, TAU); ctx.fill();
    }
    // cracks spread as it takes damage
    const shown = Math.floor((1 - k.hp / k.max) * k.cracks.length);
    ctx.strokeStyle = 'rgba(230,230,230,.55)'; ctx.lineWidth = 1.4;
    for (let i = 0; i < shown; i++) {
      ctx.beginPath();
      k.cracks[i].forEach(([px, py], j) => j ? ctx.lineTo(x0 + px, y0 + py) : ctx.moveTo(x0 + px, y0 + py));
      ctx.stroke();
    }
    // the eye glows before each shot and tracks the paddle
    const ex = k.x + clamp((s.paddle.x - k.x) / 40, -8, 8), ey = k.y + 4;
    if (k.charge > 0) {
      const gl = ctx.createRadialGradient(ex, ey, 4, ex, ey, 26 + k.charge * 26);
      gl.addColorStop(0, `rgba(255,255,255,${(0.6 * k.charge).toFixed(2)})`); gl.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(ex, ey, 26 + k.charge * 26, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#101010'; ctx.beginPath(); ctx.arc(k.x, ey, 21, 0, TAU); ctx.fill();
    const eg = ctx.createRadialGradient(ex - 3, ey - 3, 1, ex, ey, 15);
    eg.addColorStop(0, '#fff'); eg.addColorStop(0.5, '#cfcfcf'); eg.addColorStop(1, '#5a5a5a');
    ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(ex, ey, 14, 0, TAU); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex, ey, 5 + k.charge * 3, 0, TAU); ctx.fill();
    if (k.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${(k.flash * 0.6).toFixed(2)})`;
      roundRect(ctx, x0, y0, k.w, k.h, 14); ctx.fill();
    }
    // health bar
    const bw = 320, bx = W / 2 - bw / 2, by = TOP + 10;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; roundRect(ctx, bx - 2, by - 2, bw + 4, 12, 6); ctx.fill();
    ctx.fillStyle = '#e8e8e8'; roundRect(ctx, bx, by, bw * Math.max(0, k.hp) / k.max, 8, 4); ctx.fill();
    ctx.font = `800 11px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#bbb'; ctx.fillText('THE CORE', W / 2, by + 13);
  }

  function drawPaddle() {
    const s = state, p = s.paddle;
    if (s.phase === 'dying' || s.phase === 'over') return;
    const h = PADDLE_H * (1 - 0.2 * p.squash), y = PADDLE_Y + (PADDLE_H - h);
    const x0 = p.x - p.w / 2;
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath(); ctx.ellipse(p.x, PADDLE_Y + PADDLE_H + 6, p.w / 2, 4, 0, 0, TAU); ctx.fill();
    if (s.mod === 'laser') {
      ctx.fillStyle = '#cfcfcf';
      for (const side of [-1, 1]) {
        const cx = p.x + side * (p.w / 2 - 10);
        ctx.fillRect(cx - 3, y - 7, 6, 9);
        if (s.laserCD > LASER_CD - 0.06) { ctx.fillStyle = '#fff'; ctx.fillRect(cx - 2, y - 11, 4, 4); ctx.fillStyle = '#cfcfcf'; }
      }
    }
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#fbfbfb'); g.addColorStop(0.5, '#c4c4c4'); g.addColorStop(1, '#727272');
    ctx.fillStyle = g; roundRect(ctx, x0, y, p.w, h, h / 2); ctx.fill();
    const cap = ctx.createLinearGradient(0, y, 0, y + h);
    cap.addColorStop(0, '#7a7a7a'); cap.addColorStop(1, '#2a2a2a');
    ctx.fillStyle = cap;
    roundRect(ctx, x0, y, 16, h, h / 2); ctx.fill();
    roundRect(ctx, x0 + p.w - 16, y, 16, h, h / 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(x0 + 18, y + 3, p.w - 36, 2);
    if (s.mod === 'catch') {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.lineDashOffset = -s.realT * 30;
      ctx.beginPath(); ctx.moveTo(x0 + 14, y - 1); ctx.lineTo(x0 + p.w - 14, y - 1); ctx.stroke();
      ctx.restore();
    }
    if (s.mod === 'shrink') {
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      for (let k = 18; k < p.w - 18; k += 8) ctx.fillRect(x0 + k, y + 1, 3, h - 2);
    }
    // aiming guide while the ball waits on the paddle
    if (s.phase === 'play') for (const b of s.balls) if (b.stuck) {
      const ang = clamp(b.off / (p.w / 2), -1, 1) * MAX_BOUNCE * 0.8;
      const a = Math.abs(ang) < 0.15 ? (ang < 0 ? -0.15 : 0.15) : ang;
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(s.realT * 6);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.setLineDash([2, 7]);
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + Math.sin(a) * 170, b.y - Math.cos(a) * 170); ctx.stroke();
      ctx.restore();
    }
  }

  function drawBalls() {
    const s = state, fire = s.fireT > 0;
    for (const b of s.balls) {
      const tr = b.trail;
      for (let i = 0; i < tr.length; i += 2) {
        const k = i / tr.length;
        ctx.fillStyle = fire ? `rgba(255,255,255,${(0.08 + 0.4 * k).toFixed(2)})` : `rgba(220,220,220,${(0.03 + 0.18 * k).toFixed(2)})`;
        ctx.beginPath(); ctx.arc(tr[i], tr[i + 1], BALL_R * (0.35 + 0.6 * k), 0, TAU); ctx.fill();
      }
      if (fire) {
        const gl = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y, 22);
        gl.addColorStop(0, 'rgba(255,255,255,.7)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(b.x, b.y, 22, 0, TAU); ctx.fill();
      }
      const g = ctx.createRadialGradient(b.x - 2.5, b.y - 2.5, 1, b.x, b.y, BALL_R);
      g.addColorStop(0, '#fff'); g.addColorStop(0.55, fire ? '#f4f4f4' : '#cfcfcf'); g.addColorStop(1, fire ? '#bdbdbd' : '#6a6a6a');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, TAU); ctx.fill();
    }
  }

  function drawItems() {
    const s = state;
    for (const it of s.items) {
      const def = ITEMS[it.kind], w = 38, h = 17, x = it.x - w / 2, y = it.y - h / 2;
      ctx.fillStyle = 'rgba(0,0,0,.35)'; roundRect(ctx, x + 3, y + 5, w, h, h / 2); ctx.fill();
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      if (def.good) { g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#cfcfcf'); g.addColorStop(1, '#7c7c7c'); }
      else { g.addColorStop(0, '#5a5a5a'); g.addColorStop(1, '#1c1c1c'); }
      ctx.fillStyle = g; roundRect(ctx, x, y, w, h, h / 2); ctx.fill();
      // rolling band so the capsule looks like it is spinning as it falls
      ctx.save(); roundRect(ctx, x, y, w, h, h / 2); ctx.clip();
      ctx.fillStyle = def.good ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.18)';
      ctx.fillRect(it.x + Math.sin(it.rot) * (w / 2 - 4) - 3, y, 6, h);
      ctx.restore();
      ctx.strokeStyle = def.good ? '#f4f4f4' : '#9a9a9a'; ctx.lineWidth = 1;
      if (!def.good) ctx.setLineDash([3, 2]);
      roundRect(ctx, x, y, w, h, h / 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = def.good ? '#111' : '#eee';
      ctx.font = `900 11px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(def.g, it.x, it.y + 0.5);
    }
  }

  function drawShots() {
    const s = state;
    for (const l of s.lasers) {
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(l.x - 3, l.y - 2, 6, 16);
      ctx.fillStyle = '#fff'; ctx.fillRect(l.x - 1, l.y, 2, 12);
    }
    for (const o of s.bolts) {
      const pulse = 1 + 0.25 * Math.sin(o.t * 20);
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.beginPath(); ctx.arc(o.x - o.vx * 0.03, o.y - o.vy * 0.03, 7, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.3)';
      ctx.beginPath(); ctx.arc(o.x, o.y, 11 * pulse, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(o.x, o.y, 5, 0, TAU); ctx.fill();
    }
    if (s.barrier) {
      const blink = s.barrierT < 4 ? (Math.sin(s.realT * 18) > 0 ? 1 : 0.3) : 1;
      ctx.save();
      ctx.globalAlpha = (0.55 + 0.25 * Math.sin(s.realT * 5)) * blink;
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(WALL, H - 12, W - WALL * 2, 6);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.setLineDash([14, 6]); ctx.lineDashOffset = s.realT * 40;
      ctx.beginPath(); ctx.moveTo(WALL, H - 9); ctx.lineTo(W - WALL, H - 9); ctx.stroke();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const pt of state.particles) {
      const a = clamp(pt.life / pt.max, 0, 1);
      if (pt.k === 'ring') {
        ctx.strokeStyle = `rgba(255,255,255,${(a * 0.7).toFixed(2)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, TAU); ctx.stroke();
      } else if (pt.k === 'smoke') {
        ctx.fillStyle = `rgba(120,120,120,${(a * 0.22).toFixed(2)})`;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, TAU); ctx.fill();
      } else if (pt.k === 'spark' || pt.k === 'ember') {
        ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
        ctx.fillRect(pt.x - 1, pt.y - 1, 2.2, 2.2);
      } else {
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
        ctx.fillStyle = pt.c;
        ctx.fillRect(-pt.size / 2, -pt.size / 4, pt.size, pt.size / 2);
        ctx.restore();
      }
    }
  }

  function drawTexts() {
    for (const t of state.texts) bigText(t.text, t.x, t.y, t.size, Math.min(1, t.life * 2.5));
  }

  function drawScreenFX() {
    const s = state;
    if (s.phase === 'play' && s.bannerT < 2.4) {
      const t = s.bannerT;
      const e = 1 - Math.pow(1 - clamp(t / 0.35, 0, 1), 3);
      const out = clamp((t - 1.9) / 0.5, 0, 1);
      const a = e * (1 - out);
      ctx.fillStyle = `rgba(0,0,0,${(0.55 * a).toFixed(2)})`;
      ctx.fillRect(0, 330, W, 110);
      ctx.fillStyle = `rgba(255,255,255,${(0.5 * a).toFixed(2)})`;
      ctx.fillRect(0, 330, W, 1); ctx.fillRect(0, 439, W, 1);
      const label = s.resumed ? 'GET READY' : (s.endless ? 'ENDLESS ' + (s.stageIndex - STAGE_COUNT + 1) : 'STAGE ' + (s.stageIndex + 1));
      const sub = s.resumed ? `${s.lives} ${s.lives === 1 ? 'LIFE' : 'LIVES'} LEFT`
        : (s.stage.boss ? '⚠ FINAL BOSS · ' : '') + s.stage.name.toUpperCase();
      bigText(label, W / 2 - (1 - e) * 400, 372, 46, a);
      ctx.save();
      ctx.globalAlpha = a; ctx.fillStyle = '#aaa'; ctx.font = `700 17px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(sub, W / 2 + (1 - e) * 400, 418);
      ctx.restore();
    }
    if (s.phase === 'play' && s.balls.some(b => b.stuck && !b.caught) && s.bannerT > 0.8) {
      ctx.save();
      ctx.globalAlpha = 0.45 + 0.35 * Math.sin(s.realT * 4);
      ctx.fillStyle = '#ddd'; ctx.font = `700 13px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(input.mode === 'kbd' ? 'SPACE TO LAUNCH' : 'CLICK TO LAUNCH', W / 2, 500);
      ctx.restore();
    }
    if (s.comboShow > 0 && comboMult() > 1) {
      const k = clamp(s.comboShow / 1.2, 0, 1);
      bigText('COMBO ×' + comboMult(), W / 2, 470, 26, Math.min(1, k * 2) * 0.9, 1 + (k > 0.85 ? (k - 0.85) * 2 : 0));
    }
    if (s.phase === 'clearing') {
      const e = clamp(s.clearT / 0.3, 0, 1);
      bigText(s.boss ? 'CORE DESTROYED' : 'STAGE CLEAR', W / 2, 330, 58, e, 0.7 + e * 0.3);
      if (s.clearT > 0.4 && s.bonus.flawless) bigText('FLAWLESS!', W / 2, 390, 24, clamp((s.clearT - 0.4) * 4, 0, 1));
    }
    if (s.phase === 'dying' || s.phase === 'over') {
      const d = s.phase === 'over' ? 1 : clamp(s.deathT / 1.4, 0, 1);
      ctx.fillStyle = `rgba(0,0,0,${(0.45 * d).toFixed(2)})`;
      ctx.fillRect(0, 0, W, H);
      if (s.phase === 'dying') bigText(s.deathReason === 'bolt' ? 'BLASTED!' : 'MISS!', W / 2, 330, 64,
        clamp(s.deathT * 3, 0, 1) * (1 - clamp((s.deathT - 1.1) * 3, 0, 1)));
    }
    if (s.fireT > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.9);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(255,255,255,${(0.06 + 0.03 * Math.sin(s.realT * 12)).toFixed(3)})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (s.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${Math.min(0.8, s.flash).toFixed(2)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function render() {
    ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (state.shake > 0.3) ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    drawArena();
    drawBricks();
    drawBoss();
    drawBallLight();
    drawShots();
    drawItems();
    drawPaddle();
    if (state.phase !== 'dying') drawBalls();
    drawParticles();
    drawTexts();
    ctx.restore();
    drawScreenFX();
    ctx.drawImage(fxLayer, 0, 0, W, H);
  }

  // ---------- HUD ----------
  const hud = {
    score: $('score'), scorePill: $('scorePill'), stage: $('stage'), lives: $('lives'),
    power: $('power'), input: $('inputChip'), mute: $('muteBtn'), pause: $('pauseBtn')
  };
  function setText(el, v) {
    if (el._v === v) return false;
    el._v = v; el.textContent = v;
    return true;
  }
  function updateHUD() {
    const s = state;
    if (setText(hud.score, s.score.toLocaleString()) && s.score > 0) {
      hud.scorePill.classList.remove('bump'); void hud.scorePill.offsetWidth; hud.scorePill.classList.add('bump');
    }
    setText(hud.stage, s.phase === 'menu' ? '–' : s.endless ? '∞ ' + (s.stageIndex - STAGE_COUNT + 1) : (s.stageIndex + 1) + '/' + STAGE_COUNT);
    setText(hud.lives, s.lives > 5 ? '♥×' + s.lives : '♥'.repeat(Math.max(0, s.lives)) || '–');
    const parts = [];
    if (s.phase !== 'menu') {
      if (s.mod) parts.push(ITEMS[s.mod].name + ' ' + Math.ceil(s.modT) + 's');
      if (s.slowT > 0) parts.push('Slow ' + Math.ceil(s.slowT) + 's');
      if (s.fireT > 0) parts.push('Fire ' + Math.ceil(s.fireT) + 's');
      if (s.barrier) parts.push('Barrier');
      if (s.balls.length > 1) parts.push('Balls ×' + s.balls.length);
      if (s.phase === 'play') parts.push('Next perk ' + Math.max(0, Math.ceil(s.perkT)) + 's');
    }
    setText(hud.power, parts.join(' · ') || '–');
    setText(hud.input, input.mode === 'kbd' ? '⌨ Keys' : input.mode === 'touch' ? '◉ Touch' : '◉ Mouse');
    setText(hud.mute, sfx.muted ? '♪ Off' : '♪ On');
    setText(hud.pause, s.paused ? 'Resume' : 'Pause');
  }

  // ---------- Overlays ----------
  const overlay = $('overlay'), modal = $('modal'), fx = $('fx');
  const letters = (text, cls) =>
    `<h2 class="letters ${cls}">${[...text].map((c, i) => c === ' ' ? '<span class="sp"> </span>' : `<span style="--i:${i}">${c}</span>`).join('')}</h2>`;
  const stat = (label, value, i, extra = '') => `<div class="stat ${extra}" style="--i:${i}"><span>${label}</span><b ${value.attrs || ''}>${value.text}</b></div>`;
  const counted = (to, from = 0) => ({ text: from.toLocaleString(), attrs: `data-to="${to}" data-from="${from}"` });
  const chipHTML = k => `<span class="chip ${ITEMS[k].good ? '' : 'bad'}"><b class="glyph">${ITEMS[k].g}</b>${ITEMS[k].name}</span>`;

  function showOverlay(type) {
    const s = state;
    let html = '';
    fx.innerHTML = '';
    if (type === 'menu') {
      html = `
        <div class="logo-bricks">${[...'BRICK'].map((c, i) => `<span class="tile" style="--i:${i}">${c}</span>`).join('')}</div>
        <div class="logo-balls">${[...'BALL'].map((c, i) => `<span style="--i:${i}">${c}</span>`).join('')}</div>
        <p class="meta">Ten stages and a final boss. Every stage hides a sealed steel formation with one narrow lock:
          thread the ball through the slit and it rattles around inside, smashing bricks. Wreck most of it and the lock blows open.
          Steel shrugs off the ball: only a Fireball or 3 laser shots break it.
          Each stage also hides one glowing ♥ brick with an extra life.</p>
        <div class="ctrl-grid">
          <div class="ctrl"><h4>⌨ Keyboard</h4>
            <code class="k">←</code><code class="k">→</code> or <code class="k">A</code><code class="k">D</code> move (hold to speed up)<br>
            <code class="k">Space</code> launch · fire laser<br>
            <code class="k">P</code> pause · <code class="k">M</code> mute</div>
          <div class="ctrl"><h4>◉ Mouse / Touch</h4>
            Move to steer the paddle<br>
            Click or tap to launch · hold to fire laser<br>
            Right-click pauses</div>
        </div>
        <div class="powers">${Object.keys(ITEMS).map(chipHTML).join('')}</div>
        <div class="btns"><button class="btn big" data-act="start">▶ Start Game</button></div>
        <div class="hint">Best score ${s.best.toLocaleString()} · press Enter · stage layouts change every run</div>`;
    } else if (type === 'pause') {
      html = `
        ${letters('PAUSED', 'popin')}
        <p class="meta">Stage ${s.stageIndex + 1} · ${s.stage.name} · Score ${s.score.toLocaleString()}</p>
        <div class="btns">
          <button class="btn big" data-act="resume">▶ Resume</button>
          <button class="btn" data-act="mute">${sfx.muted ? '♪ Sound On' : '♪ Sound Off'}</button>
          <button class="btn" data-act="quit">Quit to Title</button>
        </div>
        <div class="hint">press P, Esc or Enter to resume</div>`;
    } else if (type === 'clear') {
      const next = s.stageIndex + 1;
      const nextDef = next < STAGE_COUNT ? s.run[next] : null;
      const b = s.bonus;
      html = `
        <div class="kicker">${s.endless ? 'Endless ' + (s.stageIndex - STAGE_COUNT + 1) : 'Stage ' + (s.stageIndex + 1)} · ${s.stage.name}</div>
        <div class="wall">${Array.from({ length: 13 }, (_, i) => `<i class="mb" style="--i:${i}"></i>`).join('')}<span class="sweep"></span></div>
        <div class="shine">${letters('STAGE CLEAR', 'popin')}</div>
        <div class="stats">
          ${stat('Bricks broken', counted(s.broken), 0)}
          ${stat('Best combo', { text: '×' + s.bestCombo }, 1)}
          ${stat('Clear bonus', counted(b.clear), 2)}
          ${stat('Speed bonus', counted(b.speed), 3)}
          ${stat('Flawless bonus', b.flawless ? counted(b.flawless) : { text: '—' }, 4)}
          ${stat('Lives', { text: '♥'.repeat(Math.min(s.lives, 7)) }, 5)}
          ${stat('Total score', counted(s.score, s.stageStartScore), 6, 'wide')}
        </div>
        <div class="btns"><button class="btn big" data-act="next">Next Stage ▸</button></div>
        <div class="hint">Up next: ${nextDef ? (nextDef.boss ? '⚠ FINAL BOSS · ' : '') + nextDef.name : 'another endless stage'} · press Enter</div>`;
    } else if (type === 'over') {
      const word = 'GAME OVER';
      html = `
        <div class="over-wrap">
          <div class="ltiles">${[...word].map((c, i) => c === ' ' ? '<span class="sp"></span>'
            : `<span style="--i:${i};--r:${(i % 2 ? 1 : -1) * (3 + (i * 7) % 6)}">${c}</span>`).join('')}</div>
          <svg class="crack" viewBox="0 0 300 36" preserveAspectRatio="none"><path d="M0 20 L38 16 L60 26 L92 10 L118 22 L150 14 L170 28 L204 12 L230 22 L262 16 L300 24"/></svg>
          <div class="debris">${Array.from({ length: 16 }, (_, i) =>
            `<i style="--x:${(4 + i * 6).toFixed(0)}%;--s:${4 + (i * 5) % 7}px;--d:${(1.15 + (i % 5) * 0.08).toFixed(2)}s;--rot:${(i % 2 ? 1 : -1) * (90 + i * 25)}deg"></i>`).join('')}</div>
        </div>
        <p class="meta">${s.deathReason === 'bolt' ? 'The Core blasted your paddle.' : 'The last ball slipped past.'}
          Stage ${s.stageIndex + 1} · ${s.stage.name}</p>
        ${s.newBest ? '<div class="badge">NEW BEST</div>' : ''}
        <div class="stats">
          ${stat('Final score', counted(s.score), 0, 'wide')}
          ${stat('Stage reached', { text: s.endless ? 'Endless ' + (s.stageIndex - STAGE_COUNT + 1) : String(s.stageIndex + 1) + ' / ' + STAGE_COUNT }, 1)}
          ${stat('Bricks broken', counted(s.totalBroken), 2)}
          ${stat('Best combo', { text: '×' + s.bestCombo }, 3)}
          ${stat('Best score', { text: s.best.toLocaleString() }, 4)}
        </div>
        <div class="btns">
          <button class="btn big" data-act="continue">▶ Continue · ${'♥'.repeat(CONTINUE_LIVES)}</button>
          <button class="btn" data-act="retry">↻ New Game</button>
          <button class="btn" data-act="menu">All Games</button>
        </div>
        <div class="hint">Continue picks up on this stage with ${CONTINUE_LIVES} lives and your score · press Enter</div>`;
    } else if (type === 'win') {
      const tiles = [];
      for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) {
        const x = (c - 1) * 42, y = (r - 0.5) * 22, a = Math.atan2(y || 1, x || (c - 1) || 0.5);
        tiles.push(`<i style="--x:${x}px;--y:${y}px;--dx:${(Math.cos(a) * 190 + x).toFixed(0)}px;--dy:${(Math.sin(a) * 120 + y).toFixed(0)}px;--r:${(c - 1) * 160 + (r ? 90 : -90)}deg"></i>`);
      }
      html = `
        <div class="burst"><div class="rays"></div><div class="hero-ball"></div><div class="bwall">${tiles.join('')}</div></div>
        <div class="shine">${letters('VICTORY', 'popin')}</div>
        <p class="meta">The Core is rubble. All ${STAGE_COUNT} stages cleared.</p>
        ${s.newBest ? '<div class="badge">NEW BEST</div>' : ''}
        <div class="stats">
          ${stat('Final score', counted(s.score), 0, 'wide')}
          ${stat('Bricks broken', counted(s.totalBroken), 1)}
          ${stat('Best combo', { text: '×' + s.bestCombo }, 2)}
          ${stat('Lives left', { text: '♥'.repeat(Math.min(s.lives, 7)) || '–' }, 3)}
          ${stat('Best score', { text: s.best.toLocaleString() }, 4)}
        </div>
        <div class="btns">
          <button class="btn big" data-act="endless">∞ Endless Mode</button>
          <button class="btn" data-act="again">Play Again</button>
        </div>
        <div class="hint">Endless keeps your score and lives, and the ball only gets faster</div>`;
      victoryFX();
    }
    modal.className = 'modal ' + type;
    modal.innerHTML = html;
    modal.style.animation = 'none';
    void modal.offsetWidth;
    modal.style.animation = '';
    overlay.classList.add('show');
    modal.querySelectorAll('[data-to]').forEach((el, i) => countUp(el, +el.dataset.from, +el.dataset.to, 900, 450 + i * 120));
  }

  function hideOverlay() {
    overlay.classList.remove('show');
    fx.innerHTML = '';
  }

  function countUp(el, from, to, dur, delay) {
    const t0 = performance.now() + delay;
    const tick = now => {
      const k = clamp((now - t0) / dur, 0, 1);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * e).toLocaleString();
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  function victoryFX() {
    fx.innerHTML = '<div class="flash"></div>';
    for (let i = 0; i < 28; i++) {
      const d = document.createElement('div');
      d.className = 'shard';
      const a = Math.random() * Math.PI * 2, dist = 300 + Math.random() * 500;
      d.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(0) + 'px');
      d.style.setProperty('--dy', (Math.sin(a) * dist).toFixed(0) + 'px');
      d.style.setProperty('--r', (Math.random() * 720 - 360).toFixed(0) + 'deg');
      d.style.setProperty('--s', (24 + Math.random() * 50).toFixed(0) + 'px');
      d.style.animationDelay = (Math.random() * 0.15).toFixed(2) + 's';
      fx.appendChild(d);
    }
    confetti(140);
    state.flash = 0.8;
  }

  // ---------- Actions ----------
  function nextStage() {
    hideOverlay();
    if (state.stageIndex + 1 >= STAGE_COUNT) state.endless = true;
    loadStage(state.stageIndex + 1);
  }
  function continueGame() {
    Object.assign(state, { lives: CONTINUE_LIVES, newBest: false });
    hideOverlay();
    respawn();
  }
  function startEndless() { state.endless = true; state.newBest = false; hideOverlay(); loadStage(STAGE_COUNT); }
  function toggleMute() { sfx.toggle(); if (state.paused) showOverlay('pause'); }
  function togglePause(force) {
    if (!['play', 'clearing', 'dying'].includes(state.phase)) return;
    const next = force === undefined ? !state.paused : force;
    if (next === state.paused) return;
    state.paused = next;
    input.left = input.right = input.fireHeld = false;
    if (next) showOverlay('pause'); else hideOverlay();
  }
  function act(a) {
    switch (a) {
      case 'start': case 'retry': case 'again': newGame(); break;
      case 'next': nextStage(); break;
      case 'continue': continueGame(); break;
      case 'endless': startEndless(); break;
      case 'resume': togglePause(false); break;
      case 'mute': toggleMute(); break;
      case 'quit': toMenu(); break;
      case 'menu': location.href = 'index.html'; break;
    }
  }
  function handleEnter() {
    if (state.paused) return act('resume');
    const map = { menu: 'start', clear: 'next', over: 'continue', win: 'again' };
    if (map[state.phase]) act(map[state.phase]);
  }
  function pressFire() {
    if (state.phase === 'play' && !state.paused) state.fireBuffer = 0.15;
  }

  // ---------- Input ----------
  const MOVE_KEYS = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  window.addEventListener('keydown', e => {
    sfx.ensure();
    const k = MOVE_KEYS[e.code];
    if (k) { e.preventDefault(); input[k] = true; input.mode = 'kbd'; return; }
    switch (e.code) {
      case 'Space':
        e.preventDefault();
        input.fireHeld = true;
        if (!e.repeat) pressFire();
        break;
      case 'KeyP': case 'Escape': e.preventDefault(); togglePause(); break;
      case 'Enter': case 'NumpadEnter': e.preventDefault(); handleEnter(); break;
      case 'KeyM': toggleMute(); break;
    }
    if (DEBUG && state.phase === 'play') {
      if (e.code === 'KeyN') { state.endless = state.stageIndex + 1 >= STAGE_COUNT; loadStage(state.stageIndex + 1); }
      if (e.code === 'KeyK') { for (const br of state.bricks) if (br.alive && !solid(br)) breakBrick(br, 'blast'); }
      if (e.code === 'KeyG') { const ks = Object.keys(ITEMS); state.dbgItem = ((state.dbgItem || 0) + 1) % ks.length; state.items.push({ x: state.paddle.x, y: 300, kind: ks[state.dbgItem], rot: 0 }); }
      if (e.code === 'KeyB') loadStage(STAGE_COUNT - 1);
    }
  });
  window.addEventListener('keyup', e => {
    const k = MOVE_KEYS[e.code];
    if (k) input[k] = false;
    if (e.code === 'Space') input.fireHeld = false;
  });

  function pointerPos(clientX) {
    const r = canvas.getBoundingClientRect();
    input.mouseX = (clientX - r.left) * W / r.width;
  }
  // Steering follows the mouse anywhere over the page, so leaving the canvas edge keeps control
  window.addEventListener('mousemove', e => {
    if (overlay.classList.contains('show')) return;
    pointerPos(e.clientX);
    if (e.movementX || e.movementY) input.mode = 'mouse';
  });
  canvas.addEventListener('mousedown', e => {
    sfx.ensure();
    pointerPos(e.clientX);
    if (e.button === 2) { togglePause(); return; }
    if (e.button !== 0) return;
    input.mode = 'mouse';
    input.fireHeld = true;
    pressFire();
  });
  window.addEventListener('mouseup', () => { input.fireHeld = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    sfx.ensure();
    pointerPos(e.changedTouches[0].clientX);
    input.mode = 'touch';
    input.fireHeld = true;
    pressFire();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    pointerPos(e.changedTouches[0].clientX);
  }, { passive: false });
  canvas.addEventListener('touchend', () => { input.fireHeld = false; });

  overlay.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    sfx.ensure();
    act(b.dataset.act);
  });
  hud.pause.addEventListener('click', () => { hud.pause.blur(); togglePause(); });
  hud.mute.addEventListener('click', () => { hud.mute.blur(); sfx.ensure(); toggleMute(); });
  window.addEventListener('blur', () => {
    input.left = input.right = input.fireHeld = false;
    if (state.phase === 'play') togglePause(true);
  });
  window.addEventListener('resize', resize);

  // ---------- Loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (!state.paused) {
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
    }
    render();
    updateHUD();
    requestAnimationFrame(frame);
  }

  if (DEBUG) window.__bb = { state, input, step, loadStage, newGame, applyItem, breakBrick, MAPS, BOSS_MAP, brickAt, COLS, getStage,
    showOverlay, startClearing, startDying, splitBalls };

  resize();
  toMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
