<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Grayscale Pang</title>
<style>
  :root{
    --bg:#111;
    --ink:#eee;
    --muted:#bbb;
    --dim:#777;
    --dimmer:#444;
    --panel:#1a1a1a;
    --accent:#ccc;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial}
  body{overflow-x:hidden}
  .wrap{max-width:1000px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .title{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px}
  .title a{color:var(--muted);text-decoration:none;font-size:22px;line-height:1;padding:0 4px}
  .title a:hover{color:#fff}
  .logo-dot{width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#cfcfcf 35%,#6e6e6e 80%,#2c2c2c);
    box-shadow:0 0 10px rgba(255,255,255,.25);animation:dotbounce 1s infinite cubic-bezier(.5,0,.5,1) alternate}
  @keyframes dotbounce{from{transform:translateY(2px)}to{transform:translateY(-4px)}}
  .hud{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
  .pill{
    background:var(--panel);border:1px solid var(--dimmer);
    padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:4px;
    box-shadow:var(--shadow);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap
  }
  .pill b{color:#fff}
  .pill.bump{animation:bump .25s ease-out}
  @keyframes bump{50%{transform:scale(1.12);border-color:#aaa}}
  .pill.warn{animation:warn .5s infinite alternate}
  @keyframes warn{to{background:#3a3a3a;border-color:#ddd;color:#fff}}
  .pill.input{color:var(--muted);font-size:12px}
  .btn{
    border:1px solid var(--dimmer);background:linear-gradient(#1e1e1e,#161616);
    color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .1s ease,background .2s ease,border-color .2s ease;font-size:14px
  }
  .btn:hover{border-color:#888;background:linear-gradient(#262626,#1a1a1a)}
  .btn:active{transform:scale(.97)}
  .btn.big{padding:12px 26px;font-size:16px;background:linear-gradient(#f4f4f4,#bdbdbd);color:#111;border-color:#ddd}
  .btn.big:hover{background:linear-gradient(#fff,#d0d0d0)}
  .frame{
    background:radial-gradient(1200px 600px at 50% -100px,#202020 20%,#111 60%,#0d0d0d 100%);
    border:1px solid #2b2b2b;border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)
  }
  canvas{display:block;margin:0 auto;border-radius:12px;background:#121212;cursor:crosshair;touch-action:none}
  footer{color:var(--dim);font-size:12px;text-align:center;line-height:2}
  code.k{background:#1a1a1a;border:1px solid #2a2a2a;padding:2px 6px;border-radius:6px;color:var(--ink);font-size:12px}

  /* ---------- Overlay & popups ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;
    display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:16px
  }
  .overlay.show{display:flex}
  .modal{
    position:relative;width:min(92vw,600px);max-height:94vh;overflow:auto;
    background:linear-gradient(#171717,#0e0e0e);
    border:1px solid #2e2e2e;border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    text-align:center;animation:pop .45s cubic-bezier(.2,.9,.2,1) both
  }
  .modal::after{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);
    background-size:250% 100%;animation:sheen 3.5s ease-in-out infinite
  }
  @keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
  @keyframes pop{
    0%{transform:scale(.8) translateY(30px);opacity:0}
    70%{transform:scale(1.03);opacity:1}
    100%{transform:scale(1)}
  }
  .modal h2{margin:4px 0 8px;font-size:40px;font-weight:900;letter-spacing:4px;line-height:1.1}
  .modal .kicker{color:var(--dim);font-size:12px;letter-spacing:3px;text-transform:uppercase}
  .meta{color:var(--muted);font-size:14px;margin:6px 0 14px;line-height:1.5}
  .hint{color:var(--dim);font-size:12px;margin-top:10px}
  .letters span{display:inline-block}
  .letters .sp{width:.4em}
  .letters.drop span{animation:drop .8s cubic-bezier(.25,1.45,.5,1) both;animation-delay:calc(var(--i) * 70ms)}
  @keyframes drop{
    0%{transform:translateY(-160px) rotate(-25deg);opacity:0}
    55%{transform:translateY(12px) rotate(6deg);opacity:1}
    75%{transform:translateY(-6px) rotate(-2deg)}
    100%{transform:none}
  }
  .letters.popin span{animation:popin .55s cubic-bezier(.2,1.7,.4,1) both;animation-delay:calc(var(--i) * 55ms)}
  @keyframes popin{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
  .shine h2{color:#fff;animation:glow 1.8s ease-in-out infinite alternate}
  @keyframes glow{from{text-shadow:0 0 6px rgba(255,255,255,.2)}to{text-shadow:0 0 22px rgba(255,255,255,.75)}}
  .modal.over{animation:pop .45s cubic-bezier(.2,.9,.2,1) both, shake .5s .8s both}
  @keyframes shake{
    15%{translate:-10px 4px}30%{translate:9px -3px}45%{translate:-6px 2px}60%{translate:4px -1px}80%{translate:-2px 0}100%{translate:0 0}
  }
  .crack-wrap{position:relative;display:inline-block}
  .crack{position:absolute;left:-4%;top:38%;width:108%;height:40px;overflow:visible;pointer-events:none}
  .crack path{fill:none;stroke:#e8e8e8;stroke-width:2.5;stroke-linejoin:bevel;stroke-dasharray:420;stroke-dashoffset:420;
    filter:drop-shadow(0 0 4px rgba(255,255,255,.6));animation:draw .35s .78s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 16px}
  .stat{background:#121212;border:1px solid #262626;border-radius:14px;padding:10px;opacity:0;animation:rise .4s ease-out forwards;animation-delay:calc(.35s + var(--i) * 90ms)}
  .stat.wide{grid-column:1 / -1}
  .stat span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1.5px}
  .stat b{display:block;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat.wide b{font-size:32px}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .badge{display:inline-block;margin:0 0 12px;padding:4px 12px;border-radius:999px;font-weight:900;font-size:12px;letter-spacing:2px;
    background:linear-gradient(90deg,#6a6a6a,#fff,#6a6a6a);background-size:200% 100%;color:#111;animation:shimmer 1.2s linear infinite}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-100% 0}}

  /* Start screen */
  .logo{display:flex;justify-content:center;gap:10px;margin:18px 0 6px;height:110px;align-items:flex-end}
  .logo span{
    width:68px;height:68px;border-radius:50%;display:grid;place-items:center;
    font-weight:900;font-size:34px;color:#151515;
    background:radial-gradient(circle at 35% 30%,#fff,#cfcfcf 35%,#6e6e6e 80%,#2c2c2c);
    box-shadow:0 0 22px rgba(255,255,255,.15);
    animation:bounce 1.1s infinite;animation-delay:calc(var(--i) * 140ms)
  }
  @keyframes bounce{
    0%{transform:translateY(0) scale(1.15,.85);animation-timing-function:ease-out}
    12%{transform:translateY(-8px) scale(.95,1.05);animation-timing-function:ease-out}
    50%{transform:translateY(-40px) scale(1);animation-timing-function:ease-in}
    100%{transform:translateY(0) scale(1.15,.85)}
  }
  .ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin:10px 0}
  .ctrl{background:#121212;border:1px solid #262626;border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:2}
  .ctrl h4{margin:0 0 2px;color:var(--ink);font-size:14px}
  .powers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 16px}
  .chip{display:flex;align-items:center;gap:6px;border:1px solid var(--dimmer);background:var(--panel);
    border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
  .chip .glyph{width:20px;height:20px;border-radius:6px;border:1.5px solid #ddd;display:grid;place-items:center;
    font-size:11px;color:#fff;background:#0f0f0f;font-weight:800}

  /* Victory */
  .crown-wrap{position:relative;height:110px;display:grid;place-items:center;margin-top:4px}
  .rays{position:absolute;left:50%;top:50%;width:300px;height:300px;translate:-50% -50%;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,255,255,.13) 0 9deg,transparent 9deg 18deg);
    -webkit-mask:radial-gradient(circle,#000 15%,transparent 65%);mask:radial-gradient(circle,#000 15%,transparent 65%);
    animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .crown{position:relative;font-size:76px;line-height:1;color:#fff;text-shadow:0 0 24px rgba(255,255,255,.8);
    animation:crownIn 1s .25s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes crownIn{0%{transform:translateY(-120px) scale(.3) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
  .flash{position:absolute;inset:0;background:#fff;animation:flash 1.1s ease-out forwards}
  @keyframes flash{from{opacity:1}to{opacity:0}}
  .shard{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);
    background:linear-gradient(135deg,#fff,#8a8a8a);opacity:0;
    animation:fly 1.6s cubic-bezier(.1,.7,.3,1) forwards}
  @keyframes fly{
    0%{transform:translate(-50%,-50%) rotate(0);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r));opacity:0}
  }
  @media (max-width:560px){
    .ctrl-grid{grid-template-columns:1fr}
    .logo span{width:50px;height:50px;font-size:26px}
    .modal h2{font-size:30px;letter-spacing:2px}
    .modal{padding:18px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <a href="index.html" title="Back to games" aria-label="Back to games">‹</a>
        <span class="logo-dot"></span>
        <div>Grayscale Pang</div>
      </div>
      <div class="hud">
        <div class="pill" id="scorePill">Score&nbsp;<b id="score">0</b></div>
        <div class="pill">Stage&nbsp;<b id="stage">1</b></div>
        <div class="pill">Lives&nbsp;<b id="lives">♥♥♥</b></div>
        <div class="pill" id="timePill">Time&nbsp;<b id="time">--</b></div>
        <div class="pill" title="Active powers">✦&nbsp;<b id="power">Wire</b></div>
        <div class="pill input" id="inputChip" title="Last used input">⌨ Keys</div>
        <button class="btn" id="muteBtn">♪ On</button>
        <button class="btn" id="pauseBtn">Pause</button>
      </div>
    </header>
    <div class="frame">
      <canvas id="game" aria-label="Pang game"></canvas>
    </div>
    <footer>
      Move <code class="k">←</code><code class="k">→</code> / <code class="k">A</code><code class="k">D</code>
      &nbsp;•&nbsp; Fire <code class="k">Space</code>
      &nbsp;•&nbsp; Ladders <code class="k">↑</code><code class="k">↓</code>
      &nbsp;•&nbsp; Pause <code class="k">P</code>
      &nbsp;•&nbsp; Mouse: point to run, click to fire
    </footer>
  </div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="modal" id="modal"></div>
  </div>
  <div id="fx"></div>

<script>
(() => {
  'use strict';

  // ---------- Tuning ----------
  const W = 960, H = 600, WALL = 14, TOP = 14, FLOOR = 556;
  const GRAVITY = 900, BALL_SPEED = 118, BOSS_SPEED = 92, PLAYER_SPEED = 270, CLIMB_SPEED = 200;
  const HARPOON_SPEED = 760, BULLET_SPEED = 980, STEP = 1 / 120;
  const SIZE_R = [11, 19, 30, 44, 64];
  const BOUNCE_H = [115, 185, 255, 325, 360];
  const SIZE_SCORE = [200, 150, 100, 50, 500];
  const HEX_SPEED = [175, 155, 140, 125, 110];
  const COMBO_WINDOW = 1.2, EXTRA_LIFE_EVERY = 20000, DROP_CHANCE = 0.15;
  const CONTINUE_LIVES = 3, BONUS_LIFE_WINDOW = 3;
  const INTRO_BANNER = 0.6, INTRO_COUNT = 0.45, INTRO_LEN = INTRO_BANNER + INTRO_COUNT * 3;
  const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const DEBUG = /[?&]debug=1\b/.test(location.search);

  const bounceV = s => Math.sqrt(2 * GRAVITY * BOUNCE_H[s]);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const $ = id => document.getElementById(id);

  // ---------- Stages ----------
  const B = (s, x, dir, type = 'n', y = 150) => ({ s, x, dir, type, y });
  const P = (x, y, w, h, kind) => ({ x, y, w, h, kind });
  const L = (x, top) => ({ x, top, bottom: FLOOR });
  const glassRow = (x0, y, n, step, w = step - 2) => Array.from({ length: n }, (_, i) => P(x0 + i * step, y, w, 22, 'glass'));

  const STAGES = [
    { name: 'First Pop', time: 60, balls: [B(2, 200, 1)], plats: [] },
    { name: 'Heavyweight', time: 70, balls: [B(3, 220, 1)], plats: [] },
    { name: 'Crossfire', time: 80, balls: [B(2, 160, 1), B(2, 800, -1), B(1, 380, -1, 'n', 90)], plats: [] },
    { name: 'Steel Ceiling', time: 90, balls: [B(3, 150, 1, 'n', 120), B(1, 820, -1)],
      plats: [P(220, 250, 170, 22, 'steel'), P(570, 250, 170, 22, 'steel')] },
    { name: 'Glass Hall', time: 95, balls: [B(3, 130, 1, 'n', 300), B(2, 840, -1, 'n', 320)],
      plats: glassRow(240, 230, 6, 80) },
    { name: 'The Ladder', time: 100, px: 660, balls: [B(3, 250, -1, 'n', 110), B(2, 700, 1, 'n', 110)],
      plats: [P(380, 340, 200, 20, 'steel'), P(90, 230, 110, 20, 'glass'), P(760, 230, 110, 20, 'glass')],
      ladders: [L(470, 340)] },
    { name: 'Pillars', time: 105, balls: [B(3, 160, 1, 'n', 140), B(2, 480, -1, 'n', 260), B(2, 800, -1, 'n', 140)],
      plats: [P(300, 190, 26, 230, 'steel'), P(634, 190, 26, 230, 'steel'), P(400, 130, 160, 18, 'glass')] },
    { name: 'Hex Storm', time: 105, balls: [B(2, 180, 1, 'hex', 160), B(2, 780, -1, 'hex', 200), B(2, 330, -1, 'n', 100)], plats: [] },
    { name: 'Thorns', time: 110, balls: [B(3, 170, 1, 'spike', 140), B(2, 790, -1, 'spike', 140)],
      plats: [P(410, 280, 140, 20, 'steel')] },
    { name: 'Shatter Grid', time: 115, balls: [B(2, 300, 1, 'hex', 240), B(3, 120, 1, 'n', 430), B(1, 840, -1, 'spike', 430)],
      plats: [...glassRow(120, 170, 10, 72, 70), ...glassRow(156, 300, 5, 144, 70)] },
    { name: 'Gauntlet', time: 125,
      balls: [B(3, 330, -1, 'n', 110), B(2, 640, 1, 'spike', 110), B(1, 150, 1, 'hex', 200), B(1, 810, -1, 'hex', 200)],
      plats: [P(60, 330, 180, 20, 'steel'), P(720, 330, 180, 20, 'steel'), P(400, 200, 160, 20, 'glass')],
      ladders: [L(150, 330), L(810, 330)] },
    { name: 'The Monolith', time: 160, boss: true, balls: [B(4, 300, 1, 'boss', 170)],
      plats: [P(100, 320, 150, 20, 'steel'), P(710, 320, 150, 20, 'steel')],
      ladders: [L(175, 320), L(785, 320)] }
  ];

  const TEMPLATES = [
    { plats: [] },
    { plats: [P(220, 250, 170, 22, 'steel'), P(570, 250, 170, 22, 'steel')] },
    { plats: glassRow(240, 230, 6, 80) },
    { plats: [P(380, 340, 200, 20, 'steel')], ladders: [L(470, 340)], px: 660 },
    { plats: [P(300, 190, 26, 230, 'steel'), P(634, 190, 26, 230, 'steel')] }
  ];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function endlessStage(i) {
    const n = i - STAGES.length + 1;
    const rnd = mulberry32(i * 7919 + 13);
    const tpl = TEMPLATES[n % TEMPLATES.length];
    const xs = [140, 820, 230, 730, 400, 560];
    const count = Math.min(6, 2 + Math.floor(n / 2));
    const balls = [];
    for (let k = 0; k < count; k++) {
      const r = rnd();
      const type = r < 0.25 + n * 0.02 ? 'hex' : r < 0.5 + n * 0.02 ? 'spike' : 'n';
      let s = rnd() < 0.35 + n * 0.05 ? 3 : 2;
      if (type === 'hex') s = Math.min(s, 2);
      const x = xs[k];
      balls.push(B(s, x, x < 480 ? -1 : 1, type, 130));
    }
    return { name: 'Endless ' + n, time: 90 + count * 15, balls, plats: tpl.plats, ladders: tpl.ladders || [], px: tpl.px };
  }
  const getStage = i => i < STAGES.length ? STAGES[i] : endlessStage(i);

  // ---------- Power-ups ----------
  const ITEMS = {
    double:   { g: '⇈', name: 'Double Wire', w: 16 },
    power:    { g: '⚓︎', name: 'Power Wire', w: 14 },
    gun:      { g: '⁞', name: 'Machine Gun', w: 13 },
    freeze:   { g: '❄︎', name: 'Freeze', w: 12 },
    slow:     { g: '◷', name: 'Slow-Mo', w: 12 },
    shield:   { g: '◯', name: 'Shield', w: 12 },
    dynamite: { g: '✷', name: 'Dynamite', w: 8 },
    time:     { g: '+15', name: '+15 Seconds', w: 10 },
    life:     { g: '♥', name: 'Extra Life', w: 3 }
  };
  function pickItem() {
    let tot = 0;
    for (const k in ITEMS) tot += ITEMS[k].w;
    let r = Math.random() * tot;
    for (const k in ITEMS) { r -= ITEMS[k].w; if (r <= 0) return k; }
    return 'double';
  }

  // ---------- Sound (WebAudio synth) ----------
  const sfx = (() => {
    let ac = null, master = null, nbuf = null, muted = false;
    try { muted = localStorage.getItem('pang.muted') === '1'; } catch (e) {}
    function ensure() {
      if (!ac) {
        try {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          master = ac.createGain(); master.gain.value = 0.6; master.connect(ac.destination);
        } catch (e) { return; }
      }
      if (ac.state === 'suspended') ac.resume();
    }
    function tone(f, d, type = 'square', v = 0.08, f2 = null, delay = 0) {
      if (muted || !ac) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + d + 0.05);
    }
    function noise(d, v = 0.15, freq = 1200, type = 'bandpass', delay = 0) {
      if (muted || !ac) return;
      if (!nbuf) {
        nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const ch = nbuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      }
      const t = ac.currentTime + delay;
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = nbuf; f.type = type; f.frequency.value = freq;
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t); s.stop(t + d + 0.05);
    }
    const arp = (notes, d, type, v, gap) => notes.forEach((f, i) => tone(f, d, type, v, null, i * gap));
    return {
      ensure,
      get muted() { return muted; },
      toggle() { muted = !muted; try { localStorage.setItem('pang.muted', muted ? '1' : '0'); } catch (e) {} return muted; },
      shoot() { tone(260, 0.16, 'sawtooth', 0.05, 1500); },
      gun() { tone(1400, 0.04, 'square', 0.025, 500); },
      pop(s) { noise(0.14 + s * 0.04, 0.22, 900 - s * 150); tone(720 - s * 120, 0.12, 'triangle', 0.12, 120); },
      thud() { tone(70, 0.18, 'sine', 0.2, 40); },

  // ---------- Canvas ----------
  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  const view = { scale: 1 };

  function resize() {
    const frame = document.querySelector('.frame');
    const availW = frame.clientWidth - 20;
    const availH = window.innerHeight - document.querySelector('header').offsetHeight
      - document.querySelector('footer').offsetHeight - 70;
    let cssW = Math.min(W, availW, Math.max(220, availH) * W / H);
    cssW = Math.max(260, Math.floor(cssW));
    const cssH = Math.round(cssW * H / W);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    view.scale = canvas.width / W;
  }

  // Scanlines + vignette, drawn once
  const fxLayer = document.createElement('canvas');
  fxLayer.width = W * 2; fxLayer.height = H * 2;
  (() => {
    const g = fxLayer.getContext('2d');
    g.scale(2, 2);
    g.fillStyle = 'rgba(0,0,0,.10)';
    for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
    const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,.6)');
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  })();

  // ---------- Backdrops: a different scene for every stage ----------
  const LW = 1040; // layer width, wider than the arena so it can parallax
  const TAU = Math.PI * 2;
  function poly(g, ...p) {
    g.beginPath();
    g.moveTo(p[0], p[1]);
    for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]);
    g.closePath();
    g.fill();
  }
  function fillRR(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
    g.closePath();
    g.fill();
  }
  function paintStars(g, rnd, n, maxY) {
    for (let i = 0; i < n; i++) {
      g.fillStyle = `rgba(255,255,255,${(0.08 + rnd() * 0.25).toFixed(2)})`;
      const sz = rnd() < 0.1 ? 1.6 : 0.9;
      g.fillRect(rnd() * LW, rnd() * maxY, sz, sz);
    }
  }
  function paintRidge(g, rnd, color, base, amp, step) {
    g.fillStyle = color;
    g.beginPath(); g.moveTo(0, FLOOR); g.lineTo(0, base - rnd() * amp);
    for (let x = 0; x < LW;) { x += step * (0.5 + rnd()); g.lineTo(x, base - rnd() * amp); }
    g.lineTo(LW, FLOOR); g.closePath(); g.fill();
  }
  function paintCity(g, rnd, shade, minH, maxH, win) {
    for (let x = 0; x < LW;) {
      const w = 40 + rnd() * 70, h = minH + rnd() * (maxH - minH);
      g.fillStyle = shade;
      g.fillRect(x, FLOOR - h, w - 4, h);
      if (rnd() < 0.3) g.fillRect(x + w / 2 - 1, FLOOR - h - 18, 2, 18);
      g.fillStyle = win;
      for (let wy = FLOOR - h + 10; wy < FLOOR - 10; wy += 14)
        for (let wx = x + 6; wx < x + w - 12; wx += 10)
          if (rnd() < 0.18) g.fillRect(wx, wy, 4, 6);
      x += w;
    }
  }
  function paintPine(g, x, base, h, color) {
    g.fillStyle = color;
    g.fillRect(x - 2, base - h * 0.16, 4, h * 0.16);
    for (let k = 0; k < 3; k++) {
      const top = base - h + k * h * 0.24, bot = base - h * 0.12 - (2 - k) * h * 0.22, hw = h * (0.13 + k * 0.07);
      poly(g, x, top, x - hw, bot, x + hw, bot);
    }
  }
  function paintBranch(g, rnd, x, y, len, ang, depth, w) {
    const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
    g.lineWidth = w;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
    if (depth <= 0) return;
    paintBranch(g, rnd, x2, y2, len * (0.62 + rnd() * 0.15), ang - 0.3 - rnd() * 0.35, depth - 1, w * 0.68);
    paintBranch(g, rnd, x2, y2, len * (0.62 + rnd() * 0.15), ang + 0.3 + rnd() * 0.35, depth - 1, w * 0.68);
  }
  function paintDeadTree(g, rnd, x, h, color) {
    g.strokeStyle = color; g.lineCap = 'round';
    paintBranch(g, rnd, x, FLOOR, h * 0.4, -Math.PI / 2 + (rnd() - 0.5) * 0.2, 5, h * 0.06);
  }
  function paintPeaks(g, rnd) {
    for (let x = -80; x < LW;) {
      const w = 160 + rnd() * 180, h = 200 + rnd() * 190, ax = x + w / 2, ay = FLOOR - h;
      g.fillStyle = '#1d1d1d'; poly(g, x, FLOOR, ax, ay, x + w, FLOOR);
      g.fillStyle = '#242424'; poly(g, ax, ay, x + w, FLOOR, ax + w * 0.08, FLOOR);
      const sh = h * 0.22, hw = w * 0.5 * 0.22;
      g.fillStyle = '#3a3a3a';
      poly(g, ax, ay, ax + hw, ay + sh, ax + hw * 0.3, ay + sh * 0.7, ax - hw * 0.2, ay + sh * 0.95, ax - hw, ay + sh);
      x += w * 0.55;
    }
  }
  function paintPyramid(g, cx, base, w, h) {
    g.fillStyle = '#181818'; poly(g, cx - w / 2, base, cx, base - h, cx, base);
    g.fillStyle = '#252525'; poly(g, cx, base - h, cx + w / 2, base, cx, base);
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1;
    for (let y = base - 12; y > base - h + 10; y -= 12) {
      const hw = w / 2 * (1 - (base - y) / h);
      g.beginPath(); g.moveTo(cx - hw, y); g.lineTo(cx + hw, y); g.stroke();
    }
  }
  function paintDunes(g, rnd, color, base, amp) {
    g.fillStyle = color;
    g.beginPath(); g.moveTo(0, FLOOR); g.lineTo(0, base);
    for (let x = 0; x < LW;) {
      const w = 160 + rnd() * 220;
      g.quadraticCurveTo(x + w / 2, base - amp - rnd() * amp, x + w, base - rnd() * amp * 0.4);
      x += w;
    }
    g.lineTo(LW, FLOOR); g.closePath(); g.fill();
  }
  function paintCactus(g, x, base, h, color) {
    g.fillStyle = color;
    fillRR(g, x - 5, base - h, 10, h, 5);
    fillRR(g, x - 18, base - h * 0.62, 7, h * 0.32, 3.5); g.fillRect(x - 18, base - h * 0.34, 16, 6);
    fillRR(g, x + 11, base - h * 0.78, 7, h * 0.3, 3.5); g.fillRect(x + 2, base - h * 0.5, 16, 6);
  }
  function paintColumn(g, rnd, x, base, h, w, c) {
    g.fillStyle = c;
    g.fillRect(x - w * 0.75, base - 10, w * 1.5, 10);
    if (rnd() < 0.4) {
      poly(g, x - w / 2, base - 10, x - w / 2, base - h + rnd() * 20, x - w * 0.1, base - h - 14,
        x + w * 0.2, base - h + 8, x + w / 2, base - h + rnd() * 30, x + w / 2, base - 10);
    } else {
      g.fillRect(x - w / 2, base - h, w, h - 10);
      g.fillRect(x - w * 0.8, base - h - 12, w * 1.6, 12);
    }
    g.fillStyle = 'rgba(0,0,0,.22)';
    for (let k = 1; k < 4; k++) g.fillRect(x - w / 2 + k * w / 4 - 1, base - h + 16, 2, h - 30);
  }
  function paintLighthouse(g, bg, x, base, h) {
    const hwAt = y => 15 + 9 * ((y - (base - h)) / h);
    g.fillStyle = '#1f1f1f';
    poly(g, x - 24, base, x - 15, base - h, x + 15, base - h, x + 24, base);
    g.fillStyle = '#2b2b2b';
    for (let k = 1; k < 4; k++) {
      const y0 = base - h + k * h / 4, y1 = y0 + h / 10;
      poly(g, x - hwAt(y0), y0, x + hwAt(y0), y0, x + hwAt(y1), y1, x - hwAt(y1), y1);
    }
    g.fillStyle = '#262626'; g.fillRect(x - 13, base - h - 22, 26, 22);
    poly(g, x - 16, base - h - 22, x, base - h - 38, x + 16, base - h - 22);
    g.fillStyle = '#5a5a5a'; g.fillRect(x - 8, base - h - 18, 16, 10);
    bg.lamp = { x, y: base - h - 13 };
  }

        g.moveTo(cx + 26, 140); g.lineTo(cx + 36, 300); g.lineTo(cx + 22, FLOOR - 60); g.stroke();

      },
      fx: { sky: ['monoGlow'], mid: ['monoEye'], front: ['embers'] }
    }
  ];

  function buildBackdrop(i) {
    const theme = THEMES[i % THEMES.length];
    const rnd = mulberry32(i * 977 + 5);
    const bg = { theme, emitters: [], lamp: null, mono: null, skyGrad: null, floorGrad: null };
    const layer = paint => {
      const c = document.createElement('canvas');
      c.width = LW * 2; c.height = H * 2;
      const g = c.getContext('2d');
      g.scale(2, 2);
      paint(g, rnd, bg);
      return c;
    };
    bg.far = layer(theme.far);
    bg.near = layer(theme.near);
    return bg;
  }

  // ---------- State ----------
  const loadBest = () => { try { return +localStorage.getItem('pang.best') || 0; } catch (e) { return 0; } };
  const saveBest = v => { try { localStorage.setItem('pang.best', String(v)); } catch (e) {} };

  const state = {
    phase: 'menu', paused: false, stageIndex: 0, endless: false, stageDef: null,
    score: 0, lives: 3, nextLifeAt: EXTRA_LIFE_EVERY, best: loadBest(), newBest: false,
    timeLeft: 0, time: 0, realT: 0, lastWarn: 0, stageT: 0, lifeDropAt: 0, lifeDropDone: false,
    balls: [], plats: [], ladders: [], harpoons: [], bullets: [], items: [], particles: [], texts: [],
    player: null, weapon: 'wire', weaponT: 0, freezeT: 0, slowT: 0, shield: false,
    combo: 0, lastPopT: -9, comboShow: 0, bestCombo: 0, popped: 0, stageStartScore: 0, bonus: 0,
    shake: 0, flash: 0, hitStop: 0, introT: 0, lastTick: -1, resumed: false, goT: 0, clearT: 0, deathT: 0, deathReason: '',
    fireBuffer: 0, gunCD: 0, gunSide: 1, bg: null
  };

  const input = {
    left: false, right: false, up: false, down: false, upTap: false,
    fireHeld: false, mouseX: null, mouseY: null, mode: 'kbd'
  };

  const newPlayer = x => ({ x, y: FLOOR, vx: 0, vy: 0, face: 1, run: 0, shootT: 0, climb: 0, ladder: null, invT: 0, dead: false, rot: 0 });

  function makeBall(d, mul = 1) {
    const hex = d.type === 'hex';
    const sp = (hex ? HEX_SPEED[d.s] : d.type === 'boss' ? BOSS_SPEED : BALL_SPEED) * mul;
    return {
      s: d.s, x: d.x, y: d.y, vx: (d.dir || 1) * sp, vy: hex ? sp * 0.9 : 0,
      type: d.type || 'n', mul, hp: d.type === 'boss' ? 3 : 1, rot: 0, flash: 0
    };
  }

  function loadStage(i) {
    const def = getStage(i);
    state.stageIndex = i;
    state.stageDef = def;
    state.balls = def.balls.map(d => makeBall(d));
    state.plats = def.plats.map(p => ({ ...p, hp: p.kind === 'glass' ? 2 : Infinity, seed: Math.random() * 1000 }));
    state.ladders = (def.ladders || []).map(l => ({ ...l }));
    state.harpoons = []; state.bullets = []; state.items = [];
    state.player = newPlayer(def.px || 480);
    state.timeLeft = def.time;
    state.stageT = 0;
    // One guaranteed bonus-life pickup per stage attempt, early enough to beat a fast clear
    state.lifeDropAt = 4 + Math.random() * 8;
    state.lifeDropDone = false;
    state.freezeT = 0; state.slowT = 0;
    if (state.weapon === 'gun') state.weapon = 'wire';
    state.combo = 0; state.fireBuffer = 0;
    state.bg = buildBackdrop(i);
    state.stageStartScore = state.score;
    state.phase = 'intro'; state.introT = 0; state.lastTick = -1; state.resumed = false;
  }

  // After losing a life, pick up exactly where the stage was: balls, broken glass,
  // items and the bonus-life drop all stay; only the player and weapons reset.
  function respawn() {
    const s = state;
    Object.assign(s, { weapon: 'wire', shield: false, freezeT: 0, slowT: 0, harpoons: [], bullets: [], combo: 0, fireBuffer: 0 });
    s.timeLeft = Math.max(s.timeLeft, s.deathReason === 'time' ? 30 : 15);
    s.player = newPlayer(safeSpawnX());
    s.phase = 'intro'; s.introT = 0; s.lastTick = -1; s.resumed = true;
  }

  function safeSpawnX() {
    let best = W / 2, bestD = -Infinity;
    for (let x = WALL + 30; x <= W - WALL - 30; x += 15) {
      let d = Infinity;
      for (const b of state.balls) d = Math.min(d, Math.abs(b.x - x) - SIZE_R[b.s]);
      if (d > bestD) { bestD = d; best = x; }
    }
    return bestD === Infinity ? W / 2 : best;
  }

  function setupDemo() {
    state.stageIndex = 0;
    state.stageDef = STAGES[0];
    state.plats = []; state.ladders = []; state.items = []; state.harpoons = []; state.bullets = [];
    state.balls = [
      makeBall(B(3, 200, 1, 'n', 150)),

  function newGame() {

      popped: 0, bestCombo: 0, endless: false, newBest: false, paused: false, particles: [], texts: []
    });

  function toMenu() {
    state.phase = 'menu';
