<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Grayscale Space Impact</title>
<style>
  :root{
    --bg:#111;
    --ink:#eee;
    --muted:#bbb;
    --dim:#777;
    --dimmer:#444;
    --panel:#1a1a1a;
    --accent:#ccc;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial}
  body{overflow-x:hidden}
  .wrap{max-width:1000px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .title{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px}
  .title a{color:var(--muted);text-decoration:none;font-size:22px;line-height:1;padding:0 4px}
  .title a:hover{color:#fff}
  .logo-ship{width:26px;height:18px;image-rendering:pixelated;animation:hover 1.2s ease-in-out infinite alternate}
  @keyframes hover{from{transform:translate(-2px,2px)}to{transform:translate(2px,-2px)}}
  .hud{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
  .pill{
    background:var(--panel);border:1px solid var(--dimmer);
    padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:4px;
    box-shadow:var(--shadow);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap
  }
  .pill b{color:#fff}
  .pill.bump{animation:bump .25s ease-out}
  @keyframes bump{50%{transform:scale(1.12);border-color:#aaa}}
  .pill.warn{animation:warn .5s infinite alternate}
  @keyframes warn{to{background:#3a3a3a;border-color:#ddd;color:#fff}}
  .pill.input{color:var(--muted);font-size:12px}
  .btn{
    border:1px solid var(--dimmer);background:linear-gradient(#1e1e1e,#161616);
    color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .1s ease,background .2s ease,border-color .2s ease;font-size:14px
  }
  .btn:hover{border-color:#888;background:linear-gradient(#262626,#1a1a1a)}
  .btn:active{transform:scale(.97)}
  .btn.big{padding:12px 26px;font-size:16px;background:linear-gradient(#f4f4f4,#bdbdbd);color:#111;border-color:#ddd}
  .btn.big:hover{background:linear-gradient(#fff,#d0d0d0)}
  .btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
  .frame{
    background:radial-gradient(1200px 600px at 50% -100px,#202020 20%,#111 60%,#0d0d0d 100%);
    border:1px solid #2b2b2b;border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)
  }
  canvas{display:block;margin:0 auto;border-radius:12px;background:#0d0d0d;cursor:crosshair;touch-action:none}
  footer{color:var(--dim);font-size:12px;text-align:center;line-height:2}
  code.k{background:#1a1a1a;border:1px solid #2a2a2a;padding:2px 6px;border-radius:6px;color:var(--ink);font-size:12px}

  /* ---------- Overlay & popups ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;
    display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);padding:16px
  }
  .overlay.show{display:flex}
  .modal{
    position:relative;width:min(92vw,620px);max-height:94vh;overflow:auto;
    background:linear-gradient(#171717,#0e0e0e);
    border:1px solid #2e2e2e;border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    text-align:center;animation:pop .45s cubic-bezier(.2,.9,.2,1) both
  }
  .modal::after{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);
    background-size:250% 100%;animation:sheen 3.5s ease-in-out infinite
  }
  @keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
  @keyframes pop{
    0%{transform:scale(.8) translateY(30px);opacity:0}
    70%{transform:scale(1.03);opacity:1}
    100%{transform:scale(1)}
  }
  .modal h2{margin:4px 0 8px;font-size:40px;font-weight:900;letter-spacing:4px;line-height:1.1}
  .modal .kicker{color:var(--dim);font-size:12px;letter-spacing:3px;text-transform:uppercase}
  .meta{color:var(--muted);font-size:14px;margin:6px 0 14px;line-height:1.5}
  .hint{color:var(--dim);font-size:12px;margin-top:10px}
  .letters span{display:inline-block}
  .letters .sp{width:.4em}
  .letters.drop span{animation:drop .8s cubic-bezier(.25,1.45,.5,1) both;animation-delay:calc(var(--i) * 70ms)}
  @keyframes drop{
    0%{transform:translateY(-160px) rotate(-25deg);opacity:0}
    55%{transform:translateY(12px) rotate(6deg);opacity:1}
    75%{transform:translateY(-6px) rotate(-2deg)}
    100%{transform:none}
  }
  .letters.popin span{animation:popin .55s cubic-bezier(.2,1.7,.4,1) both;animation-delay:calc(var(--i) * 55ms)}
  @keyframes popin{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
  .shine h2{color:#fff;animation:glow 1.8s ease-in-out infinite alternate}
  @keyframes glow{from{text-shadow:0 0 6px rgba(255,255,255,.2)}to{text-shadow:0 0 22px rgba(255,255,255,.75)}}
  .modal.over{animation:pop .45s cubic-bezier(.2,.9,.2,1) both, shake .5s .8s both}
  @keyframes shake{
    15%{translate:-10px 4px}30%{translate:9px -3px}45%{translate:-6px 2px}60%{translate:4px -1px}80%{translate:-2px 0}100%{translate:0 0}
  }
  .crack-wrap{position:relative;display:inline-block}
  .crack{position:absolute;left:-4%;top:38%;width:108%;height:40px;overflow:visible;pointer-events:none}
  .crack path{fill:none;stroke:#e8e8e8;stroke-width:2.5;stroke-linejoin:bevel;stroke-dasharray:420;stroke-dashoffset:420;
    filter:drop-shadow(0 0 4px rgba(255,255,255,.6));animation:draw .35s .78s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 16px}
  .stat{background:#121212;border:1px solid #262626;border-radius:14px;padding:10px;opacity:0;animation:rise .4s ease-out forwards;animation-delay:calc(.35s + var(--i) * 90ms)}
  .stat.wide{grid-column:1 / -1}
  .stat span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1.5px}
  .stat b{display:block;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat.wide b{font-size:32px}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .badge{display:inline-block;margin:0 0 12px;padding:4px 12px;border-radius:999px;font-weight:900;font-size:12px;letter-spacing:2px;
    background:linear-gradient(90deg,#6a6a6a,#fff,#6a6a6a);background-size:200% 100%;color:#111;animation:shimmer 1.2s linear infinite}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-100% 0}}

  /* Start screen */
  .logo{position:relative;margin:10px 0 4px;padding:18px 0 8px;overflow:hidden}
  .logo .word{display:block;font-family:"Courier New",ui-monospace,Menlo,monospace;font-weight:900;line-height:.95;color:#fff;
    letter-spacing:8px;text-shadow:0 0 18px rgba(255,255,255,.35)}
  .logo .word span{display:inline-block;animation:popin .55s cubic-bezier(.2,1.7,.4,1) both;animation-delay:calc(var(--i) * 55ms)}
  .logo .w1{font-size:52px}
  .logo .w2{font-size:40px;color:#bdbdbd;letter-spacing:14px}
  .logo .ship{position:absolute;top:2px;left:-60px;width:52px;image-rendering:pixelated;animation:flyby 4.5s linear infinite}
  @keyframes flyby{0%{transform:translateX(0)}60%,100%{transform:translateX(740px)}}
  .logo .trail{position:absolute;top:18px;left:0;height:2px;width:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);background-size:40% 100%;background-repeat:no-repeat;
    animation:trail 4.5s linear infinite}
  @keyframes trail{0%{background-position:-60% 0}60%,100%{background-position:160% 0}}
  .ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin:10px 0}
  .ctrl{background:#121212;border:1px solid #262626;border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:2}
  .ctrl h4{margin:0 0 2px;color:var(--ink);font-size:14px}
  .powers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 12px}
  .chip{display:flex;align-items:center;gap:6px;border:1px solid var(--dimmer);background:var(--panel);
    border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
  .chip .glyph{width:20px;height:20px;border-radius:6px;border:1.5px solid #ddd;display:grid;place-items:center;
    font-size:11px;color:#fff;background:#0f0f0f;font-weight:800}
  .lvls{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 16px}
  .lvl{padding:8px 4px;border-radius:12px;font-size:12px;line-height:1.25;box-shadow:none}
  .lvl b{display:block;font-size:18px}
  .lvl small{display:block;color:var(--dim);font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .section-label{color:var(--dim);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:4px}

  /* Victory */
  .crown-wrap{position:relative;height:110px;display:grid;place-items:center;margin-top:4px}
  .rays{position:absolute;left:50%;top:50%;width:300px;height:300px;translate:-50% -50%;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,255,255,.13) 0 9deg,transparent 9deg 18deg);
    -webkit-mask:radial-gradient(circle,#000 15%,transparent 65%);mask:radial-gradient(circle,#000 15%,transparent 65%);
    animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .crown{position:relative;font-size:76px;line-height:1;color:#fff;text-shadow:0 0 24px rgba(255,255,255,.8);
    animation:crownIn 1s .25s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes crownIn{0%{transform:translateY(-120px) scale(.3) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
  .flash{position:absolute;inset:0;background:#fff;animation:flash 1.1s ease-out forwards}
  @keyframes flash{from{opacity:1}to{opacity:0}}
  .shard{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);
    background:linear-gradient(135deg,#fff,#8a8a8a);opacity:0;
    animation:fly 1.6s cubic-bezier(.1,.7,.3,1) forwards}
  @keyframes fly{
    0%{transform:translate(-50%,-50%) rotate(0);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r));opacity:0}
  }
  @media (max-width:560px){
    .ctrl-grid{grid-template-columns:1fr}
    .lvls{grid-template-columns:repeat(4,1fr)}
    .logo .w1{font-size:36px;letter-spacing:4px}
    .logo .w2{font-size:28px;letter-spacing:8px}
    .modal h2{font-size:30px;letter-spacing:2px}
    .modal{padding:18px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <a href="index.html" title="Back to games" aria-label="Back to games">‹</a>
        <img class="logo-ship" id="logoShip" alt="" />
        <div>Grayscale Space Impact</div>
      </div>
      <div class="hud">
        <div class="pill" id="scorePill">Score&nbsp;<b id="score">0</b></div>
        <div class="pill">Level&nbsp;<b id="level">1/7</b></div>
        <div class="pill" id="livesPill">Lives&nbsp;<b id="lives">♥♥♥</b></div>
        <div class="pill" title="Gun power">Gun&nbsp;<b id="power">▮▯▯▯</b></div>
        <div class="pill" id="specPill" title="Special weapon">✦&nbsp;<b id="special">Missile ×3</b></div>
        <div class="pill input" id="inputChip" title="Last used input">⌨ Keys</div>
        <button class="btn" id="muteBtn">♪ On</button>
        <button class="btn" id="pauseBtn">Pause</button>
      </div>
    </header>
    <div class="frame">
      <canvas id="game" aria-label="Space Impact game"></canvas>
    </div>
    <footer>
      Move <code class="k">←</code><code class="k">↑</code><code class="k">↓</code><code class="k">→</code> / <code class="k">WASD</code>
      &nbsp;•&nbsp; Fire <code class="k">Space</code> (hold)
      &nbsp;•&nbsp; Special <code class="k">X</code> / <code class="k">Shift</code>
      &nbsp;•&nbsp; Pause <code class="k">P</code>
      &nbsp;•&nbsp; Mouse: steer, hold left to fire, right-click special
    </footer>
  </div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="modal" id="modal"></div>
  </div>
  <div id="fx"></div>

<script>
(() => {
  'use strict';

  // ---------- Tuning ----------
  const W = 960, H = 540, STEP = 1 / 120, TAU = Math.PI * 2;
  const SCROLL = 70, TCOL = 16;
  const PLAYER_SPEED = 330, MOUSE_SPEED = 560;
  const MAX_POWER = 4, START_LIVES = 3, CONTINUE_LIVES = 3, MAX_LIVES = 9, MAX_AMMO = 9;
  const INV_TIME = 2.6, CHAIN_WINDOW = 1.2, EXTRA_LIFE_EVERY = 30000;
  const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const MONO = '"Courier New",ui-monospace,Menlo,monospace';
  const DEBUG = /[?&]debug=1\b/.test(location.search);

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const $ = id => document.getElementById(id);

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- Levels ----------
  // pool entries: [formation, weight, earliest progress 0..1]
  const LEVELS = [
    { name: 'Deep Space', bg: 'space', len: 60, boss: 'octo',
      pool: [['line', 3], ['sine', 3], ['vee', 2], ['column', 2, 0.15], ['divers', 2, 0.35], ['shooter', 1.6, 0.45]] },
    { name: 'Asteroid Belt', bg: 'rocks', len: 66, boss: 'titan',
      pool: [['rocks', 4], ['line', 2], ['sine', 2], ['divers', 2, 0.2], ['shooter', 2, 0.3], ['bouncers', 1.5, 0.4]] },
    { name: 'Planet Zeta', bg: 'planet', len: 70, boss: 'crab', terrain: { floor: { base: 64, amp: 52 } },
      pool: [['turrets', 3], ['line', 2], ['vee', 2], ['divers', 2], ['shooter', 2, 0.2], ['heavy', 1, 0.5]] },
    { name: 'Crystal Caverns', bg: 'cave', len: 72, boss: 'serpent',
      terrain: { floor: { base: 58, amp: 46 }, ceil: { base: 58, amp: 46 } },
      pool: [['turrets', 3], ['bouncers', 2], ['swarm', 2], ['sine', 2], ['mines', 1.5, 0.3], ['shooter', 1.5, 0.3]] },
    { name: 'Alien Hive', bg: 'hive', len: 76, boss: 'queen',
      pool: [['swarm', 3], ['mines', 2], ['sine', 2], ['divers', 2], ['shooter', 2], ['bouncers', 1.5], ['heavy', 1.2, 0.4]] },
    { name: 'Iron Fortress', bg: 'fortress', len: 78, boss: 'dread',
      terrain: { floor: { base: 52, amp: 34, blocky: true }, ceil: { base: 52, amp: 34, blocky: true } },
      pool: [['turrets', 3], ['shooter', 2], ['column', 2], ['divers', 2], ['mines', 1.5], ['heavy', 1.5, 0.3]] },
    { name: 'The Core', bg: 'core', len: 82, boss: 'overlord',
      pool: [['swarm', 2], ['sine', 2], ['vee', 1.5], ['divers', 2], ['shooter', 2], ['mines', 1.5], ['bouncers', 1.5], ['heavy', 1.5, 0.2]] }
  ];
  const FORM_DUR = { line: 2.6, sine: 3, vee: 2.6, column: 2.4, divers: 2.8, shooter: 3.2, heavy: 5, swarm: 3, bouncers: 3, mines: 3, rocks: 2.6, turrets: 2.8 };

  // ---------- Pickups ----------
  const ITEMS = {
    P: { g: 'P', name: 'Gun Power' },
    M: { g: 'M', name: 'Missiles' },
    B: { g: 'B', name: 'Laser Beam' },
    W: { g: 'W', name: 'Wall' },
    S: { g: 'S', name: 'Shield' },
    L: { g: '♥', name: 'Extra Life' }
  };
  const SPECIAL_NAME = { M: 'Missile', B: 'Beam', W: 'Wall' };

  // ---------- Sound (WebAudio synth) ----------
  const sfx = (() => {
    let ac = null, master = null, nbuf = null, muted = false;
    const last = {};
    try { muted = localStorage.getItem('spaceimpact.muted') === '1'; } catch (e) {}
    function ensure() {
      if (!ac) {
        try {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
        } catch (e) { return; }
      }
      if (ac.state === 'suspended') ac.resume();
    }
    // Drop repeats of the same sound inside `gap` seconds so dense fights don't clip
    function gate(k, gap) {
      if (muted || !ac) return false;
      const t = ac.currentTime;
      if (last[k] && t - last[k] < gap) return false;
      last[k] = t;
      return true;
    }
    function tone(f, d, type = 'square', v = 0.08, f2 = null, delay = 0) {
      if (muted || !ac) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + d + 0.05);
    }
    function noise(d, v = 0.15, freq = 1200, type = 'bandpass', delay = 0) {
      if (muted || !ac) return;
      if (!nbuf) {
        nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const ch = nbuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      }
      const t = ac.currentTime + delay;
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = nbuf; f.type = type; f.frequency.value = freq;
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t); s.stop(t + d + 0.05);
    }
    const arp = (notes, d, type, v, gap) => notes.forEach((f, i) => tone(f, d, type, v, null, i * gap));
    // The classic handset ringtone, used as the victory fanfare
    const RING = [[659, 1], [587, 1], [370, 2], [415, 2], [554, 1], [494, 1], [294, 2], [330, 2], [494, 1], [440, 1], [277, 2], [330, 2], [440, 4]];
    return {
      ensure,
      get muted() { return muted; },
      toggle() { muted = !muted; try { localStorage.setItem('spaceimpact.muted', muted ? '1' : '0'); } catch (e) {} return muted; },
      shoot() { if (gate('shoot', 0.06)) tone(1500, 0.05, 'square', 0.022, 700); },
      eshot() { if (gate('eshot', 0.08)) tone(520, 0.08, 'triangle', 0.04, 260); },
      hit() { if (gate('hit', 0.05)) tone(260, 0.04, 'square', 0.03, 160); },
      tink() { if (gate('tink', 0.07)) { tone(2200, 0.04, 'square', 0.025, 1600); } },
      boom(size = 1) {
        if (!gate('boom' + size, size > 1 ? 0.05 : 0.04)) return;
        noise(0.18 + size * 0.14, 0.14 + size * 0.07, 1100 - size * 280, 'lowpass');
        tone(160 - size * 25, 0.2 + size * 0.12, 'sine', 0.12 + size * 0.05, 40);
      },
      pickup() { arp([660, 990, 1320], 0.09, 'square', 0.05, 0.06); },
      power() { arp([523, 784, 1046, 1568], 0.1, 'square', 0.05, 0.06); },
      missile() { noise(0.35, 0.12, 2400, 'bandpass'); tone(300, 0.3, 'sawtooth', 0.05, 900); },
      beam() { tone(110, 1.1, 'sawtooth', 0.09, 90); tone(220, 1.1, 'square', 0.04, 180); noise(1.0, 0.06, 3000, 'highpass'); },
      wall() { tone(90, 0.35, 'square', 0.12, 220); noise(0.3, 0.1, 800, 'lowpass'); },
      empty() { if (gate('empty', 0.2)) tone(140, 0.1, 'square', 0.05, 110); },
      die() { tone(420, 0.8, 'sawtooth', 0.14, 40); noise(0.7, 0.28, 600, 'lowpass'); },
      shieldBreak() { tone(1300, 0.35, 'sine', 0.1, 300); noise(0.2, 0.1, 4000, 'highpass'); },
      life() { arp([523, 659, 784, 1046, 1318], 0.12, 'square', 0.05, 0.07); },
      siren() { for (let i = 0; i < 3; i++) { tone(440, 0.28, 'square', 0.06, 880, i * 0.6); tone(880, 0.28, 'square', 0.05, 440, i * 0.6 + 0.3); } },
      charge() { tone(80, 0.9, 'sawtooth', 0.08, 600); },

  // Asteroids are generated: a noisy disc with a few craters and a shaded rim
  function genRock(r, seed, eye) {
    const rnd = mulberry32(seed);
    const ph = [rnd() * TAU, rnd() * TAU];
    const rows = [];
    for (let y = 0; y <= r * 2; y++) {
      let row = '';
      for (let x = 0; x <= r * 2; x++) {
        const dx = x - r, dy = y - r, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
        const rr = r * (0.84 + 0.1 * Math.sin(a * 3 + ph[0]) + 0.06 * Math.sin(a * 5 + ph[1]));
        let c = '.';
        if (d <= rr) {
          c = '#';
          if (d > rr - 1.2 && dx + dy > 0) c = '+';
          else if (d < rr - 1.5 && rnd() < 0.1) c = '+';
          if (eye && Math.hypot(x - eye[0], y - eye[1]) < eye[2]) c = '.';
        }
        row += c;
      }
      rows.push(row);
    }
    return rows;
  }
  ART.rockL0 = genRock(7, 11); ART.rockL1 = genRock(7, 29);
  ART.rockM0 = genRock(4, 5); ART.rockM1 = genRock(4, 17);
  ART.rockS0 = genRock(2, 3); ART.rockS1 = genRock(2, 8);
  ART.titan = genRock(13, 44, [9, 12, 3.6]);

  // Each pixel is drawn one unit short of the grid, giving the LCD dot-matrix look
  function bake(rows, px = 4, flip = false) {
    const gw = Math.max(...rows.map(r => r.length)), gh = rows.length, pad = 6;
    const w = gw * px, h = gh * px, gap = px >= 4 ? 1 : 0;
    const mk = (a, b) => {
      const c = document.createElement('canvas');
      c.width = w + pad * 2; c.height = h + pad * 2;
      const g = c.getContext('2d');
      g.shadowColor = 'rgba(255,255,255,.35)'; g.shadowBlur = 6;
      for (let y = 0; y < gh; y++) {
        const row = rows[flip ? gh - 1 - y : y];
        for (let x = 0; x < gw; x++) {
          const ch = row[x];
          if (ch !== '#' && ch !== '+') continue;
          g.fillStyle = ch === '#' ? a : b;
          g.fillRect(pad + x * px, pad + y * px, px - gap, px - gap);
        }
      }
      return c;
    };
    return { c: mk('#e6e6e6', '#8c8c8c'), f: mk('#ffffff', '#ffffff'), w, h, cw: w + pad * 2, ch: h + pad * 2 };
  }
  const SPR = {};
  for (const k in ART) SPR[k] = bake(ART[k], ['octo', 'crab', 'queen', 'dread', 'over', 'titan', 'shead', 'sseg'].includes(k) ? 5 : 4);
  SPR.turretC = bake(ART.turret, 4, true);
  SPR.dturretB = bake(ART.dturret, 4, true);
  $('logoShip').src = SPR.player.c.toDataURL();

  const orbCache = {};
  function orbSprite(r) {
    if (orbCache[r]) return orbCache[r];
    const pad = 6, sz = (r + pad) * 2, m = sz / 2;
    const c = document.createElement('canvas'); c.width = c.height = sz;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(m, m, r * 0.5, m, m, r + pad);
    gr.addColorStop(0, 'rgba(255,255,255,.4)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, sz, sz);
    g.fillStyle = '#f4f4f4'; g.beginPath(); g.arc(m, m, r, 0, TAU); g.fill();
    g.fillStyle = '#2e2e2e'; g.beginPath(); g.arc(m, m, r * 0.42, 0, TAU); g.fill();
    return (orbCache[r] = c);
  }

  // ---------- Backdrops: one scene per level, painted once and parallaxed ----------
  const LW = 1024;
  function blob(g, rnd, x, y, r, n = 9) {
    g.beginPath();
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU, rr = r * (0.7 + rnd() * 0.45);
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath(); g.fill();
  }
  function ridge(g, rnd, color, base, amp, step, top = false) {
    g.fillStyle = color;
    g.beginPath(); g.moveTo(0, top ? 0 : H);
    const ph = rnd() * TAU;
    for (let x = 0; x <= LW; x += step) {
      const k = x / LW * TAU;
      const h = base + amp * (0.5 + 0.3 * Math.sin(k * 2 + ph) + 0.2 * Math.sin(k * 5 + ph * 2)) + rnd() * amp * 0.25;
      g.lineTo(x, top ? h : H - h);
    }
    g.lineTo(LW, top ? 0 : H); g.closePath(); g.fill();
  }
  function stars(g, rnd, n, maxA = 0.5) {
    for (let i = 0; i < n; i++) {
      g.fillStyle = `rgba(255,255,255,${(0.08 + rnd() * maxA).toFixed(2)})`;
      const s = rnd() < 0.85 ? 1 : 2;
      g.fillRect(rnd() * LW | 0, rnd() * H | 0, s, s);
    }
  }
  const PAINT = {
    space(g, rnd) {

      g.fillStyle = bg; g.fillRect(0, 0, LW, H);

        const x = rnd() * LW, y = rnd() * H, r = 120 + rnd() * 160;
        const n = g.createRadialGradient(x, y, 0, x, y, r);
        n.addColorStop(0, 'rgba(255,255,255,.045)'); n.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = n; g.fillRect(0, 0, LW, H);
      }
      stars(g, rnd, 260);
      const px = 760, py = 130, pr = 58;
      const pg = g.createRadialGradient(px - 20, py - 20, 4, px, py, pr);
      pg.addColorStop(0, '#4a4a4a'); pg.addColorStop(1, '#151515');
      g.fillStyle = pg; g.beginPath(); g.arc(px, py, pr, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(200,200,200,.35)'; g.lineWidth = 3;
      g.beginPath(); g.ellipse(px, py, pr * 1.8, pr * 0.32, -0.3, 0, TAU); g.stroke();
      g.fillStyle = '#2a2a2a'; g.beginPath(); g.arc(220, 420, 16, 0, TAU); g.fill();
    },
    rocks(g, rnd) {

      g.fillStyle = d; g.fillRect(0, 0, LW, H);

    planet(g, rnd) {
      const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0e0e0e'); bg.addColorStop(1, '#202020');
      g.fillStyle = bg; g.fillRect(0, 0, LW, H);

    cave(g, rnd) {

      g.fillStyle = '#161616';
      for (let x = 0; x < LW; x += 40 + rnd() * 50) {
        const w = 18 + rnd() * 30, h = 60 + rnd() * 120;

    hive(g, rnd) {
      g.fillStyle = '#0d0d0d'; g.fillRect(0, 0, LW, H);
      const R = 26, hw = R * Math.sqrt(3);
      for (let row = -1; row * R * 1.5 < H + R; row++) {
        for (let col = -1; col * hw < LW + hw; col++) {
          const cx = col * hw + (row % 2 ? hw / 2 : 0), cy = row * R * 1.5;
          g.beginPath();

            const a = Math.PI / 6 + i * TAU / 6;
            const x = cx + Math.cos(a) * (R - 2), y = cy + Math.sin(a) * (R - 2);
            i ? g.lineTo(x, y) : g.moveTo(x, y);
          }
          g.closePath();
          const r = rnd();
          g.fillStyle = r < 0.12 ? '#1b1b1b' : r < 0.2 ? '#151515' : '#101010';

    fortress(g, rnd) {
      g.fillStyle = '#0f0f0f'; g.fillRect(0, 0, LW, H);
      for (let y = 0; y < H; y += 48) {
        for (let x = 0; x < LW; x += 64) {

          g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x + 1, y + 1, 62, 46);
          g.fillStyle = '#272727';
          g.fillRect(x + 4, y + 4, 2, 2); g.fillRect(x + 58, y + 4, 2, 2); g.fillRect(x + 4, y + 40, 2, 2); g.fillRect(x + 58, y + 40, 2, 2);

      for (let i = 0; i < 6; i++) {

      }
      for (let i = 0; i < 20; i++) { g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(rnd() * LW, rnd() * H, 3, 3); }
    },
    core(g, rnd) {
      const bg = g.createRadialGradient(LW / 2, H / 2, 10, LW / 2, H / 2, 600);
      bg.addColorStop(0, '#1d1d1d'); bg.addColorStop(1, '#0a0a0a');
      g.fillStyle = bg; g.fillRect(0, 0, LW, H);
      g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 1;
      for (let i = 0; i < 24; i++) {
        const a = i / 24 * TAU;
        g.beginPath(); g.moveTo(LW / 2, H / 2); g.lineTo(LW / 2 + Math.cos(a) * 900, H / 2 + Math.sin(a) * 900); g.stroke();

  const STARFIELD = { space: 130, rocks: 90, planet: 30, cave: 0, hive: 0, fortress: 0, core: 70 };
  const DUST = { cave: 40, hive: 36, fortress: 26 };

  function buildBackdrop(i) {
    const L = LEVELS[i], rnd = mulberry32(i * 977 + 3);
    const c = document.createElement('canvas'); c.width = LW; c.height = H;
    PAINT[L.bg](c.getContext('2d'), rnd);
    // Tile against a mirrored copy so the parallax layer wraps without a seam
    const layer = document.createElement('canvas'); layer.width = LW * 2; layer.height = H;
    const lg = layer.getContext('2d');
    lg.drawImage(c, 0, 0);
    lg.save(); lg.translate(LW * 2, 0); lg.scale(-1, 1); lg.drawImage(c, 0, 0); lg.restore();
    const flecks = [];
    for (let k = 0; k < (STARFIELD[L.bg] || 0); k++) flecks.push({ x: Math.random() * W, y: Math.random() * H, z: 0.3 + Math.random() * 1.7, kind: 'star' });
    for (let k = 0; k < (DUST[L.bg] || 0); k++) flecks.push({ x: Math.random() * W, y: Math.random() * H, z: 0.4 + Math.random() * 0.9, kind: 'dust', ph: Math.random() * TAU });
    state.bg = { layer, kind: L.bg, flecks };
  }

  // ---------- State ----------
  const loadNum = (k) => { try { return +localStorage.getItem(k) || 0; } catch (e) { return 0; } };
  const saveNum = (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) {} };

  const state = {
    phase: 'menu', paused: false, demo: true, levelIndex: 0, level: LEVELS[0], loop: 0, diff: 1,
    score: 0, best: loadNum('spaceimpact.best'), unlocked: loadNum('spaceimpact.unlocked'), newBest: false,
    lives: START_LIVES, power: 1, special: { type: 'M', ammo: 3 }, shield: false, nextLifeAt: EXTRA_LIFE_EVERY,
    player: { x: 110, y: H / 2, vx: 0, vy: 0, alive: true, inv: 0, fireCd: 0, specCd: 0 },
    enemies: [], ebullets: [], pbullets: [], specials: [], pickups: [], parts: [], texts: [], lasers: [],
    boss: null, stage: 'waves', stageT: 0, waves: [], waveIdx: 0, waveClock: 0, levelT: 0, scroll: 0, bossX: 0,
    terrain: null, bg: null, beam: 0, chain: 0, chainT: 0, bestChain: 0, chainShow: 0,
    shake: 0, flash: 0, banner: null, respawnT: 0, time: 0, outroT: 0,
    lvl: null, tot: { kills: 0, shots: 0, hits: 0 }, clearInfo: null, invincible: false
  };

  const input = {
    up: false, down: false, left: false, right: false, fire: false, specialPress: false,
    mode: 'kbd', mx: null, my: null, touchId: null, tlx: 0, tly: 0, tdx: 0, tdy: 0, touchFire: false
  };

  // ---------- Terrain ----------
  function makeTerrain(spec, seed) {
    if (!spec) return null;
    const rnd = mulberry32(seed);
    const mk = t => t && { ...t, p: [rnd() * TAU, rnd() * TAU, rnd() * TAU] };
    const gf = ctx.createLinearGradient(0, H - 140, 0, H);
    gf.addColorStop(0, '#3b3b3b'); gf.addColorStop(1, '#141414');
    const gc = ctx.createLinearGradient(0, 0, 0, 140);
    gc.addColorStop(0, '#141414'); gc.addColorStop(1, '#3b3b3b');
    return { floor: mk(spec.floor), ceil: mk(spec.ceil), gf, gc };
  }
  // Terrain is flat at the start of a level and flattens again before the boss arena
  function tEnv(wx) {
    return Math.min(clamp((wx - W * 0.9) / 500, 0, 1), clamp((state.bossX - wx) / 500, 0, 1));
  }
  function tThick(spec, wx) {
    if (spec.blocky) wx = Math.floor(wx / 64) * 64;
    const n = Math.sin(wx * 0.0041 + spec.p[0]) * 0.55 + Math.sin(wx * 0.0107 + spec.p[1]) * 0.3 + Math.sin(wx * 0.0231 + spec.p[2]) * 0.15;
    const q = spec.blocky ? 16 : 8;
    return Math.max(q, Math.round((spec.base + spec.amp * n * tEnv(wx)) / q) * q);
  }
  const colX = x => Math.floor((x + state.scroll) / TCOL) * TCOL;
  function floorY(x) {
    const T = state.terrain;
    return T && T.floor ? H - tThick(T.floor, colX(x)) : H;
  }
  function ceilY(x) {
    const T = state.terrain;
    return T && T.ceil ? tThick(T.ceil, colX(x)) : 0;
  }
  function band(x, m = 30) {
    return [Math.max(36, ceilY(x) + m), Math.min(H - 36, floorY(x) - m)];
  }

  // ---------- Level flow ----------
  function weighted(list, rnd) {
    let tot = 0;
    for (const e of list) tot += e[1];
    let r = rnd() * tot;
    for (const e of list) { r -= e[1]; if (r <= 0) return e[0]; }
    return list[0][0];
  }
  function buildWaves(L, idx, loop) {
    const rnd = mulberry32(idx * 7919 + loop * 31 + (Math.random() * 1e6 | 0));
    const waves = [];
    let t = 2.4, i = 0;
    while (t < L.len) {
      const prog = t / L.len;
      const pool = L.pool.filter(p => (p[2] || 0) <= prog);
      const f = weighted(pool, rnd);
      // Every third wave carries a pickup; the first level is extra generous early on
      const carrier = i % 3 === 1 || (idx === 0 && i < 6 && i % 2 === 1);
      waves.push({ t, f, carrier });
      t += (FORM_DUR[f] || 2.6) * lerp(1.15, 0.85, prog) / (1 + loop * 0.15);
      i++;
    }
    return waves;
  }

  function loadLevel(i) {
    const s = state;
    s.levelIndex = i; s.level = LEVELS[i];
    s.diff = 1 + i * 0.07 + s.loop * 0.3;
    Object.assign(s, {
      enemies: [], ebullets: [], pbullets: [], specials: [], pickups: [], lasers: [], texts: [],
      boss: null, stage: 'waves', stageT: 0, levelT: 0, scroll: 0, waveClock: 0, waveIdx: 0, beam: 0,
      respawnT: 0, chain: 0, chainT: 0, outroT: 0, paused: false
    });
    s.waves = buildWaves(s.level, i, s.loop);
    s.bossX = s.level.len * SCROLL;
    s.terrain = makeTerrain(s.level.terrain, i * 101 + 7);
    buildBackdrop(i);
    Object.assign(s.player, { x: 110, y: H / 2, vx: 0, vy: 0, alive: true, inv: s.demo ? 0 : 1.5, fireCd: 0.3, specCd: 0 });
    s.lvl = { start: s.score, kills: 0, shots: 0, hits: 0, deaths: 0 };
    if (!s.demo) {
      s.banner = { title: (s.loop ? 'LOOP ' + (s.loop + 1) + ' · ' : '') + 'LEVEL ' + (i + 1), sub: s.level.name, t: 0, dur: 2.8 };
      s.phase = 'play';
      if (i > s.unlocked) { s.unlocked = i; saveNum('spaceimpact.unlocked', i); }
      sfx.start();
    } else {
      s.banner = null;
    }
  }

  function newGame(start = 0) {
    const s = state;
    Object.assign(s, {
      demo: false, loop: 0, score: 0, lives: START_LIVES, power: start > 0 ? 2 : 1,
      special: { type: 'M', ammo: start > 0 ? 4 : 3 }, shield: false, nextLifeAt: EXTRA_LIFE_EVERY,
      newBest: false, bestChain: 0, parts: [], tot: { kills: 0, shots: 0, hits: 0 }, flash: 0, shake: 0
    });
    hideOverlay();
    loadLevel(start);
  }

  function toMenu() {
    const s = state;
    Object.assign(s, { phase: 'menu', paused: false, demo: true, loop: 0, power: 2, parts: [], banner: null });
    loadLevel(0);
    showOverlay('menu');
  }

  function stat(k, n = 1) { state.lvl[k] += n; if (k in state.tot) state.tot[k] += n; }

  // ---------- Effects ----------
  const SHADES = ['#ffffff', '#e0e0e0', '#bdbdbd', '#8f8f8f', '#666666'];
  function floatText(x, y, text, size = 14, life = 1) {
    if (state.demo) return;
    state.texts.push({ x, y, text, size, life, max: life });
  }
  function explode(x, y, size = 1, sound = true) {
    const P = state.parts;
    if (P.length > 900) P.splice(0, 200);
    const n = 8 + size * 9;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = rand(40, 230) * (0.6 + size * 0.35);
      const life = rand(0.35, 0.8) * (0.8 + size * 0.25);
      P.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, max: life, sz: 2 + (Math.random() * 3 | 0) + size, c: SHADES[Math.random() * 5 | 0] });
    }
    P.push({ ring: true, x, y, r: 4, vr: 160 + size * 130, life: 0.3 + size * 0.08, max: 0.3 + size * 0.08 });
    P.push({ glow: true, x, y, r: 14 + size * 14, life: 0.18, max: 0.18 });
    if (sound && !state.demo) sfx.boom(Math.min(3, size));
  }
  function sparks(x, y, n = 4, dir = Math.PI) {
    for (let i = 0; i < n; i++) {
      const a = dir + rand(-0.9, 0.9), sp = rand(80, 240), life = rand(0.12, 0.3);
      state.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, max: life, sz: 2, c: '#fff' });
    }
  }
  function sparkle(x, y) {
    const life = 0.5;
    state.parts.push({ star: true, x, y, vx: -40, vy: -30, life, max: life, sz: 6 });
  }
  function clearBullets(score = false, cx = null, cy = null, rad = Infinity) {
    const s = state;
    s.ebullets = s.ebullets.filter(b => {
      if (cx !== null && Math.hypot(b.x - cx, b.y - cy) > rad) return true;
      sparkle(b.x, b.y);
      if (score) addScore(10, null, null, false);
      return false;
    });
  }

  function addScore(n, x, y, chained = true) {
    const s = state;
    if (s.demo) return 0;
    const mult = chained ? chainMult() : 1;
    const pts = n * mult;
    s.score += pts;
    if (x !== null && x !== undefined) floatText(x, y, '+' + pts, mult > 1 ? 16 : 13, 0.8);
    while (s.score >= s.nextLifeAt) {
      s.nextLifeAt += EXTRA_LIFE_EVERY;
      if (s.lives < MAX_LIVES) { s.lives++; floatText(s.player.x, s.player.y - 40, '1UP', 22, 1.4); sfx.life(); }
    }
    return pts;
  }
  const chainMult = () => 1 + Math.min(4, Math.floor(state.chain / 6));

  // ---------- Enemies ----------
  // fire: [first level that shoots, seconds between shots, shots per burst, bullet speed]
  const EDEF = {
    drone: { hp: 1, score: 100, fire: [1, 3.6, 1, 170] },
    wave: { hp: 1, score: 100, fire: [2, 4.2, 1, 170] },
    diver: { hp: 2, score: 150 },
    shooter: { hp: 4, score: 300, fire: [0, 2.0, 3, 200] },
    heavy: { hp: 18, score: 1000 },
    swarm: { hp: 1, score: 60 },
    bouncer: { hp: 3, score: 200, fire: [3, 3.0, 1, 180] },
    mine: { hp: 3, score: 250 },
    turret: { hp: 4, score: 300, fire: [0, 2.2, 1, 200] },
    rockL: { hp: 8, score: 250 },
    rockM: { hp: 3, score: 120 },
    rockS: { hp: 1, score: 50 }
  };
  const bm = () => Math.min(1.35, 0.92 + 0.05 * state.levelIndex + 0.12 * state.loop);

  function spawnEnemy(type, x, y, o = {}) {
    const d = EDEF[type];
    let sprName = type;
    if (type.startsWith('rock')) sprName = type + (Math.random() < 0.5 ? '0' : '1');
    if (type === 'turret' && o.ground === 'ceil') sprName = 'turretC';
    const spr = SPR[sprName];
    const hp = Math.ceil(d.hp * (1 + state.loop * 0.3));
    const e = {
      type, x, y, y0: y, vx: -150, vy: 0, t: 0, hp, maxhp: hp, spr, flash: 0, dead: false,
      hw: spr.w * 0.4, hh: spr.h * 0.4, score: d.score, amp: 0, ph: 0, mode: 0, mt: 0, carrier: false, ...o
    };
    const f = d.fire;
    if (f && state.levelIndex + state.loop * 7 >= f[0]) {
      e.fireEvery = f[1]; e.burst = f[2]; e.bspd = f[3];
      e.fireT = f[1] * rand(0.5, 1.1);
    }
    state.enemies.push(e);
    return e;
  }

  function canFire(e) { return state.player.alive && e.x < W - 30 && e.x > 70 && !state.demo; }
  function maybeShoot(e, dt) {
    if (!e.fireEvery) return;
    e.fireT -= dt;
    if (e.fireT > 0) return;
    e.fireT = e.fireEvery * rand(0.85, 1.2) / state.diff;
    if (!canFire(e)) return;
    if (e.type === 'turret') {
      const a = e.aim;
      eShot(e.x + Math.cos(a) * 16, e.y + Math.sin(a) * 16, a, e.bspd * bm());
    } else fireAimed(e.x - e.hw, e.y, e.bspd, e.burst, 12);
    sfx.eshot();
  }

  const BEH = {
    drone(e, dt) { e.x += e.vx * dt; e.y = e.y0 + Math.sin(e.t * 2.2 + e.ph) * e.amp; maybeShoot(e, dt); },
    wave(e, dt) { e.x += e.vx * dt; e.y = e.y0 + Math.sin(e.x * 0.012 + e.ph) * e.amp; maybeShoot(e, dt); },
    swarm(e, dt) { e.x += e.vx * dt; e.y = e.y0 + Math.sin(e.x * 0.014 + e.ph) * e.amp; },
    diver(e, dt) {
      if (e.mode === 0) {
        e.x += (e.stopX - e.x) * Math.min(1, dt * 2.6) - 30 * dt;
        if (e.x <= e.stopX + 6) { e.mode = 1; e.mt = 0; }
      } else if (e.mode === 1) {
        e.mt += dt;
        e.aim = angTo(e.x, e.y);
        if (e.mt > 0.6) {
          e.mode = 2;
          const sp = 430 * Math.min(1.25, 0.95 + state.levelIndex * 0.04);
          e.vx = Math.cos(e.aim) * sp; e.vy = Math.sin(e.aim) * sp;
        }
      } else { e.x += e.vx * dt; e.y += e.vy * dt; }
    },
    shooter(e, dt) {
      if (e.mode === 0) {
        e.x += (e.stopX - e.x) * Math.min(1, dt * 2.2);
        if (Math.abs(e.x - e.stopX) < 4) { e.mode = 1; e.mt = 0; }
      } else if (e.mode === 1) {
        e.mt += dt;
        const ty = clamp(state.player.y, ...band(e.x, 40));
        e.y += clamp(ty - e.y, -55 * dt, 55 * dt);
        if (e.mt > 5) e.mode = 2;
      } else e.x -= 170 * dt;
      maybeShoot(e, dt);
    },
    heavy(e, dt) {
      if (e.mode === 0) {
        e.x += (e.stopX - e.x) * Math.min(1, dt * 1.6);
        if (Math.abs(e.x - e.stopX) < 4) { e.mode = 1; e.mt = 0; }
      } else if (e.mode === 1) {
        e.mt += dt;
        if (e.mt > 8) e.mode = 2;
      } else e.x -= 120 * dt;
      e.y = e.y0 + Math.sin(e.t * 0.9) * 50;
      e.fireT = (e.fireT ?? 1.4) - dt;
      if (e.fireT <= 0 && e.mode > 0) {
        e.fireT = 1.4 / state.diff;
        if (canFire(e)) {
          e.k = (e.k || 0) + 1;
          if (e.k % 2) fireAimed(e.x - 34, e.y, 210, 1);
          else for (let i = -2; i <= 2; i++) eShot(e.x - 34, e.y, Math.PI + i * 0.24, 175 * bm());
          sfx.eshot();
        }
      }
    },
    bouncer(e, dt) {
      e.x += e.vx * dt; e.y += e.vy * dt;
      const [top, bot] = band(e.x, 20);
      if (e.y < top) { e.y = top; e.vy = Math.abs(e.vy); }
      if (e.y > bot) { e.y = bot; e.vy = -Math.abs(e.vy); }
      maybeShoot(e, dt);
    },
    mine(e, dt) { e.x -= 55 * dt; e.y = e.y0 + Math.sin(e.t * 1.5) * 12; },
    turret(e, dt) {
      e.x -= SCROLL * dt;
      e.y = e.ground === 'ceil' ? ceilY(e.x) + e.hh + 2 : floorY(e.x) - e.hh - 2;
      e.aim = angTo(e.x, e.y);
      if (e.ground === 'floor') e.aim = clamp(e.aim, -Math.PI + 0.1, -0.1);
      else e.aim = clamp(e.aim, 0.1, Math.PI - 0.1);
      maybeShoot(e, dt);
    },
    rock(e, dt) {
      e.x += e.vx * dt; e.y += e.vy * dt;
      const [top, bot] = band(e.x, e.hh);
      if (e.y < top) { e.y = top; e.vy = Math.abs(e.vy); }
      if (e.y > bot) { e.y = bot; e.vy = -Math.abs(e.vy); }
    }
  };
  BEH.rockL = BEH.rockM = BEH.rockS = BEH.rock;

  // ---------- Formations ----------
  const FORM = {
    line(r) {
      const [a, b] = band(W + 40, 40), y = lerp(a, b, r()), n = 4 + (r() * 3 | 0);
      return Array.from({ length: n }, (_, i) => spawnEnemy('drone', W + 40 + i * 48, y, { vx: -160 }));
    },
    sine(r) {
      const [a, b] = band(W + 40, 110), y = lerp(a, b, r()), amp = 60 + r() * 30, n = 5 + (r() * 3 | 0), ph = r() * TAU;
      return Array.from({ length: n }, (_, i) => spawnEnemy('wave', W + 40 + i * 44, y, { vx: -175, amp, ph }));
    },
    vee(r) {
      const [a, b] = band(W + 40, 110), y = lerp(a, b, r());
      return Array.from({ length: 5 }, (_, i) => spawnEnemy('drone', W + 40 + Math.abs(i - 2) * 40, y + (i - 2) * 36, { vx: -150 }));
    },
    column(r) {
      const [a, b] = band(W + 40, 40), mid = (a + b) / 2, gap = Math.min(64, (b - a) / 4);
      return Array.from({ length: 4 }, (_, i) => spawnEnemy('drone', W + 40, mid + (i - 1.5) * gap, { vx: -165, amp: 14, ph: r() * TAU }));
    },
    divers(r) {
      const [a, b] = band(W + 40, 40);
      return Array.from({ length: 3 }, (_, i) => spawnEnemy('diver', W + 30 + i * 70, lerp(a, b, r()), { stopX: W - 140 - i * 70 }));
    },
    shooter(r) {
      const n = (state.levelIndex >= 3 || r() < 0.3) ? 2 : 1, [a, b] = band(W + 40, 50);
      return Array.from({ length: n }, (_, i) => spawnEnemy('shooter', W + 40 + i * 60, lerp(a, b, n === 1 ? r() : i ? 0.8 : 0.2), { stopX: W - 120 - i * 110 }));
    },
    heavy(r) {
      const [a, b] = band(W + 40, 80);
      return [spawnEnemy('heavy', W + 60, lerp(a, b, 0.3 + r() * 0.4), { stopX: W - 170 })];
    },
    swarm(r) {
      const [a, b] = band(W + 40, 100), y = lerp(a, b, r()), ph = r() * TAU;
      return Array.from({ length: 8 }, (_, i) => spawnEnemy('swarm', W + 30 + i * 26, y, { vx: -235, amp: 80, ph }));
    },
    bouncers(r) {
      const [a, b] = band(W + 40, 40);
      return Array.from({ length: 3 }, (_, i) => spawnEnemy('bouncer', W + 30 + i * 90, lerp(a, b, r()), { vx: -130, vy: (r() < 0.5 ? -1 : 1) * 190 }));
    },
    mines(r) {
      const [a, b] = band(W + 40, 50);
      return Array.from({ length: 3 }, (_, i) => spawnEnemy('mine', W + 30 + i * 110, lerp(a, b, r())));
    },
    rocks(r) {
      const n = 3 + (r() * 3 | 0), [a, b] = band(W + 40, 40), out = [];
      for (let i = 0; i < n; i++) {
        const k = r(), type = k < 0.25 ? 'rockL' : k < 0.7 ? 'rockM' : 'rockS';
        out.push(spawnEnemy(type, W + 50 + i * 70 + r() * 30, lerp(a, b, r()), { vx: -rand(90, 170), vy: rand(-50, 50) }));
      }
      return out;
    },
    turrets(r) {
      const T = state.terrain, out = [];
      for (let i = 0; i < 2; i++) {
        const g = T.floor && T.ceil ? (r() < 0.5 ? 'floor' : 'ceil') : T.floor ? 'floor' : 'ceil';
        out.push(spawnEnemy('turret', W + 30 + i * 160, g === 'floor' ? H - 60 : 60, { ground: g }));
      }
      return out;
    }
  };

  function spawnFormation(w) {
    const r = mulberry32((w.t * 1000) | 0 ^ state.levelIndex * 131 ^ (Math.random() * 1e6 | 0));
    if (w.f === 'turrets' && !state.terrain) w.f = 'line';
    const list = FORM[w.f](r);
    const form = { n: list.length, killed: 0, escaped: 0 };
    for (const e of list) e.form = form;
    if (w.carrier && list.length) list[list.length - 1].carrier = true;
    for (const e of list) if ((e.type === 'heavy') || (e.type === 'shooter' && r() < 0.4)) e.carrier = true;
  }

  // ---------- Bullets ----------
  function eShot(x, y, ang, spd, r = 5, extra) {
    if (state.ebullets.length > 280 || state.demo) return;
    state.ebullets.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r, g: 0, t: 0, ...extra });
  }
  function angTo(x, y) { const p = state.player; return Math.atan2(p.y - y, p.x - x); }
  function fireAimed(x, y, spd, n = 1, spreadDeg = 12, r = 5) {
    const a = angTo(x, y);
    for (let i = 0; i < n; i++) eShot(x, y, a + (i - (n - 1) / 2) * spreadDeg * Math.PI / 180, spd * bm(), r);
  }
  function fireRing(x, y, n, spd, off = 0, gap = null, gapW = 0, r = 5) {
    for (let i = 0; i < n; i++) {
      const a = off + i / n * TAU;
      if (gap !== null) {
        let d = Math.abs(((a - gap) % TAU + TAU) % TAU);
        if (d > Math.PI) d = TAU - d;
        if (d < gapW) continue;
      }
      eShot(x, y, a, spd * bm(), r);
    }
  }
  function lob(x, y, T, spread = 0) {
    const p = state.player, g = 620;
    const vx = clamp((p.x - x) / T + spread, -420, 60), vy = (p.y - y) / T - 0.5 * g * T;
    if (state.ebullets.length < 280 && !state.demo) state.ebullets.push({ x, y, vx, vy, r: 6, g, t: 0 });
  }

  // ---------- Pickups ----------
  function chooseDrop() {
    const s = state, w = [];
    w.push(['P', s.power < MAX_POWER ? (s.power <= 2 ? 6 : 3.2) : 0.5]);
    const low = s.special.ammo < 2;
    w.push(['M', low ? 2.6 : 1.4], ['B', low ? 2 : 1.1], ['W', low ? 1.8 : 1]);
    w.push(['S', s.shield ? 0 : 1.4]);
    w.push(['L', s.lives <= 1 ? 1.3 : s.lives >= 5 ? 0.15 : 0.4]);
    return weighted(w, Math.random);
  }
  function dropPickup(x, y, k = chooseDrop()) {
    state.pickups.push({ x, y, k, t: 0 });
  }
  function collect(k) {
    const s = state, p = s.player;
    switch (k.k) {
      case 'P':
        if (s.power < MAX_POWER) { s.power++; floatText(p.x, p.y - 34, s.power === MAX_POWER ? 'MAX POWER' : 'POWER UP', 16); sfx.power(); }
        else { addScore(1000, p.x, p.y - 30, false); sfx.pickup(); }
        break;
      case 'M': case 'B': case 'W':
        if (s.special.type === k.k) s.special.ammo = Math.min(MAX_AMMO, s.special.ammo + 3);
        else s.special = { type: k.k, ammo: Math.max(3, s.special.ammo) };
        floatText(p.x, p.y - 34, SPECIAL_NAME[k.k].toUpperCase() + ' ×' + s.special.ammo, 15);
        sfx.pickup();
        break;
      case 'S': s.shield = true; floatText(p.x, p.y - 34, 'SHIELD', 16); sfx.power(); break;
      case 'L':
        if (s.lives < MAX_LIVES) s.lives++;
        floatText(p.x, p.y - 34, '1UP', 22); sfx.life();
        break;
    }
    addScore(100, null, null, false);
    for (let i = 0; i < 8; i++) sparkle(k.x + rand(-14, 14), k.y + rand(-14, 14));
  }

  // ---------- Damage ----------
  function hitEnemy(e, dmg, x, y) {
    if (e.dead) return;
    e.hp -= dmg;
    e.flash = 0.06;
    if (e.hp <= 0) killEnemy(e);
    else if (dmg >= 1 || Math.random() < 0.1) { sparks(x, y, 2); if (!state.demo) sfx.hit(); }
  }
  function killEnemy(e, silent = false) {
    const s = state;
    e.dead = true;
    if (!s.demo) {
      s.chain++; s.chainT = CHAIN_WINDOW; s.chainShow = 1;
      s.bestChain = Math.max(s.bestChain, s.chain);
      stat('kills');
    }
    addScore(e.score, e.x, e.y - 12);
    const big = e.type === 'heavy' || e.type === 'rockL' ? 2 : 1;
    explode(e.x, e.y, big, !silent);
    s.shake = Math.max(s.shake, big * 3);
    if (e.carrier) dropPickup(e.x, e.y);
    if (e.type === 'mine') fireRing(e.x, e.y, 8, 120, Math.random());
    if (e.type === 'rockL' || e.type === 'rockM') {
      const t = e.type === 'rockL' ? 'rockM' : 'rockS';
      for (const d of [-1, 1]) spawnEnemy(t, e.x, e.y + d * 8, { vx: e.vx * 0.8 - 30, vy: d * rand(60, 120) });
    }
    if (e.form) {
      e.form.killed++;
      if (e.form.killed === e.form.n && e.form.n >= 4 && !s.demo) {
        const pts = addScore(e.form.n * 100, null, null, false);
        floatText(e.x, e.y - 34, 'WIPEOUT +' + pts, 15, 1.2);
        sfx.pickup();
      }
    }
  }

  function hurt() {
    const s = state, p = s.player;
    if (s.demo || s.invincible || !p.alive || p.inv > 0 || s.stage === 'outro') return;
    if (s.shield) {
      s.shield = false; p.inv = 1.2;
      sfx.shieldBreak();
      clearBullets(false, p.x, p.y, 140);
      for (let i = 0; i < 16; i++) sparkle(p.x + Math.cos(i / 16 * TAU) * 34, p.y + Math.sin(i / 16 * TAU) * 34);
      s.shake = 8;
      return;
    }
    p.alive = false;
    s.lives--;
    stat('deaths');
    s.power = Math.max(1, s.power - 1);
    s.chain = 0; s.beam = 0;
    explode(p.x, p.y, 3, false);
    sfx.die();
    s.shake = 18; s.flash = 0.35;
    s.respawnT = 1.6;
  }

  function respawn() {
    const s = state, p = s.player;
    const [a, b] = band(100, 40);
    Object.assign(p, { x: 90, y: clamp(H / 2, a, b), vx: 0, vy: 0, alive: true, inv: INV_TIME, fireCd: 0.2 });
    clearBullets(false, p.x, p.y, 260);
    floatText(p.x + 20, p.y - 40, 'GET READY', 16, 1.2);
  }

  function serpSegs(b) {

    return out;
