  function overSats(b) {
    return [0, 1, 2, 3].map(i => {
      const a = b.t * 1.2 + i * Math.PI / 2;
      return { x: b.x + Math.cos(a) * 100, y: b.y + Math.sin(a) * 92 };
    });
  }

  function spawnBoss() {
    const s = state, def = BOSSES[s.level.boss];
    const hp = Math.round(def.hp * (1 + s.loop * 0.35));
    const b = { def, kind: s.level.boss, name: def.name, hp, maxhp: hp, hpShown: hp, t: 0, flash: 0, entering: true, atk: 1.5, n: 0, x: W + 160, y: H / 2, tx: W - 170, boxes: [] };
    def.init(b);
    s.boss = b;
  }

  function bossBoxAt(x, y, rx, ry) {
    const b = state.boss;
    if (!b || b.dying) return null;
    for (const box of b.boxes) {
      if (x + rx > box.x && x - rx < box.x + box.w && y + ry > box.y && y - ry < box.y + box.h) return box;
    }
    return null;
  }

  function damageBoss(box, dmg, x, y) {
    const b = state.boss;
    if (!b || b.dying) return;
    if (box.armor) { sparks(x, y, 2, Math.PI); sfx.tink(); return; }
    if (box.part) {
      const p = box.part;
      const d = Math.min(dmg, p.hp);
      p.hp -= d; p.flash = 0.06; b.hp -= d;
      if (p.hp <= 0) {
        explode(b.x + p.ox, b.y + p.oy, 3);
        addScore(2000, b.x + p.ox, b.y + p.oy - 20, false);
        state.shake = 12;
      }
    } else { b.hp -= dmg; b.flash = 0.06; }
    if (dmg >= 1 || Math.random() < 0.12) { sparks(x, y, 2); sfx.hit(); }
    if (b.hp <= 0) bossDefeated();
  }

  function bossDefeated() {
    const s = state, b = s.boss;
    b.dying = true; b.hp = 0;
    s.stage = 'bossdeath'; s.stageT = 0;
    s.lasers = [];
    const pts = addScore(5000 * (s.levelIndex + 1) * (1 + s.loop), null, null, false);
    floatText(b.x, b.y - 80, b.name + ' DOWN  +' + pts.toLocaleString(), 20, 2.2);
    sfx.bossDie();
    s.flash = 0.5;
  }

  // ---------- Update ----------
  function updatePlayer(dt) {
    const s = state, p = s.player;
    if (!p.alive) {
      s.respawnT -= dt;
      if (s.respawnT <= 0) {
        if (s.lives <= 0 && !s.demo) gameOver();
        else respawn();
      }
      return;
    }
    p.inv = Math.max(0, p.inv - dt);
    p.fireCd -= dt; p.specCd -= dt;
    if (s.stage === 'outro') {
      p.vx = Math.min(p.vx + 1100 * dt, 1000);
      p.x += p.vx * dt; p.y += (H / 2 - p.y) * Math.min(1, dt * 2);
      return;
    }
    const ox = p.x, oy = p.y;
    if (s.demo) demoPilot(dt);
    else if (input.mode === 'mouse' && input.mx !== null) {
      const dx = input.mx - 18 - p.x, dy = input.my - p.y, d = Math.hypot(dx, dy), max = MOUSE_SPEED * dt;
      const m = d > max ? max / d : 1;
      p.x += dx * m; p.y += dy * m;
    } else if (input.mode === 'touch') {
      p.x += input.tdx * 1.3; p.y += input.tdy * 1.3;
      input.tdx = input.tdy = 0;
    } else {
      let ax = (input.right ? 1 : 0) - (input.left ? 1 : 0), ay = (input.down ? 1 : 0) - (input.up ? 1 : 0);
      if (ax && ay) { ax *= Math.SQRT1_2; ay *= Math.SQRT1_2; }
      const k = Math.min(1, dt * 18);
      p.vx += (ax * PLAYER_SPEED - p.vx) * k;
      p.vy += (ay * PLAYER_SPEED - p.vy) * k;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    p.x = clamp(p.x, 30, W - 40);
    p.y = clamp(p.y, 22, H - 22);
    // Terrain is solid: the ship slides along it rather than exploding
    if (s.terrain) {
      let fl = H, cl = 0;
      for (const x of [p.x - 20, p.x, p.x + 20]) { fl = Math.min(fl, floorY(x)); cl = Math.max(cl, ceilY(x)); }
      if (p.y + 14 > fl) { p.y = fl - 14; if (Math.random() < 0.3) sparks(p.x, fl, 1, -Math.PI / 2); }
      if (p.y - 14 < cl) { p.y = cl + 14; if (Math.random() < 0.3) sparks(p.x, cl, 1, Math.PI / 2); }
    }
    if (input.mode !== 'kbd' || s.demo) { p.vx = (p.x - ox) / dt; p.vy = (p.y - oy) / dt; }

    const wantFire = s.demo || input.fire || input.touchFire;
    if (wantFire && p.fireCd <= 0 && s.stage !== 'bossdeath') {
      firePlayer();
      p.fireCd = s.power >= 4 ? 0.1 : 0.125;
    }
    if (input.specialPress) { input.specialPress = false; useSpecial(); }
  }

  function demoPilot(dt) {
    const s = state, p = s.player;
    let ty = H / 2 + Math.sin(s.time * 0.7) * 120, best = Infinity;
    for (const e of s.enemies) {
      if (e.x > p.x + 40 && e.x < W && e.x - p.x < best) { best = e.x - p.x; ty = e.y; }
    }
    for (const b of s.ebullets) if (Math.abs(b.x - p.x) < 80 && Math.abs(b.y - p.y) < 30) ty = p.y + (b.y > p.y ? -80 : 80);
    const tx = 150 + Math.sin(s.time * 0.4) * 60;
    p.x += clamp(tx - p.x, -200 * dt, 200 * dt);
    p.y += clamp(ty - p.y, -240 * dt, 240 * dt);
    p.inv = 0;
  }

  function firePlayer() {
    const s = state, p = s.player, x = p.x + 26, y = p.y, sp = 900;
    const shots = s.power === 1 ? [[0, 0]] : s.power === 2 ? [[0, -6], [0, 6]]
      : s.power === 3 ? [[0, 0], [0.14, 0], [-0.14, 0]] : [[0, -6], [0, 6], [0.17, 0], [-0.17, 0]];
    for (const [a, oy] of shots) {
      s.pbullets.push({ x, y: y + oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dmg: 1 });
      if (!s.demo) stat('shots');
    }
    if (!s.demo) sfx.shoot();
  }

  function useSpecial() {
    const s = state, p = s.player;
    if (!p.alive || s.stage === 'outro' || p.specCd > 0) return;
    if (s.special.ammo <= 0) { sfx.empty(); floatText(p.x, p.y - 30, 'NO AMMO', 12, 0.6); return; }
    if (s.special.type === 'B' && s.beam > 0) return;
    s.special.ammo--;
    p.specCd = 0.45;
    if (s.special.type === 'M') {
      s.specials.push({ kind: 'missile', x: p.x + 20, y: p.y, vx: 260, vy: 0, t: 0, hit: new Set() });
      sfx.missile();
    } else if (s.special.type === 'B') {
      s.beam = 1.1; sfx.beam();
    } else {
      s.specials.push({ kind: 'wall', x: p.x + 40, y: p.y, h: 210, vx: 250, t: 0, hit: new Set() });
      sfx.wall();
    }
  }

  function updateWaves(dt) {
    const s = state;
    if (s.stage !== 'waves') return;
    let active = 0;
    for (const e of s.enemies) if (e.type !== 'turret') active++;
    if (active < 13) s.waveClock += dt;
    while (s.waveIdx < s.waves.length && s.waves[s.waveIdx].t <= s.waveClock) spawnFormation(s.waves[s.waveIdx++]);
    if (s.waveIdx >= s.waves.length) {
      if (s.demo) { s.waveIdx = 0; s.waveClock = 0; return; }
      if (s.levelT >= s.level.len && (active < 3 || s.stageT > 6)) {
        s.stage = 'warning'; s.stageT = 0;
        sfx.siren();
      }
    } else s.stageT = 0;
  }

  function updateStage(dt) {
    const s = state;
    if (s.stage === 'warning' && s.stageT > 3) { spawnBoss(); s.stage = 'boss'; s.stageT = 0; }
    else if (s.stage === 'bossdeath') {
      const b = s.boss;
      if (b && s.stageT < 2.2) {
        b.boomT = (b.boomT || 0) - dt;
        if (b.boomT <= 0) {
          b.boomT = 0.1;
          const box = b.boxes[0];
          explode(rand(box.x, box.x + box.w), rand(box.y, box.y + box.h), 2);
          s.shake = Math.max(s.shake, 8);
        }
      }
      if (b && s.stageT >= 2.2) {
        explode(b.x, b.y, 4); explode(b.x - 40, b.y + 20, 3, false); explode(b.x + 30, b.y - 30, 3, false);
        s.flash = 0.9; s.shake = 26;
        s.boss = null;
        clearBullets(true);
        for (const e of s.enemies) if (!e.dead) killEnemy(e, true);
      }
      if (s.stageT > 3.4 && s.player.alive) { s.stage = 'outro'; s.stageT = 0; s.player.vx = 0; s.player.inv = 9; }
    } else if (s.stage === 'outro' && s.player.x > W + 80) levelClear();
  }

  function updateEnemies(dt) {
    const s = state, p = s.player;
    for (const e of s.enemies) {
      if (e.dead) continue;
      e.t += dt; e.flash -= dt;
      BEH[e.type](e, dt);
      if (e.x < -90 || e.x > W + 300 || e.y < -140 || e.y > H + 140) {
        e.dead = true;
        if (e.form) e.form.escaped++;
        continue;
      }
      if (p.alive && Math.abs(e.x - p.x) < e.hw + 16 && Math.abs(e.y - p.y) < e.hh + 8) {
        if (p.inv <= 0 && !s.demo) { hurt(); hitEnemy(e, 99, e.x, e.y); }
      }
    }
    s.enemies = s.enemies.filter(e => !e.dead);
  }

  function updateBoss(dt) {
    const s = state, b = s.boss, p = s.player;
    if (!b) return;
    b.t += dt; b.flash -= dt;
    if (b.parts) for (const q of b.parts) q.flash = (q.flash || 0) - dt;
    b.hpShown += (b.hp - b.hpShown) * Math.min(1, dt * 4);
    if (b.dying) return;
    if (b.entering && !b.def.customEnter) {
      b.x += (b.tx - b.x) * Math.min(1, dt * 1.8);
      if (Math.abs(b.tx - b.x) < 3) b.entering = false;
    }
    b.def.update(b, dt);
    b.boxes = b.def.boxes(b);
    if (p.alive && p.inv <= 0 && bossBoxAt(p.x, p.y, 16, 8)) hurt();
  }

  function updatePBullets(dt) {
    const s = state;
    for (const b of s.pbullets) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x > W + 20 || b.y < -10 || b.y > H + 10) { b.dead = true; continue; }
      if (s.terrain && (b.y > floorY(b.x) || b.y < ceilY(b.x))) { b.dead = true; sparks(b.x, b.y, 2); continue; }
      for (const e of s.enemies) {
        if (e.dead) continue;
        if (Math.abs(b.x - e.x) < e.hw + 6 && Math.abs(b.y - e.y) < e.hh + 3) {
          b.dead = true;
          if (!s.demo) stat('hits');
          hitEnemy(e, b.dmg, b.x, b.y);
          break;
        }
      }
      if (b.dead) continue;
      const box = bossBoxAt(b.x, b.y, 6, 2);
      if (box) { b.dead = true; stat('hits'); damageBoss(box, b.dmg, b.x, b.y); }
    }
    s.pbullets = s.pbullets.filter(b => !b.dead);
  }

  function missileBlast(m) {
    const s = state;
    explode(m.x, m.y, 2);
    for (const e of s.enemies) if (!e.dead && Math.hypot(e.x - m.x, e.y - m.y) < 80) hitEnemy(e, 6, e.x, e.y);
    s.shake = Math.max(s.shake, 6);
    m.dead = true;
  }

  function updateSpecials(dt) {
    const s = state, p = s.player;
    for (const m of s.specials) {
      m.t += dt;
      if (m.kind === 'missile') {
        // Gentle homing toward the closest target ahead
        let tx = null, ty = null, best = Infinity;
        for (const e of s.enemies) {
          if (e.dead || e.x < m.x || m.hit.has(e)) continue;
          const d = Math.hypot(e.x - m.x, e.y - m.y);
          if (d < best) { best = d; tx = e.x; ty = e.y; }
        }
        if (s.boss && !s.boss.dying) {
          const box = s.boss.boxes.find(bx => !bx.armor) || s.boss.boxes[0];
          if (box) { const cx = box.x + box.w / 2, cy = box.y + box.h / 2, d = Math.hypot(cx - m.x, cy - m.y); if (d < best) { tx = cx; ty = cy; } }
        }
        const sp = Math.min(820, Math.hypot(m.vx, m.vy) + 1400 * dt);
        let a = Math.atan2(m.vy, m.vx);
        if (tx !== null) {
          let want = Math.atan2(ty - m.y, tx - m.x), d = ((want - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
          a += clamp(d, -4 * dt, 4 * dt);
        }
        m.vx = Math.cos(a) * sp; m.vy = Math.sin(a) * sp;
        m.x += m.vx * dt; m.y += m.vy * dt;
        if (Math.random() < 0.6) s.parts.push({ x: m.x - Math.cos(a) * 16, y: m.y - Math.sin(a) * 16, vx: rand(-20, 20) - 40, vy: rand(-20, 20), life: 0.4, max: 0.4, sz: 4, c: '#777' });
        for (const e of s.enemies) {
          if (e.dead || m.hit.has(e)) continue;
          if (Math.abs(e.x - m.x) < e.hw + 12 && Math.abs(e.y - m.y) < e.hh + 8) {
            m.hit.add(e);
            hitEnemy(e, 12, m.x, m.y);
            if (!e.dead) { missileBlast(m); break; }
          }
        }
        if (!m.dead) {
          const box = bossBoxAt(m.x, m.y, 12, 8);
          if (box) { damageBoss(box, box.armor ? 0 : 18, m.x, m.y); missileBlast(m); }
        }
        if (s.terrain && (m.y > floorY(m.x) || m.y < ceilY(m.x))) missileBlast(m);
        if (m.x > W + 40 || m.y < -40 || m.y > H + 40) m.dead = true;
      } else if (m.kind === 'wall') {
        m.x += m.vx * dt;
        const top = m.y - m.h / 2, bot = m.y + m.h / 2;
        for (const e of s.enemies) {
          if (e.dead || m.hit.has(e)) continue;
          if (Math.abs(e.x - m.x) < e.hw + 10 && e.y + e.hh > top && e.y - e.hh < bot) { m.hit.add(e); hitEnemy(e, 20, e.x, e.y); }
        }
        s.ebullets = s.ebullets.filter(b => {
          if (Math.abs(b.x - m.x) < 14 && b.y > top && b.y < bot) { sparkle(b.x, b.y); addScore(10, null, null, false); return false; }
          return true;
        });
        const b = s.boss;
        if (b && !b.dying) {
          for (const box of b.boxes) {
            if (m.x + 10 > box.x && m.x - 10 < box.x + box.w && bot > box.y && top < box.y + box.h) {
              const hitBox = b.boxes.find(bx => !bx.armor && m.x + 10 > bx.x && m.x - 10 < bx.x + bx.w && bot > bx.y && top < bx.y + bx.h);
              if (hitBox) damageBoss(hitBox, 22, m.x, m.y);
              else sfx.tink();
              for (let i = 0; i < 14; i++) sparks(m.x, rand(top, bot), 1);
              m.dead = true;
              break;
            }
          }
        }
        if (m.x > W + 40) m.dead = true;
      }
    }
    s.specials = s.specials.filter(m => !m.dead);

    if (s.beam > 0) {
      s.beam -= dt;
      if (!p.alive) { s.beam = 0; return; }
      const y = p.y, x0 = p.x + 24, hh = 16;
      for (const e of s.enemies) {
        if (e.dead || e.x + e.hw < x0 || Math.abs(e.y - y) > hh + e.hh) continue;
        hitEnemy(e, 45 * dt, e.x, e.y);
      }
      if (s.boss && !s.boss.dying) {
        const box = s.boss.boxes.find(bx => !bx.armor && bx.x + bx.w > x0 && Math.abs(bx.y + bx.h / 2 - y) < hh + bx.h / 2);
        if (box) damageBoss(box, 30 * dt, box.x, y);
      }
      s.ebullets = s.ebullets.filter(b => {
        if (b.x > x0 && Math.abs(b.y - y) < hh + b.r) { sparkle(b.x, b.y); return false; }
        return true;
      });
    }
  }

  function updateEBullets(dt) {
    const s = state, p = s.player;
    for (const b of s.ebullets) {
      b.t += dt;
      if (b.roll) {
        b.x += b.vx * dt;
        b.y = floorY(b.x) - b.r - 1;
        b.rot += dt * 12;
      } else {
        if (b.g) b.vy += b.g * dt;
        b.x += b.vx * dt; b.y += b.vy * dt;
      }
      if (b.x < -20 || b.x > W + 30 || b.y < -30 || b.y > H + 30) { b.dead = true; continue; }
      if (s.terrain && !b.roll && (b.y > floorY(b.x) + 2 || b.y < ceilY(b.x) - 2)) { b.dead = true; sparks(b.x, b.y, 1); continue; }
      if (p.alive && p.inv <= 0) {
        const dx = b.x - p.x, dy = b.y - p.y, rr = b.r + 4;
        if (dx * dx + dy * dy < rr * rr) { b.dead = true; hurt(); }
      }
    }
    s.ebullets = s.ebullets.filter(b => !b.dead);
  }

  function updateLasers(dt) {
    const s = state, p = s.player;
    for (const L of s.lasers) {
      const was = L.t < L.charge;
      L.t += dt;
      if (was && L.t >= L.charge) { sfx.laser(); s.shake = Math.max(s.shake, 6); }
      if (L.t >= L.charge && p.alive && p.inv <= 0 && Math.abs(p.y - L.y) < L.h / 2 + 5 && p.x > L.x0 && p.x < L.x1) hurt();
    }
    s.lasers = s.lasers.filter(L => L.t < L.charge + L.dur);
  }

  function updatePickups(dt) {
    const s = state, p = s.player;
    for (const k of s.pickups) {
      k.t += dt;
      const dx = p.x - k.x, dy = p.y - k.y, d = Math.hypot(dx, dy) || 1;
      if (p.alive && d < 140 && !s.demo) {
        const sp = 140 + 420 * (1 - d / 140);
        k.x += dx / d * sp * dt; k.y += dy / d * sp * dt;
      } else { k.x -= 55 * dt; k.y += Math.sin(k.t * 3) * 22 * dt; }
      if (p.alive && d < 30 && !s.demo) { collect(k); k.dead = true; }
      if (k.x < -30) k.dead = true;
    }
    s.pickups = s.pickups.filter(k => !k.dead);
  }

  function updateParticles(dt) {
    const s = state;
    for (const q of s.parts) {
      q.life -= dt;
      if (q.ring) { q.r += q.vr * dt; continue; }
      if (q.glow) continue;
      if (q.conf) { q.vy += 260 * dt; q.rot += q.vr * dt; }
      else { const k = Math.max(0, 1 - 2.6 * dt); q.vx *= k; q.vy *= k; }
      q.x += q.vx * dt; q.y += q.vy * dt;
    }
    s.parts = s.parts.filter(q => q.life > 0);
    for (const t of s.texts) { t.life -= dt; t.y -= 34 * dt; }
    s.texts = s.texts.filter(t => t.life > 0);
  }

  function updateBackdrop(dt, speed = 1) {
    const bg = state.bg;
    if (!bg) return;
    for (const f of bg.flecks) {
      f.x -= SCROLL * f.z * (f.kind === 'star' ? 1.6 : 0.8) * speed * dt;
      if (f.kind === 'dust') f.y += Math.sin(state.time * 0.8 + f.ph) * 8 * dt;
      if (f.x < -4) { f.x = W + 4; f.y = Math.random() * H; }
    }
  }

  function playStep(dt) {
    const s = state;
    s.levelT += dt; s.stageT += dt;
    s.scroll += SCROLL * dt;
    if (s.banner) { s.banner.t += dt; if (s.banner.t > s.banner.dur) s.banner = null; }
    updateBackdrop(dt, s.stage === 'outro' ? 1 + s.stageT * 4 : 1);
    updatePlayer(dt);
    if (s.phase !== 'play' && s.phase !== 'menu') return;
    updateWaves(dt);
    updateStage(dt);
    if (s.phase !== 'play' && s.phase !== 'menu') return;
    updateBoss(dt);
    updateEnemies(dt);
    updatePBullets(dt);
    updateSpecials(dt);
    updateEBullets(dt);
    updateLasers(dt);
    updatePickups(dt);
    updateParticles(dt);
    if (s.chainT > 0) { s.chainT -= dt; if (s.chainT <= 0) s.chain = 0; }
  }

  function step(dt) {
    const s = state;
    s.time += dt;
    s.shake = Math.max(0, s.shake - dt * 40);
    s.flash = Math.max(0, s.flash - dt * 1.6);
    if (s.phase === 'play' || s.phase === 'menu') playStep(dt);
    else {
      s.scroll += SCROLL * 0.4 * dt;
      updateBackdrop(dt, 0.4);
      updateParticles(dt);
    }
  }

  // ---------- Results ----------
  function updateBest() {
    if (state.score > state.best) { state.best = state.score; state.newBest = true; saveNum('spaceimpact.best', state.best); }
  }
  function levelClear() {
    const s = state, L = s.lvl, i = s.levelIndex;
    const acc = L.shots ? L.hits / L.shots : 0;
    const accBonus = Math.round(acc * 100) * 25 * (i + 1);
    const noMiss = L.deaths === 0 ? 5000 * (i + 1) : 0;
    s.clearInfo = { lvlScore: s.score - L.start, kills: L.kills, acc, accBonus, noMiss, before: s.score };
    addScore(accBonus + noMiss, null, null, false);
    if (i + 1 < LEVELS.length && i + 1 > s.unlocked) { s.unlocked = i + 1; saveNum('spaceimpact.unlocked', i + 1); }
    updateBest();
    if (i === LEVELS.length - 1) { s.phase = 'win'; sfx.win(); showOverlay('win'); }
    else { s.phase = 'clear'; sfx.clear(); showOverlay('clear'); }
  }
  function gameOver() {
    state.phase = 'over';
    updateBest();
    sfx.over();
    showOverlay('over');
  }

  // ---------- Rendering ----------
  function drawSpr(s, x, y, flash) { ctx.drawImage(flash ? s.f : s.c, Math.round(x - s.cw / 2), Math.round(y - s.ch / 2)); }

  function drawBackdrop() {
    const s = state, bg = s.bg;
    if (!bg) { ctx.fillStyle = '#0d0d0d'; ctx.fillRect(0, 0, W, H); return; }
    const off = (s.scroll * 0.18) % (LW * 2);
    ctx.drawImage(bg.layer, -off, 0);
    ctx.drawImage(bg.layer, LW * 2 - off, 0);
    if (bg.kind === 'core') {
      ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const r = ((s.time * 50 + i * 130) % 520) + 20;
        ctx.beginPath(); ctx.arc(W * 0.7, H / 2, r, 0, TAU); ctx.stroke();
      }
    } else if (bg.kind === 'hive') {
      ctx.fillStyle = `rgba(255,255,255,${0.02 + 0.02 * Math.sin(s.time * 2)})`;
      ctx.fillRect(0, 0, W, H);
    }
    const warp = s.stage === 'outro' ? 1 + s.stageT * 6 : 1;
    for (const f of bg.flecks) {
      if (f.kind === 'star') {
        const a = 0.25 + f.z * 0.35, len = Math.max(1, f.z * 1.2 * warp);
        ctx.fillStyle = `rgba(255,255,255,${Math.min(0.9, a).toFixed(2)})`;
        ctx.fillRect(f.x, f.y, len * (f.z > 1.4 ? 2 : 1), f.z > 1.4 ? 2 : 1);
      } else {
        ctx.fillStyle = 'rgba(200,200,200,.18)';
        ctx.fillRect(f.x, f.y, 2 + f.z * 2, 2 + f.z * 2);
      }
    }
  }

  function drawTerrain() {
    const s = state, T = s.terrain;
    if (!T) return;
    const s0 = Math.floor(s.scroll / TCOL) * TCOL;
    for (const which of ['floor', 'ceil']) {
      const spec = T[which];
      if (!spec) continue;
      const fl = which === 'floor';
      ctx.fillStyle = fl ? T.gf : T.gc;
      let prev = null;
      const cols = [];
      for (let wx = s0; wx - s.scroll < W + TCOL; wx += TCOL) {
        const sx = wx - s.scroll, th = tThick(spec, wx);
        cols.push([sx, th, wx]);
        if (fl) ctx.fillRect(sx, H - th, TCOL + 0.5, th); else ctx.fillRect(sx, 0, TCOL + 0.5, th);
      }
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      for (const [sx, th, wx] of cols) {
        for (let r = 14; r < th - 4; r += 14) {
          if (((wx / TCOL) + r / 14) % 3 === 0) ctx.fillRect(sx + 5, fl ? H - th + r : th - r - 4, 5, 4);
        }
      }
      ctx.fillStyle = '#c4c4c4';
      for (const [sx, th] of cols) {
        ctx.fillRect(sx, fl ? H - th : th - 3, TCOL + 0.5, 3);
        if (prev !== null && prev !== th) {
          const a = fl ? H - Math.max(prev, th) : Math.min(prev, th), len = Math.abs(prev - th);
          ctx.fillRect(sx - 1, a, 2, len);
        }
        prev = th;
      }
    }
  }

  function drawEnemies() {
    const s = state;
    for (const e of s.enemies) {
      if (e.type === 'diver' && e.mode === 1) {
        ctx.save();
        ctx.strokeStyle = `rgba(255,255,255,${0.15 + 0.2 * Math.sin(e.mt * 30)})`;
        ctx.setLineDash([4, 8]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(e.aim) * 260, e.y + Math.sin(e.aim) * 260); ctx.stroke();
        ctx.restore();
      }
      const jit = e.type === 'diver' && e.mode === 1 ? rand(-2, 2) : 0;
      if (e.type === 'mine') {
        const pr = 0.5 + 0.5 * Math.sin(e.t * 6);
        ctx.fillStyle = `rgba(255,255,255,${0.05 + pr * 0.08})`;
        ctx.beginPath(); ctx.arc(e.x, e.y, 24 + pr * 4, 0, TAU); ctx.fill();
      }
      if (e.type === 'turret') {
        ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(e.aim) * 18, e.y + Math.sin(e.aim) * 18); ctx.stroke();
      }
      drawSpr(e.spr, e.x + jit, e.y, e.flash > 0);
      if (e.carrier) {
        const k = 0.5 + 0.5 * Math.sin(s.time * 8), hw = e.hw + 8, hh = e.hh + 8, c = 6;
        ctx.strokeStyle = `rgba(255,255,255,${0.35 + k * 0.5})`; ctx.lineWidth = 2;
        ctx.beginPath();
        for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
          const x = e.x + sx * hw, y = e.y + sy * hh;
          ctx.moveTo(x, y - sy * c); ctx.lineTo(x, y); ctx.lineTo(x - sx * c, y);
        }
        ctx.stroke();
      }
      if (e.type === 'heavy' && e.hp < e.maxhp) {
        ctx.fillStyle = '#333'; ctx.fillRect(e.x - 26, e.y - e.hh - 12, 52, 4);
        ctx.fillStyle = '#ddd'; ctx.fillRect(e.x - 26, e.y - e.hh - 12, 52 * clamp(e.hp / e.maxhp, 0, 1), 4);
      }
    }
  }

  function dashedBand(y, hh, t) {
    ctx.save();
    ctx.fillStyle = `rgba(255,255,255,${0.04 + 0.05 * Math.sin(t * 25)})`;
    ctx.fillRect(0, y - hh, W, hh * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.setLineDash([12, 10]); ctx.lineDashOffset = t * 120; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, y - hh); ctx.lineTo(W, y - hh); ctx.moveTo(0, y + hh); ctx.lineTo(W, y + hh); ctx.stroke();
    ctx.restore();
  }

  function drawBoss() {
    const b = state.boss;
    if (!b) return;
    ctx.save();
    if (b.dying) ctx.translate(rand(-4, 4), rand(-4, 4));
    if (b.def.draw) b.def.draw(b);
    else drawSpr(SPR[b.def.spr || b.kind || 'octo'], b.x, b.y, b.flash > 0);
    ctx.restore();
  }

  function drawLasers() {
    for (const L of state.lasers) {
      ctx.save();
      if (L.t < L.charge) {
        const k = L.t / L.charge;
        ctx.globalAlpha = 0.3 + 0.6 * k * (0.5 + 0.5 * Math.sin(L.t * 30));
        ctx.strokeStyle = '#eee'; ctx.lineWidth = 2;
        ctx.setLineDash([14, 10]); ctx.lineDashOffset = -L.t * 140;
        ctx.beginPath();
        ctx.moveTo(L.x0, L.y - L.h / 2); ctx.lineTo(L.x1, L.y - L.h / 2);
        ctx.moveTo(L.x0, L.y + L.h / 2); ctx.lineTo(L.x1, L.y + L.h / 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#fff'; ctx.font = `900 18px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('!', L.x0 + 20, L.y);
        ctx.fillRect(L.x1 - 4, L.y - 8 * k, 4, 16 * k);
      } else {
        const k = 1 - (L.t - L.charge) / L.dur, hh = L.h / 2 * (0.75 + 0.25 * Math.sin(L.t * 70));
        ctx.globalAlpha = Math.min(1, k * 2);
        ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(L.x0, L.y - hh - 8, L.x1 - L.x0, hh * 2 + 16);
        ctx.fillStyle = '#fff'; ctx.fillRect(L.x0, L.y - hh, L.x1 - L.x0, hh * 2);
      }
      ctx.restore();
    }
  }

  function drawPlayer() {
    const s = state, p = s.player;
    if (!p.alive) return;
    if (p.inv > 0 && s.stage !== 'outro' && Math.floor(p.inv * 12) % 2 === 0) return;
    const boost = clamp(p.vx / PLAYER_SPEED, -1, 1);
    const fl = Math.round((8 + Math.random() * 6 + boost * 6 + (s.stage === 'outro' ? 20 : 0)) / 2) * 2;
    ctx.fillStyle = '#9a9a9a'; ctx.fillRect(p.x - 26 - fl, p.y - 4, fl, 8);
    ctx.fillStyle = '#fff'; ctx.fillRect(p.x - 26 - fl * 0.5, p.y - 2, fl * 0.5, 4);
    drawSpr(SPR.player, p.x, p.y);
    if (s.shield) {
      ctx.save();
      ctx.strokeStyle = `rgba(255,255,255,${0.45 + 0.25 * Math.sin(s.time * 6)})`; ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]); ctx.lineDashOffset = -s.time * 40;
      ctx.beginPath(); ctx.arc(p.x, p.y, 36, 0, TAU); ctx.stroke();
      ctx.restore();
    }
  }

  function drawPBullets() {
    for (const b of state.pbullets) {
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(b.x - 22, b.y - 1, 12, 2);
      ctx.fillStyle = '#cfcfcf'; ctx.fillRect(b.x - 10, b.y - 2, 12, 4);
      ctx.fillStyle = '#fff'; ctx.fillRect(b.x + 2, b.y - 2, 4, 4);
    }
  }

  function drawSpecials() {
    const s = state, p = s.player;
    for (const m of s.specials) {
      if (m.kind === 'missile') {
        ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(Math.atan2(m.vy, m.vx));
        drawSpr(SPR.missile, 0, 0);
        ctx.fillStyle = Math.random() < 0.5 ? '#fff' : '#aaa'; ctx.fillRect(-26, -3, 8, 6);
        ctx.restore();
      } else {
        const top = m.y - m.h / 2;
        ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(m.x - 14, top, 28, m.h);
        for (let y = 0; y < m.h; y += 8) {
          ctx.fillStyle = Math.random() < 0.85 ? '#eee' : '#888';
          ctx.fillRect(m.x - 7, top + y, 14, 7);
        }
      }
    }
    if (s.beam > 0 && p.alive) {
      const x0 = p.x + 24, k = Math.min(1, s.beam * 3), hh = 12 + Math.sin(s.time * 80) * 2;
      ctx.globalAlpha = k;
      ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(x0, p.y - hh - 8, W - x0, hh * 2 + 16);
      ctx.fillStyle = '#fff'; ctx.fillRect(x0, p.y - hh, W - x0, hh * 2);
      ctx.fillStyle = '#bbb'; ctx.fillRect(x0, p.y - 2, W - x0, 4);
      ctx.globalAlpha = 1;
    }
  }

  function drawEBullets() {
    for (const b of state.ebullets) {
      if (b.roll) {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
        ctx.fillStyle = '#eee'; ctx.fillRect(-b.r, -b.r, b.r * 2, b.r * 2);
        ctx.fillStyle = '#333'; ctx.fillRect(-3, -3, 6, 6);
        ctx.restore();
        continue;
      }
      const o = orbSprite(b.r);
      ctx.drawImage(o, b.x - o.width / 2, b.y - o.height / 2);
    }
  }

  function drawPickups() {
    const s = state;
    for (const k of s.pickups) {
      const bob = Math.sin(k.t * 5) * 2, x = Math.round(k.x), y = Math.round(k.y + bob);
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.beginPath(); ctx.arc(x, y, 22 + Math.sin(k.t * 6) * 3, 0, TAU); ctx.fill();
      ctx.fillStyle = '#0f0f0f'; ctx.fillRect(x - 13, y - 13, 26, 26);
      ctx.strokeStyle = Math.floor(k.t * 4) % 2 ? '#fff' : '#bbb'; ctx.lineWidth = 2;
      ctx.strokeRect(x - 13, y - 13, 26, 26);
      ctx.fillStyle = '#fff'; ctx.font = `900 15px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ITEMS[k.k].g, x, y + 1);
    }
  }

  function drawParticles() {
    for (const q of state.parts) {
      const a = clamp(q.life / q.max, 0, 1);
      if (q.ring) {
        ctx.strokeStyle = `rgba(255,255,255,${a * 0.7})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.stroke();
      } else if (q.glow) {
        ctx.fillStyle = `rgba(255,255,255,${a * 0.6})`;
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
      } else if (q.star) {
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        const z = q.sz * a;
        ctx.fillRect(q.x - z / 2, q.y - 1, z, 2); ctx.fillRect(q.x - 1, q.y - z / 2, 2, z);
      } else if (q.conf) {
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
        ctx.globalAlpha = a; ctx.fillStyle = q.c; ctx.fillRect(-q.sz / 2, -q.sz / 4, q.sz, q.sz / 2);
        ctx.restore();
      } else {
        ctx.globalAlpha = a; ctx.fillStyle = q.c;
        ctx.fillRect(Math.round(q.x - q.sz / 2), Math.round(q.y - q.sz / 2), q.sz, q.sz);
        ctx.globalAlpha = 1;
      }
    }
  }

  function bigText(text, x, y, size, alpha = 1, scale = 1, color = '#fff', font = FONT) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.font = `900 ${size}px ${font}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, size / 9); ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.strokeText(text, 0, 0);
    ctx.shadowColor = 'rgba(255,255,255,.5)'; ctx.shadowBlur = 14;
    ctx.fillStyle = color; ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  function drawTexts() {
    for (const t of state.texts) bigText(t.text, t.x, t.y, t.size, Math.min(1, t.life / t.max * 2.5));
  }

  function drawUI() {
    const s = state;
    if (s.phase === 'menu') return;
    // Chain counter
    if (s.chain >= 3 && s.chainT > 0) {
      const m = chainMult();
      ctx.save();
      ctx.globalAlpha = Math.min(1, s.chainT / CHAIN_WINDOW * 2);
      ctx.font = `900 18px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillStyle = '#fff';
      ctx.fillText(`CHAIN ${s.chain}${m > 1 ? '  ×' + m : ''}`, 18, 16);
      ctx.fillStyle = '#444'; ctx.fillRect(18, 40, 120, 3);
      ctx.fillStyle = '#ddd'; ctx.fillRect(18, 40, 120 * clamp(s.chainT / CHAIN_WINDOW, 0, 1), 3);
      ctx.restore();
    }
    // Boss health
    const b = s.boss;
    if (b && (s.stage === 'boss' || s.stage === 'bossdeath')) {
      const x = W / 2 - 220, y = 18, w = 440;
      ctx.font = `800 13px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = '#ddd'; ctx.fillText(b.name, W / 2, y);
      ctx.fillStyle = '#1b1b1b'; ctx.fillRect(x, y + 18, w, 10);
      ctx.fillStyle = '#5a5a5a'; ctx.fillRect(x, y + 18, w * clamp(b.hpShown / b.maxhp, 0, 1), 10);
      ctx.fillStyle = '#efefef'; ctx.fillRect(x, y + 18, w * clamp(b.hp / b.maxhp, 0, 1), 10);
      ctx.strokeStyle = '#666'; ctx.lineWidth = 1; ctx.strokeRect(x - 0.5, y + 17.5, w + 1, 11);
      if (b.kind === 'overlord') for (const f of [0.33, 0.66]) { ctx.fillStyle = '#111'; ctx.fillRect(x + w * f - 1, y + 18, 2, 10); }
    }
    // Banner
    if (s.banner) {
      const t = s.banner.t, d = s.banner.dur;
      const e = 1 - Math.pow(1 - clamp(t / 0.4, 0, 1), 3), out = clamp((d - t) / 0.4, 0, 1), a = Math.min(e, out);
      ctx.fillStyle = `rgba(0,0,0,${0.45 * a})`; ctx.fillRect(0, H / 2 - 70, W, 130);
      ctx.fillStyle = `rgba(255,255,255,${0.5 * a})`; ctx.fillRect(0, H / 2 - 70, W, 1); ctx.fillRect(0, H / 2 + 59, W, 1);
      bigText(s.banner.title, W / 2 - (1 - e) * 400, H / 2 - 22, 50, a, 1, '#fff', MONO);
      bigText(s.banner.sub.toUpperCase(), W / 2 + (1 - e) * 400, H / 2 + 28, 20, a * 0.85, 1, '#bbb');
    }
    // Boss warning
    if (s.stage === 'warning') {
      const t = s.stageT, a = clamp(t * 3, 0, 1) * clamp((3 - t) * 3, 0, 1);
      const on = Math.floor(t * 4) % 2 === 0;
      ctx.save();
      ctx.globalAlpha = a;
      for (const y of [H / 2 - 74, H / 2 + 58]) {
        ctx.fillStyle = '#ddd'; ctx.fillRect(0, y, W, 16);
        ctx.fillStyle = '#111';
        for (let x = -40 + (t * 120) % 40; x < W; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 20, y); ctx.lineTo(x + 36, y + 16); ctx.lineTo(x + 16, y + 16); ctx.fill();
        }
      }
      ctx.restore();
      bigText('WARNING', W / 2, H / 2 - 12, 62, a * (on ? 1 : 0.55), 1, '#fff', MONO);
      bigText(BOSSES[s.level.boss].name + ' APPROACHING', W / 2, H / 2 + 34, 18, a, 1, '#bbb');
    }
    // Touch special button
    if (input.mode === 'touch' && s.phase === 'play') {
      const bx = W - 70, by = H - 70;
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.beginPath(); ctx.arc(bx, by, 42, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `900 20px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(s.special.type, bx, by - 6);
      ctx.font = `700 12px ${FONT}`; ctx.fillText('×' + s.special.ammo, bx, by + 14);
    }
    if (s.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.8, s.flash)})`; ctx.fillRect(0, 0, W, H); }
  }

  function render() {
    const s = state;
    ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (s.shake > 0.3) ctx.translate((Math.random() - 0.5) * s.shake, (Math.random() - 0.5) * s.shake);
    drawBackdrop();
    drawTerrain();
    drawPickups();
    drawEnemies();
    drawBoss();
    drawPBullets();
    drawSpecials();
    if (s.phase === 'play' || s.phase === 'menu') drawPlayer();
    drawLasers();
    drawEBullets();
    drawParticles();
    drawTexts();
    ctx.restore();
    drawUI();
    ctx.drawImage(fxLayer, 0, 0, W, H);
  }

  // ---------- HUD ----------
  const hud = {
    score: $('score'), scorePill: $('scorePill'), level: $('level'), lives: $('lives'), livesPill: $('livesPill'),
    power: $('power'), special: $('special'), specPill: $('specPill'), input: $('inputChip'),
    mute: $('muteBtn'), pause: $('pauseBtn')
  };
  function setText(el, v) {
    if (el._v === v) return false;
    el._v = v; el.textContent = v;
    return true;
  }
  function updateHUD() {
    const s = state, demo = s.demo;
    if (setText(hud.score, (demo ? 0 : s.score).toLocaleString()) && s.score > 0) {
      hud.scorePill.classList.remove('bump'); void hud.scorePill.offsetWidth; hud.scorePill.classList.add('bump');
    }
    setText(hud.level, demo ? '–' : (s.loop ? 'L' + (s.loop + 1) + '·' : '') + (s.levelIndex + 1) + '/' + LEVELS.length);
    const lives = demo ? START_LIVES : s.lives;
    setText(hud.lives, lives > 5 ? '♥×' + lives : '♥'.repeat(Math.max(0, lives)) || '–');
    hud.livesPill.classList.toggle('warn', !demo && s.phase === 'play' && s.lives <= 1);
    const pw = demo ? 1 : s.power;
    setText(hud.power, '▮'.repeat(pw) + '▯'.repeat(MAX_POWER - pw));
    const sp = demo ? { type: 'M', ammo: 3 } : s.special;
    setText(hud.special, sp.ammo > 0 ? `${SPECIAL_NAME[sp.type]} ×${sp.ammo}` : 'Empty');
    const key = sp.type + sp.ammo;
    if (key !== hud.specKey) {
      if (hud.specKey && !demo) { hud.specPill.classList.remove('bump'); void hud.specPill.offsetWidth; hud.specPill.classList.add('bump'); }
      hud.specKey = key;
    }
    setText(hud.input, input.mode === 'kbd' ? '⌨ Keys' : input.mode === 'touch' ? '◉ Touch' : '◉ Mouse');
    setText(hud.mute, sfx.muted ? '♪ Off' : '♪ On');
    setText(hud.pause, s.paused ? 'Resume' : 'Pause');
  }

  // ---------- Overlays ----------
  const overlay = $('overlay'), modal = $('modal'), fx = $('fx');
  const letters = (text, cls) =>
    `<h2 class="letters ${cls}">${[...text].map((c, i) => c === ' ' ? '<span class="sp"> </span>' : `<span style="--i:${i}">${c}</span>`).join('')}</h2>`;
  const statBox = (label, value, i, extra = '') => `<div class="stat ${extra}" style="--i:${i}"><span>${label}</span><b ${value.attrs || ''}>${value.text}</b></div>`;
  const counted = (to, from = 0) => ({ text: from.toLocaleString(), attrs: `data-to="${to}" data-from="${from}"` });
  const wordSpans = (w, off) => [...w].map((c, i) => `<span style="--i:${i + off}">${c}</span>`).join('');

  function showOverlay(type) {
    const s = state;
    let html = '';
    fx.innerHTML = '';
    if (type === 'menu') {
      const lv = LEVELS.map((L, i) => `<button class="btn lvl" data-act="lvl" data-lvl="${i}" ${i > s.unlocked ? 'disabled' : ''}>
          <b>${i > s.unlocked ? '🔒' : i + 1}</b><small>${L.name}</small></button>`).join('');
      html = `
        <div class="logo"><div class="trail"></div><img class="ship" src="${SPR.player.c.toDataURL()}" alt="">
          <span class="word w1">${wordSpans('SPACE', 0)}</span><span class="word w2">${wordSpans('IMPACT', 5)}</span></div>
        <p class="meta">Blast through 7 sectors of alien waves, grab power-ups from the blinking carriers, and take down a giant boss at the end of every level.</p>
        <div class="ctrl-grid">
          <div class="ctrl"><h4>⌨ Keyboard</h4>
            <code class="k">←↑↓→</code> or <code class="k">WASD</code> fly<br>
            <code class="k">Space</code> fire (hold) · <code class="k">X</code>/<code class="k">Shift</code> special<br>
            <code class="k">P</code> pause · <code class="k">M</code> mute</div>
          <div class="ctrl"><h4>◉ Mouse / Touch</h4>
            Ship follows the pointer, hold left to fire<br>
            Right-click fires your special<br>
            Touch: drag to fly, auto-fire, tap ◉ for special</div>
        </div>
        <div class="powers">${Object.values(ITEMS).map(it => `<span class="chip"><b class="glyph">${it.g}</b>${it.name}</span>`).join('')}</div>
        <div class="section-label">Mission select</div>
        <div class="lvls">${lv}</div>
        <div class="btns"><button class="btn big" data-act="start">▶ Start Mission</button></div>
        <div class="hint">Best score ${s.best.toLocaleString()} · press Enter · extra life every ${EXTRA_LIFE_EVERY.toLocaleString()} points</div>`;
    } else if (type === 'pause') {
      html = `
        ${letters('PAUSED', 'popin')}
        <p class="meta">Level ${s.levelIndex + 1} · ${s.level.name} · Score ${s.score.toLocaleString()}</p>
        <div class="btns">
          <button class="btn big" data-act="resume">▶ Resume</button>
          <button class="btn" data-act="mute">${sfx.muted ? '♪ Sound On' : '♪ Sound Off'}</button>
          <button class="btn" data-act="quit">Quit to Title</button>
        </div>
        <div class="hint">press P, Esc or Enter to resume</div>`;
    } else if (type === 'clear') {
      const c = s.clearInfo, next = LEVELS[s.levelIndex + 1];
      html = `
        <div class="kicker">Level ${s.levelIndex + 1} · ${s.level.name}</div>
        <div class="shine">${letters('SECTOR CLEAR', 'popin')}</div>
        <div class="stats">
          ${statBox('Level score', counted(c.lvlScore), 0)}
          ${statBox('Enemies destroyed', counted(c.kills), 1)}
          ${statBox('Accuracy ' + Math.round(c.acc * 100) + '%', counted(c.accBonus), 2)}
          ${statBox(c.noMiss ? 'No-miss bonus' : 'No-miss bonus (lost a life)', counted(c.noMiss), 3)}
          ${statBox('Total score', counted(s.score, c.before), 4, 'wide')}
        </div>
        <div class="btns"><button class="btn big" data-act="next">Next Level ▸</button></div>
        <div class="hint">Up next: ${next.name} · boss ${BOSSES[next.boss].name} · press Enter</div>`;
    } else if (type === 'over') {
      html = `
        <div class="crack-wrap">${letters('GAME OVER', 'drop')}
          <svg class="crack" viewBox="0 0 300 40" preserveAspectRatio="none"><path d="M0 22 L40 18 L62 28 L95 12 L120 24 L150 16 L172 30 L205 14 L232 24 L262 18 L300 26"/></svg>
        </div>
        <p class="meta">Your ship went down in ${s.level.name}.</p>
        ${s.newBest ? '<div class="badge">NEW BEST</div>' : ''}
        <div class="stats">
          ${statBox('Final score', counted(s.score), 0, 'wide')}
          ${statBox('Level reached', { text: (s.loop ? 'Loop ' + (s.loop + 1) + ' · ' : '') + (s.levelIndex + 1) + ' / ' + LEVELS.length }, 1)}
          ${statBox('Enemies destroyed', counted(s.tot.kills), 2)}
          ${statBox('Best chain', { text: String(s.bestChain) }, 3)}
          ${statBox('Best score', { text: s.best.toLocaleString() }, 4)}
        </div>
        <div class="btns">
          <button class="btn big" data-act="continue">▶ Continue · ${'♥'.repeat(CONTINUE_LIVES)}</button>
          <button class="btn" data-act="retry">↻ New Game</button>
          <button class="btn" data-act="menu">All Games</button>
        </div>
        <div class="hint">Continue picks up right where you fell, keeping your score · press Enter</div>`;
    } else if (type === 'win') {
      const c = s.clearInfo;
      html = `
        <div class="crown-wrap"><div class="rays"></div><div class="crown">♛</div></div>
        <div class="shine">${letters('VICTORY', 'popin')}</div>
        <p class="meta">The Overlord is destroyed. All 7 sectors are safe${s.loop ? ' — loop ' + (s.loop + 1) + ' complete' : ''}.</p>
        ${s.newBest ? '<div class="badge">NEW BEST</div>' : ''}
        <div class="stats">
          ${statBox('Final score', counted(s.score, c.before), 0, 'wide')}
          ${statBox('Enemies destroyed', counted(s.tot.kills), 1)}
          ${statBox('Accuracy', { text: Math.round((s.tot.hits / Math.max(1, s.tot.shots)) * 100) + '%' }, 2)}
          ${statBox('Best chain', { text: String(s.bestChain) }, 3)}
          ${statBox('Lives left', { text: '♥'.repeat(Math.min(s.lives, 6)) || '–' }, 4)}
        </div>
        <div class="btns">
          <button class="btn big" data-act="endless">∞ Next Loop (harder)</button>
          <button class="btn" data-act="again">Play Again</button>
        </div>
        <div class="hint">The next loop keeps your score, lives and weapons</div>`;
      victoryFX();
    }
    modal.className = 'modal ' + type;
    modal.innerHTML = html;
    modal.style.animation = 'none';
    void modal.offsetWidth;
    modal.style.animation = '';
    overlay.classList.add('show');
    modal.querySelectorAll('[data-to]').forEach((el, i) => countUp(el, +el.dataset.from, +el.dataset.to, 900, 450 + i * 120));
  }

  function hideOverlay() {
    overlay.classList.remove('show');
    fx.innerHTML = '';
  }

  function countUp(el, from, to, dur, delay) {
    const t0 = performance.now() + delay;
    const tick = now => {
      const k = clamp((now - t0) / dur, 0, 1);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * e).toLocaleString();
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  function victoryFX() {
    fx.innerHTML = '<div class="flash"></div>';
    for (let i = 0; i < 28; i++) {
      const d = document.createElement('div');
      d.className = 'shard';
      const a = Math.random() * Math.PI * 2, dist = 300 + Math.random() * 500;
      d.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(0) + 'px');
      d.style.setProperty('--dy', (Math.sin(a) * dist).toFixed(0) + 'px');
      d.style.setProperty('--r', (Math.random() * 720 - 360).toFixed(0) + 'deg');
      d.style.setProperty('--s', (20 + Math.random() * 60).toFixed(0) + 'px');
      const pt = () => `${(Math.random() * 100).toFixed(0)}% ${(Math.random() * 100).toFixed(0)}%`;
      d.style.clipPath = `polygon(${pt()}, ${pt()}, ${pt()})`;
      d.style.animationDelay = (Math.random() * 0.15).toFixed(2) + 's';
      fx.appendChild(d);
    }
    for (let i = 0; i < 140; i++) {
      const life = rand(2, 3.5);
      state.parts.push({ conf: true, x: rand(0, W), y: rand(-200, -10), vx: rand(-40, 40), vy: rand(40, 160), rot: rand(0, TAU), vr: rand(-8, 8), life, max: life, sz: rand(6, 12), c: SHADES[Math.random() * 4 | 0] });
    }
    state.flash = 0.8;
  }

  // ---------- Actions ----------
  function continueGame() {
    const s = state;
    Object.assign(s, { lives: CONTINUE_LIVES, newBest: false, phase: 'play', power: Math.max(2, s.power) });
    if (s.special.ammo < 3) s.special.ammo = 3;
    hideOverlay();
    respawn();
  }
  function nextLevel() {
    hideOverlay();
    state.newBest = false;
    loadLevel(state.levelIndex + 1);
  }
  function nextLoop() {
    const s = state;
    s.loop++; s.newBest = false;
    hideOverlay();
    loadLevel(0);
  }
  function toggleMute() { sfx.toggle(); if (state.paused) showOverlay('pause'); }
  function togglePause(force) {
    if (state.phase !== 'play') return;
    const next = force === undefined ? !state.paused : force;
    if (next === state.paused) return;
    state.paused = next;
    input.left = input.right = input.up = input.down = input.fire = input.touchFire = false;
    if (next) showOverlay('pause'); else hideOverlay();
  }
  function act(a, data = {}) {
    switch (a) {
      case 'start': case 'retry': case 'again': newGame(0); break;
      case 'lvl': newGame(+data.lvl || 0); break;
      case 'next': nextLevel(); break;
      case 'continue': continueGame(); break;
      case 'endless': nextLoop(); break;
      case 'resume': togglePause(false); break;
      case 'mute': toggleMute(); break;
      case 'quit': toMenu(); break;
      case 'menu': location.href = 'index.html'; break;
    }
  }
  function handleEnter() {
    if (state.paused) return act('resume');
    const map = { menu: 'start', clear: 'next', over: 'continue', win: 'endless' };
    if (map[state.phase]) act(map[state.phase]);
  }

  // ---------- Input ----------
  const MOVE_KEYS = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down'
  };
  const FIRE_KEYS = new Set(['Space', 'KeyJ', 'KeyZ']);
  const SPECIAL_KEYS = new Set(['KeyX', 'KeyK', 'ShiftLeft', 'ShiftRight']);
  window.addEventListener('keydown', e => {
    sfx.ensure();
    const k = MOVE_KEYS[e.code];
    if (k) { e.preventDefault(); input[k] = true; input.mode = 'kbd'; return; }
    if (FIRE_KEYS.has(e.code)) { e.preventDefault(); input.fire = true; if (state.phase === 'play') input.mode = 'kbd'; return; }
    if (SPECIAL_KEYS.has(e.code)) { e.preventDefault(); if (!e.repeat && state.phase === 'play' && !state.paused) input.specialPress = true; return; }
    switch (e.code) {
      case 'KeyP': case 'Escape': e.preventDefault(); togglePause(); break;
      case 'Enter': case 'NumpadEnter': e.preventDefault(); handleEnter(); break;
      case 'KeyM': toggleMute(); break;
    }
    if (DEBUG && state.phase === 'play') {
      const s = state;
      if (e.code === 'KeyN') { s.levelT = s.level.len; s.waveIdx = s.waves.length; }
      if (e.code === 'KeyB' && s.boss) s.boss.hp = 1;
      if (e.code === 'KeyL' && s.levelIndex < LEVELS.length - 1) loadLevel(s.levelIndex + 1);
      if (e.code === 'KeyG') { const ks = Object.keys(ITEMS); s.dbg = ((s.dbg || 0) + 1) % ks.length; dropPickup(s.player.x + 120, s.player.y, ks[s.dbg]); }
      if (e.code === 'KeyI') { s.invincible = !s.invincible; floatText(s.player.x, s.player.y - 40, s.invincible ? 'GOD ON' : 'GOD OFF'); }
    }
  });
  window.addEventListener('keyup', e => {
    const k = MOVE_KEYS[e.code];
    if (k) input[k] = false;
    if (FIRE_KEYS.has(e.code)) input.fire = false;
  });

  function pointerPos(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return [(clientX - r.left) * W / r.width, (clientY - r.top) * H / r.height];
  }
  canvas.addEventListener('mousemove', e => {
    [input.mx, input.my] = pointerPos(e.clientX, e.clientY);
    if (e.movementX || e.movementY) input.mode = 'mouse';
  });
  canvas.addEventListener('mousedown', e => {
    sfx.ensure();
    [input.mx, input.my] = pointerPos(e.clientX, e.clientY);
    input.mode = 'mouse';
    if (e.button === 2) { if (state.phase === 'play' && !state.paused) input.specialPress = true; return; }
    if (e.button === 0) input.fire = true;
  });
  window.addEventListener('mouseup', e => { if (e.button === 0) input.fire = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    sfx.ensure();
    input.mode = 'touch';
    for (const t of e.changedTouches) {
      const [x, y] = pointerPos(t.clientX, t.clientY);
      if (Math.hypot(x - (W - 70), y - (H - 70)) < 54) {
        if (state.phase === 'play' && !state.paused) input.specialPress = true;
        continue;
      }
      if (input.touchId === null) {
        input.touchId = t.identifier; input.tlx = x; input.tly = y; input.touchFire = true;
      } else if (state.phase === 'play' && !state.paused) input.specialPress = true;
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier !== input.touchId) continue;
      const [x, y] = pointerPos(t.clientX, t.clientY);
      input.tdx += x - input.tlx; input.tdy += y - input.tly;
      input.tlx = x; input.tly = y;
    }
  }, { passive: false });
  const touchEnd = e => {
    for (const t of e.changedTouches) if (t.identifier === input.touchId) { input.touchId = null; input.touchFire = false; }
  };
  canvas.addEventListener('touchend', touchEnd);
  canvas.addEventListener('touchcancel', touchEnd);

  overlay.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    sfx.ensure();
    act(b.dataset.act, b.dataset);
  });
  hud.pause.addEventListener('click', () => { hud.pause.blur(); togglePause(); });
  hud.mute.addEventListener('click', () => { hud.mute.blur(); sfx.ensure(); toggleMute(); });
  window.addEventListener('blur', () => {
    input.left = input.right = input.up = input.down = input.fire = input.touchFire = false;
    if (state.phase === 'play') togglePause(true);
  });
  window.addEventListener('resize', resize);

  // ---------- Loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (!state.paused) {
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
    }
    render();
    updateHUD();
    requestAnimationFrame(frame);
  }

  if (DEBUG) window.__si = { state, input, loadLevel, spawnBoss, dropPickup, hurt, BOSSES, step, render, act, useSpecial };

  resize();
  toMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
